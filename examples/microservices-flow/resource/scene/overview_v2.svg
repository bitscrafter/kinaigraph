<svg id="overview_v2" width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- v2 architecture diagram: overview_v1 + a Data Store the User service reads.
       Differences from overview_v1.svg:
         - new node data-store (centered at 1040,360)
         - one new leg: link-store-user (auth is stateless — JWT authn/authz — so it
           does NOT consult the store; only the user service does)
         - auth-service moved up and user-service moved down; step-4 sits at the
           bottom-centre of the user service
       The chevron-packet layer (chevron_layer.svg) is stacked on top, sharing this
       0 0 1280 720 viewBox so move coordinates match.

       Theming: each element carries a class matching its id; the style block below
       maps that class to the kg-* theme variables and the element's typography (one
       class encloses everything a given element needs). Swap the attached theme CSS
       to retheme. -->

  <style>
    .scene-bg      { fill: var(--kg-scene-bg, #1a1a1a); }

    .title         { fill: var(--kg-text-title, #ffffff); font-family: var(--kg-font-family, 			sans-serif); font-size: 26px; font-weight: 600; text-anchor: middle; }
    .store-callout rect,
    .store-callout path { fill: var(--kg-callout-bg, #c5a450); }
    .store-callout text { fill: #222222; font-family: var(--kg-font-family, sans-serif); font-size: 13px; font-weight: 400; font-style: italic; text-anchor: middle; }

    .link-client-gateway,
    .link-gateway-auth,
    .link-gateway-user,
    .link-store-user { stroke: var(--kg-link, #555555); stroke-width: var(--kg-link-width, 2); stroke-dasharray: var(--kg-link-dash, 6 4); }

    .client rect       { fill: var(--kg-node-bg, #333333); stroke: var(--kg-node-stroke, #555555); stroke-width: var(--kg-node-stroke-width, 2); }
    .client text       { fill: var(--kg-text-body, #eeeeee); font-family: var(--kg-font-family, sans-serif); font-size: 14px; text-anchor: middle; }

    .api-gateway rect  { fill: var(--kg-group-bg, #222222); stroke: var(--kg-group-stroke, #444444); stroke-width: var(--kg-group-stroke-width, 2); }
    .api-gateway text  { fill: var(--kg-text-title, #cccccc); font-family: var(--kg-font-family, sans-serif); font-size: 16px; font-weight: bold; text-anchor: middle; }

    .auth-service rect { fill: var(--kg-node-bg, #333333); stroke: var(--kg-node-stroke, #555555); stroke-width: var(--kg-node-stroke-width, 2); }
    .auth-service text { fill: var(--kg-text-body, #eeeeee); font-family: var(--kg-font-family, sans-serif); font-size: 14px; text-anchor: middle; }

    .data-store rect   { fill: var(--kg-node-bg, #333333); stroke: var(--kg-node-stroke, #555555); stroke-width: var(--kg-node-stroke-width, 2); }
    .data-store text   { fill: var(--kg-text-body, #eeeeee); font-family: var(--kg-font-family, sans-serif); font-size: 14px; text-anchor: middle; }

    .user-service rect { fill: var(--kg-node-bg, #333333); stroke: var(--kg-node-stroke, #555555); stroke-width: var(--kg-node-stroke-width, 2); }
    .user-service text { fill: var(--kg-text-body, #eeeeee); font-family: var(--kg-font-family, sans-serif); font-size: 14px; text-anchor: middle; }

    .step-1-badge circle, .step-2-badge circle, .step-3-badge circle, .step-4-badge circle {
      fill: var(--kg-step-bg, #444444); stroke: var(--kg-step-stroke, #888888); stroke-width: var(--kg-badge-stroke-width, 1.5);
    }
    .step-1-badge text, .step-2-badge text, .step-3-badge text, .step-4-badge text {
      fill: var(--kg-text-title, #ffffff); font-family: var(--kg-font-family, sans-serif); font-size: 13px; font-weight: bold; text-anchor: middle;
    }
  </style>

  <rect class="scene-bg" width="1280" height="720" />

  <text id="title" class="title" x="640" y="115" text-anchor="middle">Microservices Request Flow</text>

  <!-- Connection lines (center-to-center); in-box portions hidden by the node groups. -->
  <line id="link-client-gateway" class="link-client-gateway" x1="240" y1="360" x2="640" y2="360" />
  <line id="link-gateway-auth" class="link-gateway-auth" x1="700" y1="360" x2="980" y2="220" />
  <line id="link-gateway-user" class="link-gateway-user" x1="700" y1="360" x2="980" y2="500" />
  <line id="link-store-user" class="link-store-user" x1="1040" y1="460" x2="1040" y2="385" />

  <g id="client" class="client">
    <rect x="190" y="310" width="100" height="100" rx="10" />
    <text x="240" y="365">Client</text>
  </g>

  <g id="api-gateway" class="api-gateway">
    <rect x="580" y="260" width="120" height="200" rx="10" />
    <text x="640" y="365">API Gateway</text>
  </g>

  <!-- Auth moved up (center 1040,220). -->
  <g id="auth-service" class="auth-service">
    <rect x="980" y="180" width="120" height="80" rx="8" />
    <text x="1040" y="225">Auth Service</text>
  </g>

  <!-- The added shared store (center 1040,360). -->
  <g id="data-store" class="data-store">
    <rect id="data-store-box" x="980" y="335" width="120" height="50" rx="8" />
    <text x="1040" y="365">Data Store</text>
  </g>

  <!-- User moved down (center 1040,500). -->
  <g id="user-service" class="user-service">
    <rect x="980" y="460" width="120" height="80" rx="8" />
    <text x="1040" y="505">User Service</text>
  </g>

  <!-- Speech-bubble callout — fades in (scene_03) to announce the newly added store.
       Tail points left at the data-store; two text lines. -->
  <g id="store-callout" class="store-callout" opacity="1">
    <rect x="1120" y="340" width="100" height="40" rx="10" />
    <path d="M1120,354 L1106,360 L1120,366 Z" />
    <text x="1170" y="358" text-anchor="middle">now with a</text>
    <text x="1170" y="372" text-anchor="middle">data store</text>
  </g>

  <g id="step-1-badge" class="step-1-badge">
    <circle cx="240" cy="285" r="14" />
    <text x="240" y="290">1</text>
  </g>

  <g id="step-2-badge" class="step-2-badge">
    <circle cx="640" cy="240" r="14" />
    <text x="640" y="245">2</text>
  </g>

  <!-- Step 3 follows auth up. -->
  <g id="step-3-badge" class="step-3-badge">
    <circle cx="1040" cy="155" r="14" />
    <text x="1040" y="160">3</text>
  </g>

  <!-- Step 4 at the bottom-centre of the user service. -->
  <g id="step-4-badge" class="step-4-badge">
    <circle cx="1040" cy="560" r="14" />
    <text x="1040" y="565">4</text>
  </g>

</svg>
