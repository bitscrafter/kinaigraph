# ------------------------------------------
# Microservices Flow - Scene 02: Per-step narration, synced motion
# ------------------------------------------
# The detailed beat. Scene 02 is Scene 01 with the SAME six-leg sweep, the same
# two alternating chevrons, and the same pulse choreography — ONLY the narration
# changes. Instead of one narration split into six equal legs, each leg is fitted
# to its own shot's duration, and the five shots are grouped across the sweep:
#
#   step 00 (intro)                       01_intro       (all four nodes pulse)
#   leg 1  client       -> api-gateway    02_client_to_gateway  (api-gateway pulses)
#   leg 2  api-gateway  -> auth-service   03_auth  first half   (auth-service pulses)
#   leg 3  auth-service -> api-gateway    03_auth  second half  (api-gateway pulses)
#   leg 4  api-gateway  -> user-service   04_user  first half   (user-service pulses)
#   leg 5  user-service -> api-gateway    04_user  second half  (api-gateway pulses)
#   leg 6  api-gateway  -> client         05_response    (client pulses)
#
# So legs 2+3 together span the auth shot and legs 4+5 together span the user shot
# (each of those legs is half its shot); legs 1 and 6 each get their own shot. The
# intro shot plays over a dedicated step-00 beat where the diagram holds and
# nothing sweeps. setup and tear_down are silent.
#
# Pulses match Scene 01: step 00 is an establishing beat where all four services
# pulse once together, then only the RECEIVING node of each leg pulses as the
# packet arrives (api-gateway is the hub, so it reacts on legs 1/3/5). Everything
# else mirrors Scene 01 too: two chevron actors take turns (right runs legs 1/2/4,
# left runs legs 3/5/6), each leg is a `move` whose sub-actions reveal and
# traverse together (the move's `from`/`to` anchors fix the start point, so the
# paired `show` reveals the chevron already in place — no wrong-position flash),
# the chevron fades in once at leg 1 and out once at leg 6, and the whole thing is
# framed by a VIDEO_MARGIN of quiet at head and tail. Beats are separate
# timestamps chained by `.end`.
#
# Dark theme throughout the showcase until Scene 04.

defs:
    assets:
        # Bottom layer: the static architecture diagram (no data store yet — added in Scene 03).
        diagram:
            type: "scene"
            file: "./resources/diagram/overview_v1.svg"

        # Top layer: the chevron-packet, stacked over the diagram (shared 0 0 1280 720 viewBox).
        chevron_layer:
            type: "scene"
            file: "./resources/diagram/chevron_layer.svg"

        # Right-pointing chevron — used for the outbound legs (1, 2, 4).
        chevron_marker:
            type: "actor"
            part_of: chevron_layer
            id: chevron-packet
            origin: center

        # Left-pointing chevron — used for the return legs (3, 5, 6).
        chevron_marker_left:
            type: "actor"
            part_of: chevron_layer
            id: chevron-packet-left
            origin: center

        template:
            type: "template"
            file: "./resources/template/main.html"
            style: style

        style:
            type: "style"
            file: "./resources/css/theme_dark.css"

        # One narration shot per beat (Scene 01 used a single intro shot).
        audio_shot_01_intro:
            type: "audio"
            file: "./audio/scene_02_01_intro.mp3"
        audio_shot_02_client_to_gateway:
            type: "audio"
            file: "./audio/scene_02_02_client_to_gateway.mp3"
        audio_shot_03_auth:
            type: "audio"
            file: "./audio/scene_02_03_auth.mp3"
        audio_shot_04_user:
            type: "audio"
            file: "./audio/scene_02_04_user.mp3"
        audio_shot_05_response:
            type: "audio"
            file: "./audio/scene_02_05_response.mp3"

    const:
        FADE_WINDOW: 300
        VIDEO_MARGIN: 500
        STEP_PADDING: 150

        # Pulse cycles per node — change here to retune every node at once.
        PULSE_CYCLES: 2

        # Chevron end-cap insets near each node, and the perpendicular offset that
        # keeps the chevron riding just off the connector line. The diagram nodes
        # live in a different scene (`diagram`) from the chevron (`chevron_layer`);
        # cross-scene anchors within a section resolve in the shared canvas, so the
        # chevron tracks the real node geometry instead of hard-coded coordinates.
        CHEVRON_INSET: 16
        CHEVRON_INSET_UP_LEFT: 31
        CHEVRON_INSET_UP_RIGHT: 11
        CHEVRON_INSET_DOWN_LEFT: 31
        CHEVRON_INSET_DOWN_RIGHT: 11
        CHEVRON_DISTANCE: 16

animation:
    defaults:
        assets:
            scene: diagram

    timeline:
        # Each beat is its own timestamp, chained by `.end` so the timing reads
        # top-to-bottom. Step 00 pulses all nodes over the intro shot; each leg
        # then pulses only the node the packet arrives at, concurrently with the
        # traversal.
        0 @ setup_ts:
            # --- Stage: diagram up; head VIDEO_MARGIN pad of quiet before the intro ---
            - diagram:
                  - show:
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"

            # --- Initial chevron state: both hidden ---
            - chevron_marker:
                  - show:
                        opacity: 0
            - chevron_marker_left:
                  - show:
                        opacity: 0

        # --- Step 00: establishing beat — all four nodes pulse once together
        #     over the intro shot; diagram holds, nothing sweeps yet. ---
        setup_ts.end @ intro_ts:
            - diagram:
                  - show:
                        opacity: 1
                        hold:
                            after: "audio_shot_01_intro.duration"
            - client:
                  - pulse:
                        duration: "audio_shot_01_intro.duration"
                        cycles: PULSE_CYCLES
                        stroke: 'css("kg-pulse-stroke")'
                        stroke_width: 'css("kg-pulse-stroke-width")'
            - api-gateway:
                  - pulse:
                        duration: "audio_shot_01_intro.duration"
                        cycles: PULSE_CYCLES
                        stroke: 'css("kg-pulse-stroke")'
                        stroke_width: 'css("kg-pulse-stroke-width")'
            - auth-service:
                  - pulse:
                        duration: "audio_shot_01_intro.duration"
                        cycles: PULSE_CYCLES
                        stroke: 'css("kg-pulse-stroke")'
                        stroke_width: 'css("kg-pulse-stroke-width")'
            - user-service:
                  - pulse:
                        duration: "audio_shot_01_intro.duration"
                        cycles: PULSE_CYCLES
                        stroke: 'css("kg-pulse-stroke")'
                        stroke_width: 'css("kg-pulse-stroke-width")'

        # --- Leg 1: client -> api-gateway, over the client_to_gateway shot ---
        intro_ts.end @ step_01_ts:
            - chevron_marker:
                  - move:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_02_client_to_gateway.duration"
                        easing: ease_in_out_quad
                        actions:
                            - show:
                                  duration: FADE_WINDOW
                                  opacity: 1

                            - move:
                                  from:
                                      anchor:
                                          asset: diagram::client
                                          pos: center_right
                                  to:
                                      anchor:
                                          asset: diagram::api-gateway
                                          pos: center_left
                                  inset:
                                      from: CHEVRON_INSET
                                      to: CHEVRON_INSET
                                  lateral:
                                      side: left
                                      distance: CHEVRON_DISTANCE
            - api-gateway:
                  - pulse:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_02_client_to_gateway.duration"
                        cycles: PULSE_CYCLES
                        stroke: 'css("kg-arrive-stroke")'
                        stroke_width: 'css("kg-pulse-stroke-width")'

        # --- Leg 2: api-gateway -> auth-service, first half of the auth shot ---
        step_01_ts.end @ step_02_ts:
            - chevron_marker:
                  - move:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_03_auth.duration / 2"
                        easing: ease_in_out_quad
                        actions:
                            - show:
                                  duration: 0
                                  opacity: 1

                            - move:
                                  from:
                                      anchor:
                                          asset: diagram::api-gateway
                                          pos: center_right
                                  to:
                                      anchor:
                                          asset: diagram::auth-service
                                          pos: center_left
                                  inset:
                                      from: CHEVRON_INSET_UP_LEFT
                                      to: CHEVRON_INSET_UP_RIGHT
                                  lateral:
                                      side: left
                                      distance: CHEVRON_DISTANCE
            - auth-service:
                  - pulse:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_03_auth.duration / 2"
                        cycles: PULSE_CYCLES
                        stroke: 'css("kg-arrive-stroke")'
                        stroke_width: 'css("kg-pulse-stroke-width")'

        # --- Leg 3: auth-service -> api-gateway, second half of the auth shot ---
        step_02_ts.end @ step_03_ts:
            - chevron_marker:
                  - show:
                        opacity: 0
            - chevron_marker_left:
                  - move:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_03_auth.duration / 2"
                        easing: ease_in_out_quad
                        actions:
                            - show:
                                  duration: 0
                                  opacity: 1

                            - move:
                                  from:
                                      anchor:
                                          asset: diagram::auth-service
                                          pos: center_left
                                  to:
                                      anchor:
                                          asset: diagram::api-gateway
                                          pos: center_right
                                  inset:
                                      from: CHEVRON_INSET_UP_RIGHT
                                      to: CHEVRON_INSET_UP_LEFT
                                  lateral:
                                      side: right
                                      distance: CHEVRON_DISTANCE
            - api-gateway:
                  - pulse:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_03_auth.duration / 2"
                        cycles: PULSE_CYCLES
                        stroke: 'css("kg-arrive-stroke")'
                        stroke_width: 'css("kg-pulse-stroke-width")'

        # --- Leg 4: api-gateway -> user-service, first half of the user shot ---
        step_03_ts.end @ step_04_ts:
            - chevron_marker_left:
                  - show:
                        opacity: 0
            - chevron_marker:
                  - move:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_04_user.duration / 2"
                        easing: ease_in_out_quad
                        actions:
                            - show:
                                  duration: 0
                                  opacity: 1
                            - move:
                                  from:
                                      anchor:
                                          asset: diagram::api-gateway
                                          pos: center_right
                                  to:
                                      anchor:
                                          asset: diagram::user-service
                                          pos: center_left
                                  inset:
                                      from: CHEVRON_INSET_DOWN_LEFT
                                      to: CHEVRON_INSET_DOWN_RIGHT
                                  lateral:
                                      side: right
                                      distance: CHEVRON_DISTANCE
            - user-service:
                  - pulse:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_04_user.duration / 2"
                        cycles: PULSE_CYCLES
                        stroke: 'css("kg-arrive-stroke")'
                        stroke_width: 'css("kg-pulse-stroke-width")'

        # --- Leg 5: user-service -> api-gateway, second half of the user shot ---
        step_04_ts.end @ step_05_ts:
            - chevron_marker:
                  - show:
                        opacity: 0

            - chevron_marker_left:
                  - move:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_04_user.duration / 2"
                        easing: ease_in_out_quad
                        actions:
                            - show:
                                  duration: 0
                                  opacity: 1
                            - move:
                                  from:
                                      anchor:
                                          asset: diagram::user-service
                                          pos: center_left
                                  to:
                                      anchor:
                                          asset: diagram::api-gateway
                                          pos: center_right
                                  inset:
                                      from: CHEVRON_INSET_DOWN_RIGHT
                                      to: CHEVRON_INSET_DOWN_LEFT
                                  lateral:
                                      side: left
                                      distance: CHEVRON_DISTANCE
            - api-gateway:
                  - pulse:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_04_user.duration / 2"
                        cycles: PULSE_CYCLES
                        stroke: 'css("kg-arrive-stroke")'
                        stroke_width: 'css("kg-pulse-stroke-width")'

        # --- Leg 6: api-gateway -> client, over the response shot; chevron fades out ---
        step_05_ts.end @ step_06_ts:
            - chevron_marker:
                  - show:
                        opacity: 0
            - chevron_marker_left:
                  - move:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_05_response.duration"
                        easing: ease_in_out_quad
                        actions:
                            - show:
                                  duration: 0
                                  opacity: 1
                            - move:
                                  from:
                                      anchor:
                                          asset: diagram::api-gateway
                                          pos: center_left
                                  to:
                                      anchor:
                                          asset: diagram::client
                                          pos: center_right
                                  inset: CHEVRON_INSET
                                  lateral:
                                      side: right
                                      distance: CHEVRON_DISTANCE
                                  affinity_family: "final_position"
                            - show:
                                  duration: FADE_WINDOW
                                  opacity: 0
                                  affinity_family: "final_position"
            - client:
                  - pulse:
                        hold:
                            before: "STEP_PADDING"
                        duration: "audio_shot_05_response.duration"
                        cycles: PULSE_CYCLES
                        stroke: 'css("kg-arrive-stroke")'
                        stroke_width: 'css("kg-pulse-stroke-width")'

        # --- Tear-down: diagram holds; tail VIDEO_MARGIN pad of quiet ---
        step_06_ts.end @ tear_down_ts:
            - diagram:
                  - show:
                        hold:
                            after: "VIDEO_MARGIN"
                        opacity: 1

    capture:
        video_animated_scene_02_step_flow:
            output: "./video/scene_02_step_flow_animation.mp4"
            fps: 30

composition:
    context:
        status: active

    # One mix per shot, each placed at its beat's start and playing its full
    # natural duration (from-only span). The intro plays over step 00; the four
    # sweep shots play over their leg groups; setup and tear_down stay silent.
    timeline:
        "0":
            - video_animated_scene_02_step_flow:
                  - roll:
                  - mix:
                        span:
                            from: "animation::intro_ts.start"
                        asset: audio_shot_01_intro
                  - mix:
                        span:
                            from: "animation::step_01_ts.start"
                        asset: audio_shot_02_client_to_gateway
                  - mix:
                        span:
                            from: "animation::step_02_ts.start"
                        asset: audio_shot_03_auth
                  - mix:
                        span:
                            from: "animation::step_04_ts.start"
                        asset: audio_shot_04_user
                  - mix:
                        span:
                            from: "animation::step_06_ts.start"
                        asset: audio_shot_05_response

    capture:
        video_composition_scene_02_step_flow:
            output: "./video/scene_02_step_flow_composition.mp4"
            fps: 30
