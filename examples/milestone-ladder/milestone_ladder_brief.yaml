# ------------------------------------------
# milestone-ladder — the brief
# ------------------------------------------
# Six steps of one life, told at length
#
#     kinaigraph milestone_ladder_brief_tts.yaml   # once, needs an API key
#     kinaigraph milestone_ladder_brief.yaml
#
# ── How a step is built ──────────────────────────────────────────────────────
# Step 1 draws no span — it is the first node, and nothing precedes it. Steps
# 2-6 each draw the span that REACHES them, land the node on the end of it, then
# wait out the rest of their sentence. The waiting is what puts the picture on
# the words: a node finishes arriving before the line explaining it is over.
#
# ⚠️ Every actor id is the node's SLUG, and the script that narrates it carries
# the same slug — `part_03_internship.txt` speaks over `node-internship`.
# Nothing is matched by position, so re-ordering the ladder cannot silently
# pair a line with the wrong node.
#
# ⚠️ `.seg` carries no `stroke-dasharray`, and must not. `reveal` drives that
# same attribute to draw a stroke on progressively, so revealing an
# already-dashed line renders NOTHING, silently.

metadata:
    title: "Milestone Ladder - Brief"
    description: "Six steps of one life, told at length"
    version: "1.0"

defs:
    assets:
        ladder:
            type: "scene"
            file: "./resource/scene/ladder.svg"

        # Declared AFTER the ladder on purpose: scene declaration order is the
        # render z-order, so the glyphs paint over the discs rather than under.
        # It is a separate scene because its glyphs MOVE — a rider has to be able
        # to travel over the rail it rides.
        icons:
            type: "scene"
            file: "./resource/scene/icon_layer.svg"

        # Last, so it sits above everything. Its own scene because it carries
        # ~60 KB of embedded PNG — inside the ladder that payload would be four
        # fifths of the file and bury the geometry.
        brand:
            type: "scene"
            file: "./resource/scene/brand_layer.svg"

        # Present from the first frame — the viewer should know whose life this
        # is before the first step lands.
        title:
            type: "actor"
            part_of: ladder
            id: title

        seg_medical_school:
            type: "actor"
            part_of: ladder
            id: seg-medical-school
        seg_internship:
            type: "actor"
            part_of: ladder
            id: seg-internship
        seg_family:
            type: "actor"
            part_of: ladder
            id: seg-family
        seg_community:
            type: "actor"
            part_of: ladder
            id: seg-community
        seg_teaching:
            type: "actor"
            part_of: ladder
            id: seg-teaching

        node_career_decision:
            type: "actor"
            part_of: ladder
            id: node-career-decision
        label_career_decision:
            type: "actor"
            part_of: ladder
            id: label-career-decision
        node_medical_school:
            type: "actor"
            part_of: ladder
            id: node-medical-school
        label_medical_school:
            type: "actor"
            part_of: ladder
            id: label-medical-school
        node_internship:
            type: "actor"
            part_of: ladder
            id: node-internship
        label_internship:
            type: "actor"
            part_of: ladder
            id: label-internship
        node_family:
            type: "actor"
            part_of: ladder
            id: node-family
        label_family:
            type: "actor"
            part_of: ladder
            id: label-family
        node_community:
            type: "actor"
            part_of: ladder
            id: node-community
        label_community:
            type: "actor"
            part_of: ladder
            id: label-community
        node_teaching:
            type: "actor"
            part_of: ladder
            id: node-teaching
        label_teaching:
            type: "actor"
            part_of: ladder
            id: label-teaching

        audio_01_career_decision:
            type: "audio"
            file: "./resource/audio/brief/part_01_career_decision.mp3"
        audio_02_medical_school:
            type: "audio"
            file: "./resource/audio/brief/part_02_medical_school.mp3"
        audio_03_internship:
            type: "audio"
            file: "./resource/audio/brief/part_03_internship.mp3"
        audio_04_family:
            type: "audio"
            file: "./resource/audio/brief/part_04_family.mp3"
        audio_05_community:
            type: "audio"
            file: "./resource/audio/brief/part_05_community.mp3"
        audio_06_teaching:
            type: "audio"
            file: "./resource/audio/brief/part_06_teaching.mp3"

        icon_career_decision:
            type: "actor"
            part_of: icons
            id: icon-career-decision
            origin: center
        icon_medical_school:
            type: "actor"
            part_of: icons
            id: icon-medical-school
            origin: center
        icon_internship:
            type: "actor"
            part_of: icons
            id: icon-internship
            origin: center
        icon_family:
            type: "actor"
            part_of: icons
            id: icon-family
            origin: center
        icon_community:
            type: "actor"
            part_of: icons
            id: icon-community
            origin: center
        icon_teaching:
            type: "actor"
            part_of: icons
            id: icon-teaching
            origin: center

        brand_mark:
            type: "actor"
            part_of: brand
            id: brand-mark

        template:
            type: "template"
            file: "./resource/template/main.html"
        style:
            type: "style"
            file: "./resource/style/theme_ladder.css"
            themes:
                - dark
                - care

    defaults:
        assets:
            template:
                asset: template
                style:
                    asset: style
                    theme: dark

    const:
        # Quiet before the first word and after the last, so the piece does not
        # start or stop on a syllable.
        VIDEO_MARGIN: 350

        # How long a span takes to draw and a node to land. Both stay well under
        # the shortest clip, so even the quickest step is fully on screen before
        # its sentence ends.
        #
        # ⚠️ NODE_FADE_MS comes off every step's hold, so it is bounded by the
        # SHORTEST clip in this cut, not the average. Raising it past that leaves
        # a negative hold.
        SEG_DRAW_MS: 320
        NODE_FADE_MS: 4000

        # How long a glyph takes to ride the span that reaches its node. Well
        # under the shortest clip (9.10 s), so it lands mid-sentence rather
        # than after it.
        ICON_TRAVEL_MS: 1800

        # Each step waits out the remainder of its own line. Step 1 draws no
        # span, so only the node fade comes off its clip.
        STEP_1_HOLD_MS: "audio_01_career_decision.duration - NODE_FADE_MS"
        STEP_2_HOLD_MS: "audio_02_medical_school.duration - SEG_DRAW_MS - NODE_FADE_MS"
        STEP_3_HOLD_MS: "audio_03_internship.duration - SEG_DRAW_MS - NODE_FADE_MS"
        STEP_4_HOLD_MS: "audio_04_family.duration - SEG_DRAW_MS - NODE_FADE_MS"
        STEP_5_HOLD_MS: "audio_05_community.duration - SEG_DRAW_MS - NODE_FADE_MS"
        STEP_6_HOLD_MS: "audio_06_teaching.duration - SEG_DRAW_MS - NODE_FADE_MS"

animation:
    timeline:
        # The stage, the track and the title are there from the first frame. The
        # unwalked road being visible is the point: the shape of the life is
        # legible before any of it has happened.
        0 @ setup:
            - title:
                  - show:
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"
            - brand_mark:
                  - show:
                        opacity: 1
            - node_career_decision:
                  - show:
                        opacity: 0
            - label_career_decision:
                  - show:
                        opacity: 0
            - node_medical_school:
                  - show:
                        opacity: 0
            - label_medical_school:
                  - show:
                        opacity: 0
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` puts it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - node_internship:
                  - show:
                        opacity: 0
            - label_internship:
                  - show:
                        opacity: 0
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` puts it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - node_family:
                  - show:
                        opacity: 0
            - label_family:
                  - show:
                        opacity: 0
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` puts it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - node_community:
                  - show:
                        opacity: 0
            - label_community:
                  - show:
                        opacity: 0
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` puts it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - node_teaching:
                  - show:
                        opacity: 0
            - label_teaching:
                  - show:
                        opacity: 0
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` puts it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - seg_medical_school:
                  - show:
                        opacity: 0
            - seg_internship:
                  - show:
                        opacity: 0
            - seg_family:
                  - show:
                        opacity: 0
            - seg_community:
                  - show:
                        opacity: 0
            - seg_teaching:
                  - show:
                        opacity: 0
            - icon_career_decision:
                  - show:
                        opacity: 0
            - icon_medical_school:
                  - show:
                        opacity: 0
            - icon_internship:
                  - show:
                        opacity: 0
            - icon_family:
                  - show:
                        opacity: 0
            - icon_community:
                  - show:
                        opacity: 0
            - icon_teaching:
                  - show:
                        opacity: 0

        # ── Step 1 — no span precedes the first node ────────────────────────
        setup.end @ step_1:
            - node_career_decision:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            - label_career_decision:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_1_HOLD_MS"
            - icon_career_decision:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back

        step_1.end @ step_2:
            - seg_medical_school:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_medical_school:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            - label_medical_school:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_2_HOLD_MS"
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` places it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - icon_medical_school:
                  - show:
                        opacity: 1
                  - move:
                        duration: ICON_TRAVEL_MS
                        easing: ease_in_out_quad
                        along: ladder::seg_medical_school

        step_2.end @ step_3:
            - seg_internship:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_internship:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            - label_internship:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_3_HOLD_MS"
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` places it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - icon_internship:
                  - show:
                        opacity: 1
                  - move:
                        duration: ICON_TRAVEL_MS
                        easing: ease_in_out_quad
                        along: ladder::seg_internship

        step_3.end @ step_4:
            - seg_family:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_family:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            - label_family:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_4_HOLD_MS"
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` places it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - icon_family:
                  - show:
                        opacity: 1
                  - move:
                        duration: ICON_TRAVEL_MS
                        easing: ease_in_out_quad
                        along: ladder::seg_family

        step_4.end @ step_5:
            - seg_community:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_community:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            - label_community:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_5_HOLD_MS"
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` places it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - icon_community:
                  - show:
                        opacity: 1
                  - move:
                        duration: ICON_TRAVEL_MS
                        easing: ease_in_out_quad
                        along: ladder::seg_community

        step_5.end @ step_6:
            - seg_teaching:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_teaching:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            - label_teaching:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_6_HOLD_MS"
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` places it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - icon_teaching:
                  - show:
                        opacity: 1
                  - move:
                        duration: ICON_TRAVEL_MS
                        easing: ease_in_out_quad
                        along: ladder::seg_teaching

        # The closing quiet, so the last line lands before the picture cuts.
        step_6.end @ teardown:
            - title:
                  - show:
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"

    capture:
        milestone_ladder_brief_silent:
            output: "./resource/video/milestone_ladder_brief_silent.mp4"
            fps: 30

composition:
    context:
        status: active

    timeline:
        # ⚠️ Every mix carries an explicit `span.from`. A spanless mix at a
        # non-zero timestamp hits a known defect that places the audio at output
        # 0 — which here would stack all six lines on the first frame.
        "0":
            - milestone_ladder_brief_silent:
                  - roll:
                  - mix:
                        span:
                            from: "animation::step_1.start"
                        asset: audio_01_career_decision
                  - mix:
                        span:
                            from: "animation::step_2.start"
                        asset: audio_02_medical_school
                  - mix:
                        span:
                            from: "animation::step_3.start"
                        asset: audio_03_internship
                  - mix:
                        span:
                            from: "animation::step_4.start"
                        asset: audio_04_family
                  - mix:
                        span:
                            from: "animation::step_5.start"
                        asset: audio_05_community
                  - mix:
                        span:
                            from: "animation::step_6.start"
                        asset: audio_06_teaching

    capture:
        milestone_ladder_brief:
            output: "./milestone_ladder_brief.mp4"
            fps: 30
