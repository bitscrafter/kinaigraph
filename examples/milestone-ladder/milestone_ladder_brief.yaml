# ------------------------------------------
# milestone-ladder — the brief
# ------------------------------------------
# Six steps of one life, told at length
#
#     kinaigraph narrate_brief.yaml   # once, needs an API key
#     kinaigraph milestone_ladder_brief.yaml
#
# ── How a step is built ──────────────────────────────────────────────────────
# Step 1 draws no span — it is the first node, and nothing precedes it. Steps
# 2-6 each draw the span that REACHES them, land the node on the end of it, then
# wait out the rest of their sentence. The waiting is what puts the picture on
# the words: a node finishes arriving before the line explaining it is over.
#
# ⚠️ Every actor id is the node's SLUG, and the script that narrates it carries
# the same slug — `part_03_internship.txt` speaks over `node-internship`.
# Nothing is matched by position, so re-ordering the ladder cannot silently
# pair a line with the wrong node.
#
# ⚠️ `.seg` carries no `stroke-dasharray`, and must not. `reveal` drives that
# same attribute to draw a stroke on progressively, so revealing an
# already-dashed line renders NOTHING, silently.

metadata:
    title: "Milestone Ladder - Brief"
    description: "Six steps of one life, told at length"
    version: "1.0"

defs:
    assets:
        ladder:
            type: "scene"
            file: "./resource/scene/ladder.svg"

        # Declared AFTER the ladder on purpose: scene declaration order is the
        # render z-order, so the glyphs paint over the discs rather than under.
        # It is a separate scene because its glyphs MOVE — a rider has to be able
        # to travel over the rail it rides.
        icons:
            type: "scene"
            file: "./resource/scene/icon_layer.svg"

        # Last, so it sits above everything. Its own scene because it carries
        # ~60 KB of embedded PNG — inside the ladder that payload would be four
        # fifths of the file and bury the geometry.
        brand:
            type: "scene"
            file: "./resource/scene/brand_layer.svg"

        # Present from the first frame — the viewer should know whose life this
        # is before the first step lands.
        title:
            type: "actor"
            part_of: ladder
            id: title

        seg_medical_school:
            type: "actor"
            part_of: ladder
            id: seg-medical-school
        seg_internship:
            type: "actor"
            part_of: ladder
            id: seg-internship
        seg_family:
            type: "actor"
            part_of: ladder
            id: seg-family
        seg_community:
            type: "actor"
            part_of: ladder
            id: seg-community
        seg_teaching:
            type: "actor"
            part_of: ladder
            id: seg-teaching

        node_career_decision:
            type: "actor"
            part_of: ladder
            id: node-career-decision
        label_career_decision:
            type: "actor"
            part_of: ladder
            id: label-career-decision
        node_medical_school:
            type: "actor"
            part_of: ladder
            id: node-medical-school
        label_medical_school:
            type: "actor"
            part_of: ladder
            id: label-medical-school
        node_internship:
            type: "actor"
            part_of: ladder
            id: node-internship
        label_internship:
            type: "actor"
            part_of: ladder
            id: label-internship
        node_family:
            type: "actor"
            part_of: ladder
            id: node-family
        label_family:
            type: "actor"
            part_of: ladder
            id: label-family
        node_community:
            type: "actor"
            part_of: ladder
            id: node-community
        label_community:
            type: "actor"
            part_of: ladder
            id: label-community
        node_teaching:
            type: "actor"
            part_of: ladder
            id: node-teaching
        label_teaching:
            type: "actor"
            part_of: ladder
            id: label-teaching

        audio_01_career_decision:
            type: "audio"
            file: "./resource/audio/brief/part_01_career_decision.mp3"
        audio_02_medical_school:
            type: "audio"
            file: "./resource/audio/brief/part_02_medical_school.mp3"
        audio_03_internship:
            type: "audio"
            file: "./resource/audio/brief/part_03_internship.mp3"
        audio_04_family:
            type: "audio"
            file: "./resource/audio/brief/part_04_family.mp3"
        audio_05_community:
            type: "audio"
            file: "./resource/audio/brief/part_05_community.mp3"
        audio_06_teaching:
            type: "audio"
            file: "./resource/audio/brief/part_06_teaching.mp3"

        icon_career_decision:
            type: "actor"
            part_of: icons
            id: icon-career-decision
            origin: center
        icon_medical_school:
            type: "actor"
            part_of: icons
            id: icon-medical-school
            origin: center
        icon_internship:
            type: "actor"
            part_of: icons
            id: icon-internship
            origin: center
        icon_family:
            type: "actor"
            part_of: icons
            id: icon-family
            origin: center
        icon_community:
            type: "actor"
            part_of: icons
            id: icon-community
            origin: center
        icon_teaching:
            type: "actor"
            part_of: icons
            id: icon-teaching
            origin: center

        brand_mark:
            type: "actor"
            part_of: brand
            id: brand-mark

        template:
            type: "template"
            file: "./resource/template/main.html"
        style:
            type: "style"
            file: "./resource/style/theme_ladder.css"
            themes:
                - dark
                - care

        # ⚡ EVERYTHING THAT HAS NOT HAPPENED YET, hidden in one line. A group
        # BROADCASTS — it expands into one instruction per member, so each of
        # these is still addressed on its own beat later. This replaced 23
        # identical entries whose only content was "not yet".
        not_yet:
            type: "group"
            member_type: "actor"
            members: [node_career_decision, label_career_decision, node_medical_school, label_medical_school,
                node_internship, label_internship, node_family, label_family, node_community,
                label_community, node_teaching, label_teaching, seg_medical_school, seg_internship,
                seg_family, seg_community, seg_teaching, icon_career_decision, icon_medical_school,
                icon_internship, icon_family, icon_community, icon_teaching]

    defaults:
        assets:
            template:
                asset: template
                style:
                    asset: style
                    theme: dark


    const:
        # Quiet before the first word and after the last, so the piece does not
        # start or stop on a syllable.
        VIDEO_MARGIN: 350

        # How long a span takes to draw, and how long a node takes to land.
        #
        # ⚠️ SEG_DRAW_MS is the reveal's OWN duration and nothing else. It does not
        # enter the step arithmetic: every actor in a step starts at the step's
        # start, so the span finishes drawing well inside the step regardless.
        # It was subtracted from the hold until 2026-09-10, left over from when
        # the label waited for the span before fading in — which made the real gap
        # between lines 180 ms rather than the 500 asked for.
        SEG_DRAW_MS: 320
        NODE_FADE_MS: 4000

        # How long a glyph takes to ride the span that reaches its node. Well
        # under the shortest clip (9.10 s), so it lands mid-sentence rather
        # than after it.
        ICON_TRAVEL_MS: 1800

        # A beat of quiet between one line and the next. A step lasts exactly its
        # own clip, so without this the next line begins on the frame the last one
        # ends — six sentences with no breath between them.
        #
        # ⚠️ Added to steps 1-5 only. Step 6 is followed by the teardown's
        # VIDEO_MARGIN, and a gap there would just lengthen the closing silence.
        STEP_GAP_MS: 500

        # A step lasts exactly its own clip plus the gap. The step ends when its
        # LONGEST actor chain does, and that is the label: NODE_FADE_MS + hold. So
        # the hold is whatever is left of the clip after the fade —
        #
        #     step = NODE_FADE_MS + (clip - NODE_FADE_MS + GAP) = clip + GAP
        #
        # ⚠️ NODE_FADE_MS cancels out of the step length, so it does not affect
        # pacing at all; it is bounded only by needing a non-negative hold, i.e.
        # NODE_FADE_MS <= shortest clip + GAP.
        STEP_1_HOLD_MS: "audio_01_career_decision.duration - NODE_FADE_MS + STEP_GAP_MS"
        STEP_2_HOLD_MS: "audio_02_medical_school.duration - NODE_FADE_MS + STEP_GAP_MS"
        STEP_3_HOLD_MS: "audio_03_internship.duration - NODE_FADE_MS + STEP_GAP_MS"
        STEP_4_HOLD_MS: "audio_04_family.duration - NODE_FADE_MS + STEP_GAP_MS"
        STEP_5_HOLD_MS: "audio_05_community.duration - NODE_FADE_MS + STEP_GAP_MS"
        STEP_6_HOLD_MS: "audio_06_teaching.duration - NODE_FADE_MS"

animation:
    timeline:
        # The stage, the track and the title are there from the first frame. The
        # unwalked road being visible is the point: the shape of the life is
        # legible before any of it has happened.
        0 @ setup:
            # ⚡ THE TITLE SETS THE LENGTH of this beat; everything else here
            # lands instantly. Listed first so the beat's duration is the first
            # thing read.
            - title:
                  - show:
                        hold:
                            after: "VIDEO_MARGIN"
                        opacity: 1
            - brand_mark:
                  - show:
                        opacity: 1
            # ⚠️ NOTHING FADES IN HERE, including the glyphs. A glyph faded in
            # would fade in at its RESTING position and then snap back to the
            # start of its rail; it is hidden outright and placed by `move` on
            # the frame it appears.
            - not_yet:
                  - show:
                        opacity: 0

        setup.end @ step_1:
            - label_career_decision:
                  - show:
                        hold:
                            after: "STEP_1_HOLD_MS"
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - node_career_decision:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            - icon_career_decision:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back

        step_1.end @ step_2:
            - label_medical_school:
                  - show:
                        hold:
                            after: "STEP_2_HOLD_MS"
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - seg_medical_school:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_medical_school:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` places it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - icon_medical_school:
                  - show:
                        opacity: 1
                  - move:
                        duration: ICON_TRAVEL_MS
                        easing: ease_in_out_quad
                        along: ladder::seg_medical_school

        step_2.end @ step_3:
            - label_internship:
                  - show:
                        hold:
                            after: "STEP_3_HOLD_MS"
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - seg_internship:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_internship:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` places it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - icon_internship:
                  - show:
                        opacity: 1
                  - move:
                        duration: ICON_TRAVEL_MS
                        easing: ease_in_out_quad
                        along: ladder::seg_internship

        step_3.end @ step_4:
            - label_family:
                  - show:
                        hold:
                            after: "STEP_4_HOLD_MS"
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - seg_family:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_family:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` places it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - icon_family:
                  - show:
                        opacity: 1
                  - move:
                        duration: ICON_TRAVEL_MS
                        easing: ease_in_out_quad
                        along: ladder::seg_family

        step_4.end @ step_5:
            - label_community:
                  - show:
                        hold:
                            after: "STEP_5_HOLD_MS"
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - seg_community:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_community:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` places it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - icon_community:
                  - show:
                        opacity: 1
                  - move:
                        duration: ICON_TRAVEL_MS
                        easing: ease_in_out_quad
                        along: ladder::seg_community

        step_5.end @ step_6:
            - label_teaching:
                  - show:
                        hold:
                            after: "STEP_6_HOLD_MS"
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - seg_teaching:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_teaching:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        scale:
                            from: 0.7
                            to: 1
                        easing: ease_out_back
            # ⚠️ `show` carries no duration, so it lands instantly — the glyph
            # becomes visible and `move` places it at the span's start on the same
            # frame. Fading it in first would fade it in at its RESTING position
            # and then snap it back to the start of the rail.
            - icon_teaching:
                  - show:
                        opacity: 1
                  - move:
                        duration: ICON_TRAVEL_MS
                        easing: ease_in_out_quad
                        along: ladder::seg_teaching

        # The closing quiet, so the last line lands before the picture cuts.
        step_6.end @ teardown:
            - title:
                  - show:
                        hold:
                            after: "VIDEO_MARGIN"
                        opacity: 1

    capture:
        milestone_ladder_brief_silent:
            output: "./resource/video/milestone_ladder_brief_silent.mp4"
            fps: 30

composition:
    context:
        status: active

    timeline:
        # ⚠️ Every mix carries an explicit `span.from`. A spanless mix at a
        # non-zero timestamp hits a known defect that places the audio at output
        # 0 — which here would stack all six lines on the first frame.
        "0":
            - milestone_ladder_brief_silent:
                  - roll:
                  - mix:
                        span:
                            from: "animation::step_1.start"
                        asset: audio_01_career_decision
                  - mix:
                        span:
                            from: "animation::step_2.start"
                        asset: audio_02_medical_school
                  - mix:
                        span:
                            from: "animation::step_3.start"
                        asset: audio_03_internship
                  - mix:
                        span:
                            from: "animation::step_4.start"
                        asset: audio_04_family
                  - mix:
                        span:
                            from: "animation::step_5.start"
                        asset: audio_05_community
                  - mix:
                        span:
                            from: "animation::step_6.start"
                        asset: audio_06_teaching

    capture:
        milestone_ladder_brief:
            output: "./milestone_ladder_brief.mp4"
            fps: 30
