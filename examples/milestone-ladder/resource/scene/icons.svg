<!--
  Icons for milestone-ladder — COPIED from the shared catalog at
  `tech-docs/internal/design/diagram/icon-catalog.svg` in the engine repo. That
  file is the source of truth; this is a subset, and an edit belongs there first.

  ⚠️ kinaigraph does not consume cross-file `<use href="other.svg#id">`, so these
  symbols are mirrored again into icon_layer.svg. That second copy is made by
  `resource/temp/make_ladder_svg.py`, which reads this file — so the layer cannot
  drift from the subset even though the subset can drift from the catalog.

  Colour comes from the catalog's class vocabulary — `icon-fill`, `icon-stroke`,
  `icon-fill-dark`, `icon-fill-medium` — which resolve against `--icon-*` custom
  properties. theme_ladder.css binds those per theme, so one drawing serves both.
-->
<svg xmlns="http://www.w3.org/2000/svg" id="milestone-icons" width="0" height="0">
	<defs>
	<symbol id="clock" viewBox="0 0 24 24">
		    <!-- Face -->
		    <circle cx="12" cy="12" r="9" class="icon-fill icon-stroke" stroke-width="1"/>
		    <!-- Hour ticks at 12, 3, 6 and 9 -->
		    <path d="M 12,4.2 L 12,5.8 M 19.8,12 L 18.2,12 M 12,19.8 L 12,18.2 M 4.2,12 L 5.8,12"
		          fill="none" class="icon-stroke" stroke-width="1"/>
		    <!-- Hands -->
		    <path d="M 12,12 L 12,7.4 M 12,12 L 15.3,13.7"
		          fill="none" class="icon-stroke" stroke-width="1.2" stroke-linecap="round"/>
		    <!-- Centre pin -->
		    <circle cx="12" cy="12" r="0.9" class="icon-fill-dark"/>
		</symbol>

	<symbol id="graduate" viewBox="0 0 24 24">
		    <!-- Board -->
		    <path d="M 12,3.6 L 22,7.6 L 12,11.6 L 2,7.6 Z"
		          class="icon-fill icon-stroke" stroke-width="1"/>
		    <!-- Cap below the board, seen head-on -->
		    <path d="M 6,9.2 L 6,15 Q 12,18.6 18,15 L 18,9.2"
		          fill="none" class="icon-stroke" stroke-width="1"/>
		    <!-- Tassel -->
		    <path d="M 20.6,8.2 L 20.6,14.2" fill="none" class="icon-stroke" stroke-width="1"/>
		    <circle cx="20.6" cy="15.2" r="1" class="icon-fill-medium"/>
		</symbol>

	<symbol id="stethoscope" viewBox="0 0 24 24">
		    <!-- Binaural tubing: the two ear branches meeting in a loop -->
		    <path d="M 4.6,4 L 4.6,9.4 A 4.2,4.2 0 0 0 13,9.4 L 13,4"
		          fill="none" class="icon-stroke" stroke-width="1.2"/>
		    <!-- Earpieces -->
		    <circle cx="4.6" cy="3.2" r="1.2" class="icon-fill-medium"/>
		    <circle cx="13" cy="3.2" r="1.2" class="icon-fill-medium"/>
		    <!-- Lower tube, down and across to the chest piece -->
		    <path d="M 8.8,13.6 L 8.8,16.4 A 4.4,4.4 0 0 0 17.6,16.4 L 17.6,15"
		          fill="none" class="icon-stroke" stroke-width="1.2"/>
		    <!-- Chest piece -->
		    <circle cx="17.6" cy="12.4" r="2.6" class="icon-fill icon-stroke" stroke-width="1"/>
		</symbol>

	<symbol id="heart" viewBox="0 0 24 24">
		    <!-- Two lobes meeting at a point -->
		    <path d="M 12,20.6 C 3.6,14.6 3.2,9.4 6.8,7 C 9.2,5.4 12,7.1 12,9.6
		             C 12,7.1 14.8,5.4 17.2,7 C 20.8,9.4 20.4,14.6 12,20.6 Z"
		          class="icon-fill icon-stroke" stroke-width="1"/>
		</symbol>

	<symbol id="hospital" viewBox="0 0 24 24">
		    <!-- Building body -->
		    <rect x="4" y="8.4" width="16" height="12.6" rx="0.5" ry="0.5"
		          class="icon-fill icon-stroke" stroke-width="1"/>
		    <!-- Roof. The eave overhangs the body by 2 units a side, which is
		         deliberate and has to LOOK deliberate: a smaller overhang reads as
		         the roof being misaligned rather than as a roof. -->
		    <path d="M 2,9 L 12,2.8 L 22,9" fill="none" class="icon-stroke" stroke-width="1"/>
		    <!-- Cross, centred on the facade -->
		    <path d="M 10.7,11.4 L 13.3,11.4 L 13.3,13.8 L 15.7,13.8 L 15.7,16.4 L 13.3,16.4
		             L 13.3,18.8 L 10.7,18.8 L 10.7,16.4 L 8.3,16.4 L 8.3,13.8 L 10.7,13.8 Z"
		          class="icon-fill-dark"/>
		</symbol>

	<symbol id="group" viewBox="0 0 24 24">
		    <!-- Links first, so the nodes sit over them -->
		    <path d="M 12,8 L 12,12 M 12,12 L 6,15.6 M 12,12 L 18,15.6"
		          fill="none" class="icon-stroke" stroke-width="1"/>
		    <!-- Lead node -->
		    <circle cx="12" cy="5.2" r="3" class="icon-fill icon-stroke" stroke-width="1"/>
		    <!-- The two it reaches -->
		    <circle cx="5.4" cy="18.2" r="2.8" class="icon-fill icon-stroke" stroke-width="1"/>
		    <circle cx="18.6" cy="18.2" r="2.8" class="icon-fill icon-stroke" stroke-width="1"/>
		</symbol>
	</defs>
</svg>
