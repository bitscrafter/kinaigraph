<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" id="milestone-ladder">
	<style>
		#milestone-ladder { font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); }
		.stage { fill: var(--scene-background-color, #0b1220); }
		/* ⚠️ .seg must never carry a stroke-dasharray. `reveal` drives that same
		   attribute to draw a stroke on progressively, so a dashed segment renders
		   NOTHING when revealed — silently. Dashes or draw-on, never both. */
		.track { fill: none; stroke: var(--ladder-track-stroke-color, #1e2c44); stroke-width: 7; stroke-linecap: round; }
		.seg   { fill: none; stroke: var(--ladder-walked-stroke-color, #4cc0d2);   stroke-width: 7; stroke-linecap: round; }
		.halo  { fill: none; stroke-width: 2; opacity: 0.26; }
		.disc  { fill: var(--node-disc-fill-color, #0f1a2b); stroke-width: 5; }
		/* The ramp, on the RING. Never on the disc fill — see the stylesheet. */
		.ring-1 { stroke: var(--ladder-step-1-color, #2f6d7a); }
		.ring-2 { stroke: var(--ladder-step-2-color, #37879a); }
		.ring-3 { stroke: var(--ladder-step-3-color, #3fa3b8); }
		.ring-4 { stroke: var(--ladder-step-4-color, #4cc0d2); }
		.ring-5 { stroke: var(--ladder-step-5-color, #6bdcea); }
		.ring-6 { stroke: var(--ladder-step-6-color, #93f0f7); }
		.yr { font-size: 25px; font-weight: 700; letter-spacing: 0.14em; text-anchor: middle; }
		.ink-1 { fill: var(--ladder-step-1-color, #2f6d7a); }
		.ink-2 { fill: var(--ladder-step-2-color, #37879a); }
		.ink-3 { fill: var(--ladder-step-3-color, #3fa3b8); }
		.ink-4 { fill: var(--ladder-step-4-color, #4cc0d2); }
		.ink-5 { fill: var(--ladder-step-5-color, #6bdcea); }
		.ink-6 { fill: var(--ladder-step-6-color, #93f0f7); }
		.ti { font-size: 30px; font-weight: 700; fill: var(--node-title-text-color, #f4f7fb); text-anchor: middle; }
		.de { font-size: 21px; fill: var(--node-detail-text-color, #8ea3bd); text-anchor: middle; }
		.title-name { font-size: 56px; font-weight: 700; fill: var(--node-title-text-color, #f4f7fb); }
		.title-role { font-size: 22px; fill: var(--node-detail-text-color, #8ea3bd); letter-spacing: 0.16em; }
	</style>
	<rect id="stage" class="stage" x="0" y="0" width="1920" height="1080"/>
	<g id="title">
		<text id="title-name" class="title-name" x="140" y="128">Dr. Jane Doe, MD</text>
		<text id="title-role" class="title-role" x="145" y="172">PEDIATRICS &#183; UNIVERSITY HOSPITAL</text>
	</g>
	<path id="track" class="track" d="M 250 798 C 297.3 764.7 439.3 626.0 534 598 C 628.7 570.0 723.3 658.0 818 630 C 912.7 602.0 1007.3 458.0 1102 430 C 1196.7 402.0 1291.3 490.0 1386 462 C 1480.7 434.0 1622.7 295.3 1670 262"/>
	<path id="seg-medical-school" class="seg" d="M 250 798 C 297.3 764.7 439.3 626.0 534 598"/>
	<path id="seg-internship" class="seg" d="M 534 598 C 628.7 570.0 723.3 658.0 818 630"/>
	<path id="seg-family" class="seg" d="M 818 630 C 912.7 602.0 1007.3 458.0 1102 430"/>
	<path id="seg-community" class="seg" d="M 1102 430 C 1196.7 402.0 1291.3 490.0 1386 462"/>
	<path id="seg-teaching" class="seg" d="M 1386 462 C 1480.7 434.0 1622.7 295.3 1670 262"/>
	<g id="node-career-decision">
		<circle class="halo ring-1" cx="250" cy="798" r="52"/>
		<circle class="disc ring-1" cx="250" cy="798" r="40"/>
	</g>
	<g id="label-career-decision">
		<text class="yr ink-1" x="250" y="876">2007</text>
		<text class="ti" x="250" y="910">The Waiting Room</text>
		<text class="de" x="250" y="940">That's when I decided</text>
	</g>
	<g id="node-medical-school">
		<circle class="halo ring-2" cx="534" cy="598" r="52"/>
		<circle class="disc ring-2" cx="534" cy="598" r="40"/>
	</g>
	<g id="label-medical-school">
		<text class="yr ink-2" x="534" y="460">2013</text>
		<text class="ti" x="534" y="494">Medical School</text>
		<text class="de" x="534" y="522">Before I was any use to anyone</text>
	</g>
	<g id="node-internship">
		<circle class="halo ring-3" cx="818" cy="630" r="52"/>
		<circle class="disc ring-3" cx="818" cy="630" r="40"/>
	</g>
	<g id="label-internship">
		<text class="yr ink-3" x="818" y="708">2017</text>
		<text class="ti" x="818" y="742">First Night</text>
		<text class="de" x="818" y="772">This time I knew</text>
	</g>
	<g id="node-family">
		<circle class="halo ring-4" cx="1102" cy="430" r="52"/>
		<circle class="disc ring-4" cx="1102" cy="430" r="40"/>
	</g>
	<g id="label-family">
		<text class="yr ink-4" x="1102" y="292">2020</text>
		<text class="ti" x="1102" y="326">The NICU</text>
		<text class="de" x="1102" y="354">You don't treat your own child</text>
	</g>
	<g id="node-community">
		<circle class="halo ring-5" cx="1386" cy="462" r="52"/>
		<circle class="disc ring-5" cx="1386" cy="462" r="40"/>
	</g>
	<g id="label-community">
		<text class="yr ink-5" x="1386" y="540">2022</text>
		<text class="ti" x="1386" y="574">The Clinic</text>
		<text class="de" x="1386" y="604">Nobody to follow up with</text>
	</g>
	<g id="node-teaching">
		<circle class="halo ring-6" cx="1670" cy="262" r="52"/>
		<circle class="disc ring-6" cx="1670" cy="262" r="40"/>
	</g>
	<g id="label-teaching">
		<text class="yr ink-6" x="1670" y="124">2025</text>
		<text class="ti" x="1670" y="158">Teaching</text>
		<text class="de" x="1670" y="186">Their patient too</text>
	</g>
</svg>
