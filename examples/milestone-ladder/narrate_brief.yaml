# ------------------------------------------
# milestone-ladder — narration (brief)
# ------------------------------------------
# Generates the six clips for the brief cut. Run ONCE before rendering it, and
# again whenever one of its scripts changes.
#
#     kinaigraph narrate_brief.yaml
#
# The animation is timed to the voice: every step holds for its own clip's probed
# `.duration`, so the picture stretches to the narration rather than the
# narration being trimmed to fit. Re-record a line and the step re-fits itself.
#
# Needs ELEVENLABS_API_KEY. Every run costs credits, which is why this is a
# separate file — re-rendering must not re-synthesise audio that did not change.
#
# ⚠️ `synthesis.context.status` is SECTION-WIDE. There is no per-entry switch, so
# this regenerates all six clips and bills for all six, even for a one-line edit.
# The teaser cut has its own file for the same reason: generating one length
# must not bill for the other.

metadata:
    title: "Milestone Ladder - Narration (brief)"
    description: "Generate the six narration clips for the milestone-ladder brief"
    version: "1.0"

defs:
    assets:
        elevenlabs_credentials:
            type: "credentials"
            env: "ELEVENLABS_API_KEY"

    defaults:
        tts:
            provider: "elevenlabs"
            credentials: "elevenlabs_credentials"
            voice: "ogwqBH5bbF03DSbNiRNN" # Savvy

synthesis:
    context:
        status: active

    tts:
        audio_01_career_decision:
            file: "./resource/script/brief/part_01_career_decision.txt"
            export: "./resource/audio/brief/part_01_career_decision.mp3"

        audio_02_medical_school:
            file: "./resource/script/brief/part_02_medical_school.txt"
            export: "./resource/audio/brief/part_02_medical_school.mp3"

        audio_03_internship:
            file: "./resource/script/brief/part_03_internship.txt"
            export: "./resource/audio/brief/part_03_internship.mp3"

        audio_04_family:
            file: "./resource/script/brief/part_04_family.txt"
            export: "./resource/audio/brief/part_04_family.mp3"

        audio_05_community:
            file: "./resource/script/brief/part_05_community.txt"
            export: "./resource/audio/brief/part_05_community.mp3"

        audio_06_teaching:
            file: "./resource/script/brief/part_06_teaching.txt"
            export: "./resource/audio/brief/part_06_teaching.mp3"
