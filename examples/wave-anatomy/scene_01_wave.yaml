# ------------------------------------------
# wave-anatomy — Beat 1: the wave, and the line that wrote it
# ------------------------------------------
# The curve draws itself, a dot walks it, and then the authored expression appears
# beside it. That last move is the reason this example exists: in every other example
# the document DESCRIBES a picture, and here it IS the mathematics. `sin(radians(x))`
# is not a label for the curve — it is what produced every point of it.
#
# ⚠️ THE NARRATION NEVER SAYS ANY OF THAT, in this beat or in any other. Every spoken
# line is trigonometry; the capability legend carries the Kinaigraph story on screen,
# and the source box below is its proof. A viewer here to learn about waves is never
# asked to care what rendered them, and a reader evaluating the language gets the whole
# account from four small boxes without a word of it being narrated at them.
#
# Nothing in `plot.svg` is a wave. The surface carries grid, axes and ticks; every
# curve in all four beats is generated by an `annotation` from its own equation. Move
# a node in the SVG and nothing breaks, because no wave geometry was ever copied out.
#
# The dot rides the GENERATED curve by name — `along: wave` —
# so the path travelled and the path drawn are one object, not two that have to agree.

defs:
    assets:
        # Declaration order is render order, and there are three tiers: the plot
        # surface, then the window frame, then the rider. Generated curves belong to
        # the surface, so the frame draws over them and the dot draws over everything —
        # the dot marks a position and must never be the thing that gets masked.
        plot:
            type: "scene"
            file: "./resources/diagram/plot.svg"
        # The window frame: masks anything travelling out of the plotting area, and
        # carries the y scale above the curves. Declared after the surface so it draws
        # over them.
        frame_layer:
            type: "scene"
            file: "./resources/diagram/frame_layer.svg"
        rider_layer:
            type: "scene"
            file: "./resources/diagram/rider_layer.svg"

        dot:
            type: "actor"
            part_of: rider_layer
            id: rider
            origin: center

        # ── The source line, quoted verbatim ──────────────────────────────────────
        # What this box says is what the document above it says. Kept as a `text`
        # asset rather than drawn into the SVG so the two cannot drift.
        source_text:
            type: "text"
            content: |
                expression: sin(radians(x))
                domain:
                    from: 0
                    to: 360
            font_family: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font_size: 19
            font_color: "#7ee787"

        # ── The capability legend ─────────────────────────────────────────────────
        # Names, in Kinaigraph's own vocabulary, what the engine is doing in this beat.
        # The NARRATION never mentions it — a viewer learning trigonometry follows the
        # voice and can ignore this box entirely, while a reader evaluating the language
        # gets the whole story from the four boxes alone. Two audiences, neither
        # interrupted. The palette is deliberately off the plot's, because this is
        # commentary about the video rather than part of the diagram.
        chip_text:
            type: "text"
            content: |
                Function drawing
                a function, sampled into a curve
            font_family: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font_size: 15
            font_color: "#a8a29e"

        narration:
            type: "audio"
            file: "./audio/beat_01_wave.mp3"

        template:
            type: "template"
            file: "./resources/template/main.html"
            style: style
        style:
            type: "style"
            file: "./resources/css/theme_dark.css"

    const:
        VIDEO_MARGIN: 350

        # ── The plot's geometry contract ──────────────────────────────────────────
        # These five numbers are the ONLY place this scene knows about `plot.svg`.
        # They are stated identically in every beat, and each is read straight off
        # the header comment of the SVG — nothing here is measured from a render.
        PLOT_X0: 120 # x of 0° on the surface
        PLOT_Y0: 380 # y of the centre line
        PLOT_XS: "1060 / 360" # px per degree — 1060px of surface over 360°
        PLOT_YS: 120 # px per amplitude unit
        DOMAIN_TO: 360 # exactly one cycle — the window IS the cycle

        # Sample count for the generated curve. High enough that the cycle reads as
        # smooth over 1060px; the compiler does the flattening.
        SAMPLES: 300

        # ── Derived timings ───────────────────────────────────────────────────────
        # The clip is exactly as long as the line that narrates it. Re-record the
        # script and every span below re-fits itself; none of this is hand-measured.
        # ⚠️ EVERY DERIVED SPAN IS TRUNCATED TO WHOLE MILLISECONDS. A probed narration
        # duration is not a round number (9752.381 ms), so a third of it is not either.
        # A held window's end rounds UP to the millisecond while the bookmark that ends
        # the same entry keeps its fraction, and the next entry's write then begins a
        # half-millisecond BEFORE the previous one finishes — which is a genuine
        # same-property overlap and is refused. Truncating first makes every boundary an
        # integer, so a window ends exactly where the next begins, which is allowed.
        FIXED_MS: "VIDEO_MARGIN * 2"
        BODY_MS: "narration.duration - FIXED_MS"

        DRAW_MS: "trunc(BODY_MS * 0.34)" # the curve drawing itself
        RIDE_MS: "trunc(BODY_MS * 0.40)" # the dot walking it
        SOURCE_MS: "trunc(BODY_MS * 0.26)" # the expression arriving

        SOURCE_FADE_MS: 260

        # ── The source box ────────────────────────────────────────────────────────
        # Sits in the plot's upper-right quadrant, which a pure sine over one cycle
        # leaves empty — past 180° the curve is entirely below the centre line. The
        # box overlays the grid without ever crossing the wave it quotes.
        SOURCE_X: 700
        SOURCE_Y: 152
        SOURCE_WIDTH: 470
        SOURCE_HEIGHT: 132
        SOURCE_PADDING: 14

        # ── The capability legend ─────────────────────────────────────────────────
        # Below the tick row, in the one band no curve can reach: the plot's own area
        # ends at y = 620, and beat 2's ±2 amplitude fills it, so there is no in-plot
        # corner that stays clear across all four beats.
        CHIP_X: 120
        CHIP_Y: 650
        CHIP_WIDTH: 430
        CHIP_HEIGHT: 58
        CHIP_PADDING: 9

animation:
    defaults:
        assets:
            scene: plot

    annotations:
        # A note with NO pointer is just an author-sized box — the legend points at
        # nothing because it is about the whole beat, not about one mark on it.
        chip_capability:
            note:
                text: chip_text
                shape:
                    rect:
                        width: CHIP_WIDTH
                        height: CHIP_HEIGHT
                padding: CHIP_PADDING
                align: left
            at:
                x: CHIP_X
                y: CHIP_Y
            origin: top_left
            fill: "#16130f"
            stroke: "#57534e"
            stroke_width: 1

        # ⚠️ THE WAVE IS NOT DRAWN ANYWHERE. This declaration is the curve: an
        # expression, a domain, and the mapping from function space onto the plot.
        # `origin: zero` lands the function's own axes crossing on the surface's
        # crossing — the one reference point a bounding-box cell could not name.
        wave:
            curve:
                function:
                    expression: "sin(radians(x))"
                    domain:
                        from: 0
                        to: DOMAIN_TO
                samples: SAMPLES
                scale:
                    x: PLOT_XS
                    y: PLOT_YS
            origin: zero
            at:
                x: PLOT_X0
                y: PLOT_Y0
            stroke: 'css("kg-wave-live")'
            stroke_width: 'css("kg-wave-width")'

        source_note:
            note:
                text: source_text
                shape:
                    rect:
                        width: SOURCE_WIDTH
                        height: SOURCE_HEIGHT
                padding: SOURCE_PADDING
                align: left
            at:
                x: SOURCE_X
                y: SOURCE_Y
            origin: top_left
            fill: "#161b22"
            stroke: "#3fb950"
            stroke_width: 1.5

    timeline:
        0 @ setup_ts:
            - plot:
                  - show:
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"
            - frame_layer:
                  - show:
                        opacity: 1
            - chip_capability:
                  - show:
                        opacity: 1
            - wave:
                  - show:
                        opacity: 0
            - dot:
                  - show:
                        opacity: 0
            - source_note:
                  - show:
                        opacity: 0

        # ── The curve draws itself ────────────────────────────────────────────────
        # `reveal` walks the generated path's own arc length, so the pen speed is the
        # curve's, not a fade dressed up as drawing.
        setup_ts.end @ draw_ts:
            - wave:
                  - show:
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        duration: DRAW_MS
                        easing: ease_out_quad

        # ── The dot walks it ──────────────────────────────────────────────────────
        # It rides the generated curve BY NAME. There is no second copy of the wave
        # for it to travel along, so it cannot drift off the line it is marking.
        draw_ts.end @ ride_ts:
            - dot:
                  - show:
                        opacity: 1
                  - move:
                        along:
                            asset: wave
                        duration: RIDE_MS
                        easing: linear

        # ── The source arrives ────────────────────────────────────────────────────
        ride_ts.end @ source_ts:
            - source_note:
                  - show:
                        duration: SOURCE_FADE_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - dot:
                  - show:
                        duration: SOURCE_MS
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"

    capture:
        video_beat_01_wave:
            output: "./video/beat_01_wave.mp4"
            fps: 30
