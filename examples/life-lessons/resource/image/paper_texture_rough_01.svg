<svg id="paper_texture_rough_medium" xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Moderate fibres: mid surfaceScale, mid light elevation -->
    <filter id="fibers" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="5" seed="6" stitchTiles="stitch" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="2.4" diffuseConstant="1" lighting-color="#ffffff" result="l">
        <feDistantLight azimuth="235" elevation="51"/>
      </feDiffuseLighting>
    </filter>

    <!-- Grain: stronger than subtle, still smooth (linear, not discrete) -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m">
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#f3f2ee"/>
  <rect width="1280" height="720" filter="url(#fibers)" style="mix-blend-mode:multiply" opacity="0.52"/>
  <rect width="1280" height="720" filter="url(#grain)"/>
</svg>
