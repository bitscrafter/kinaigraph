# ------------------------------------------
# bio-journey — the brief
# ------------------------------------------
# Six steps of one life, told at length
#
#     kinaigraph bio_journey_brief_tts.yaml   # once, needs an API key
#     kinaigraph bio_journey_brief.yaml
#
# ── How a step is built ──────────────────────────────────────────────────────
# Step 1 draws no span — it is the first node, and nothing precedes it. Steps
# 2-6 each draw the span that REACHES them, land the node on the end of it, then
# wait out the rest of their sentence. The waiting is what puts the picture on
# the words: a node finishes arriving before the line explaining it is over.
#
# ⚠️ Every actor id is the node's SLUG, and the script that narrates it carries
# the same slug — `part_03_first_night.txt` speaks over `node-first-night`.
# Nothing is matched by position, so re-ordering the ladder cannot silently
# pair a line with the wrong node.
#
# ⚠️ `.seg` carries no `stroke-dasharray`, and must not. `reveal` drives that
# same attribute to draw a stroke on progressively, so revealing an
# already-dashed line renders NOTHING, silently.

metadata:
    title: "Bio Journey - Brief"
    description: "Six steps of one life, told at length"
    version: "1.0"

defs:
    assets:
        ladder:
            type: "scene"
            file: "./resource/scene/ladder.svg"

        # Present from the first frame — the viewer should know whose life this
        # is before the first step lands.
        title:
            type: "actor"
            part_of: ladder
            id: title

        seg_medical_school:
            type: "actor"
            part_of: ladder
            id: seg-medical-school
        seg_first_night:
            type: "actor"
            part_of: ladder
            id: seg-first-night
        seg_nicu:
            type: "actor"
            part_of: ladder
            id: seg-nicu
        seg_clinic:
            type: "actor"
            part_of: ladder
            id: seg-clinic
        seg_teaching:
            type: "actor"
            part_of: ladder
            id: seg-teaching

        node_waiting_room:
            type: "actor"
            part_of: ladder
            id: node-waiting-room
        label_waiting_room:
            type: "actor"
            part_of: ladder
            id: label-waiting-room
        node_medical_school:
            type: "actor"
            part_of: ladder
            id: node-medical-school
        label_medical_school:
            type: "actor"
            part_of: ladder
            id: label-medical-school
        node_first_night:
            type: "actor"
            part_of: ladder
            id: node-first-night
        label_first_night:
            type: "actor"
            part_of: ladder
            id: label-first-night
        node_nicu:
            type: "actor"
            part_of: ladder
            id: node-nicu
        label_nicu:
            type: "actor"
            part_of: ladder
            id: label-nicu
        node_clinic:
            type: "actor"
            part_of: ladder
            id: node-clinic
        label_clinic:
            type: "actor"
            part_of: ladder
            id: label-clinic
        node_teaching:
            type: "actor"
            part_of: ladder
            id: node-teaching
        label_teaching:
            type: "actor"
            part_of: ladder
            id: label-teaching

        audio_01_waiting_room:
            type: "audio"
            file: "./resource/audio/brief/part_01_waiting_room.mp3"
        audio_02_medical_school:
            type: "audio"
            file: "./resource/audio/brief/part_02_medical_school.mp3"
        audio_03_first_night:
            type: "audio"
            file: "./resource/audio/brief/part_03_first_night.mp3"
        audio_04_nicu:
            type: "audio"
            file: "./resource/audio/brief/part_04_nicu.mp3"
        audio_05_clinic:
            type: "audio"
            file: "./resource/audio/brief/part_05_clinic.mp3"
        audio_06_teaching:
            type: "audio"
            file: "./resource/audio/brief/part_06_teaching.mp3"

        template:
            type: "template"
            file: "./resource/template/main.html"
            style: style
        style:
            type: "style"
            file: "./resource/style/theme_bio.css"

    const:
        # Quiet before the first word and after the last, so the piece does not
        # start or stop on a syllable.
        VIDEO_MARGIN: 350

        # How long a span takes to draw and a node to land. Both stay well under
        # the shortest clip, so even the quickest step is fully on screen before
        # its sentence ends.
        SEG_DRAW_MS: 320
        NODE_FADE_MS: 260

        # Each step waits out the remainder of its own line. Step 1 draws no
        # span, so only the node fade comes off its clip.
        STEP_1_HOLD_MS: "audio_01_waiting_room.duration - NODE_FADE_MS"
        STEP_2_HOLD_MS: "audio_02_medical_school.duration - SEG_DRAW_MS - NODE_FADE_MS"
        STEP_3_HOLD_MS: "audio_03_first_night.duration - SEG_DRAW_MS - NODE_FADE_MS"
        STEP_4_HOLD_MS: "audio_04_nicu.duration - SEG_DRAW_MS - NODE_FADE_MS"
        STEP_5_HOLD_MS: "audio_05_clinic.duration - SEG_DRAW_MS - NODE_FADE_MS"
        STEP_6_HOLD_MS: "audio_06_teaching.duration - SEG_DRAW_MS - NODE_FADE_MS"

animation:
    timeline:
        # The stage, the track and the title are there from the first frame. The
        # unwalked road being visible is the point: the shape of the life is
        # legible before any of it has happened.
        0 @ setup:
            - title:
                  - show:
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"
            - node_waiting_room:
                  - show:
                        opacity: 0
            - label_waiting_room:
                  - show:
                        opacity: 0
            - node_medical_school:
                  - show:
                        opacity: 0
            - label_medical_school:
                  - show:
                        opacity: 0
            - node_first_night:
                  - show:
                        opacity: 0
            - label_first_night:
                  - show:
                        opacity: 0
            - node_nicu:
                  - show:
                        opacity: 0
            - label_nicu:
                  - show:
                        opacity: 0
            - node_clinic:
                  - show:
                        opacity: 0
            - label_clinic:
                  - show:
                        opacity: 0
            - node_teaching:
                  - show:
                        opacity: 0
            - label_teaching:
                  - show:
                        opacity: 0
            - seg_medical_school:
                  - show:
                        opacity: 0
            - seg_first_night:
                  - show:
                        opacity: 0
            - seg_nicu:
                  - show:
                        opacity: 0
            - seg_clinic:
                  - show:
                        opacity: 0
            - seg_teaching:
                  - show:
                        opacity: 0

        # ── Step 1 — no span precedes the first node ────────────────────────
        setup.end @ step_1:
            - node_waiting_room:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - label_waiting_room:
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_1_HOLD_MS"

        step_1.end @ step_2:
            - seg_medical_school:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_medical_school:
                  - show:
                        opacity: 0
                        hold:
                            before: "SEG_DRAW_MS"
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - label_medical_school:
                  - show:
                        opacity: 0
                        hold:
                            before: "SEG_DRAW_MS"
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_2_HOLD_MS"

        step_2.end @ step_3:
            - seg_first_night:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_first_night:
                  - show:
                        opacity: 0
                        hold:
                            before: "SEG_DRAW_MS"
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - label_first_night:
                  - show:
                        opacity: 0
                        hold:
                            before: "SEG_DRAW_MS"
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_3_HOLD_MS"

        step_3.end @ step_4:
            - seg_nicu:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_nicu:
                  - show:
                        opacity: 0
                        hold:
                            before: "SEG_DRAW_MS"
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - label_nicu:
                  - show:
                        opacity: 0
                        hold:
                            before: "SEG_DRAW_MS"
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_4_HOLD_MS"

        step_4.end @ step_5:
            - seg_clinic:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_clinic:
                  - show:
                        opacity: 0
                        hold:
                            before: "SEG_DRAW_MS"
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - label_clinic:
                  - show:
                        opacity: 0
                        hold:
                            before: "SEG_DRAW_MS"
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_5_HOLD_MS"

        step_5.end @ step_6:
            - seg_teaching:
                  - show:
                        duration: SEG_DRAW_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
            - node_teaching:
                  - show:
                        opacity: 0
                        hold:
                            before: "SEG_DRAW_MS"
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
            - label_teaching:
                  - show:
                        opacity: 0
                        hold:
                            before: "SEG_DRAW_MS"
                  - show:
                        duration: NODE_FADE_MS
                        opacity: 1
                        easing: ease_out_quad
                        hold:
                            after: "STEP_6_HOLD_MS"

        # The closing quiet, so the last line lands before the picture cuts.
        step_6.end @ teardown:
            - title:
                  - show:
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"

    capture:
        bio_journey_brief_silent:
            output: "./resource/video/bio_journey_brief_silent.mp4"
            fps: 30

composition:
    context:
        status: active

    timeline:
        # ⚠️ Every mix carries an explicit `span.from`. A spanless mix at a
        # non-zero timestamp hits a known defect that places the audio at output
        # 0 — which here would stack all six lines on the first frame.
        "0":
            - bio_journey_brief_silent:
                  - roll:
                  - mix:
                        span:
                            from: "animation::step_1.start"
                        asset: audio_01_waiting_room
                  - mix:
                        span:
                            from: "animation::step_2.start"
                        asset: audio_02_medical_school
                  - mix:
                        span:
                            from: "animation::step_3.start"
                        asset: audio_03_first_night
                  - mix:
                        span:
                            from: "animation::step_4.start"
                        asset: audio_04_nicu
                  - mix:
                        span:
                            from: "animation::step_5.start"
                        asset: audio_05_clinic
                  - mix:
                        span:
                            from: "animation::step_6.start"
                        asset: audio_06_teaching

    capture:
        bio_journey_brief:
            output: "./bio_journey_brief.mp4"
            fps: 30
