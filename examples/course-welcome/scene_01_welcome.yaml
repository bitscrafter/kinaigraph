# The first half-minute of an online course: an instructor greets the class from
# the corner while the practicalities arrive beside her.
#
# ⚡ THE LANGUAGE HAS NO PUPPET FEATURE. The drawing carries three mouth shapes
# and two eye states stacked in one place, all but one hidden; a state CHANGE is
# two `pulse` actions written against each other — the shape arriving and the
# shape leaving, same window, same `cycles`, so they stay phase-locked and
# exactly one is visible. Everything below is that one idea, applied to a mouth,
# a pair of eyelids, and a breath.
#
# Three stacked layers share the 0 0 1280 720 viewBox; declaration order is
# z-order, bottom to top:
#   backdrop.svg      the ground and the provider's wordmark
#   pitch_text.svg    six lines of type, one actor each
#   avatar_layer.svg  the instructor's bubble, bottom-right
#
# ⚡ THE VOICE IS WHAT TIMES IT. Each phrase lasts exactly as long as the line
# spoken over it, and the mouth's cycle count rides that window, so a re-recorded
# sentence re-times its own phrase and shifts the ones after it — with the flap
# still at the same rate. The recordings are committed, so this renders from a
# clone with no key.

metadata:
    title: "Course welcome — an instructor, puppeteered from the timeline"
    description: "six phrases of type and a rig driven by paired pulses"
    version: "1.0"

defs:
    assets:
        # ⚠️ A BACKDROP AND A THEME ARE A PAIR. This drawing paints its own light
        # gradient, so it wants ink type and an outlined bubble — `theme_agentic`.
        # `backdrop.svg` is the plain alternative, and it goes with `theme_dark`.
        backdrop:
            type: "scene"
            file: "./resource/scene/backdrop_agentic.svg"

        pitch_text:
            type: "scene"
            file: "./resource/scene/pitch_text.svg"

        avatar_layer:
            type: "scene"
            file: "./resource/scene/avatar_layer.svg"

        # ── The typed lines, one actor per line ──────────────────────────────
        line_1:
            type: "actor"
            part_of: pitch_text
            id: line-1
        line_2:
            type: "actor"
            part_of: pitch_text
            id: line-2
        line_3:
            type: "actor"
            part_of: pitch_text
            id: line-3
        line_4:
            type: "actor"
            part_of: pitch_text
            id: line-4
        line_5:
            type: "actor"
            part_of: pitch_text
            id: line-5
        line_6:
            type: "actor"
            part_of: pitch_text
            id: line-6

        # ── The rig ──────────────────────────────────────────────────────────
        # Each is a group in the drawing, stacked at the same place.
        # `mouth-closed` rests visible; everything else rests at opacity 0.
        presenter:
            type: "actor"
            part_of: avatar_layer
            id: presenter
            origin: center
            pivot: center
        mouth_open:
            type: "actor"
            part_of: avatar_layer
            id: mouth-open
        mouth_mid:
            type: "actor"
            part_of: avatar_layer
            id: mouth-mid
        mouth_closed:
            type: "actor"
            part_of: avatar_layer
            id: mouth-closed
        eyes_open:
            type: "actor"
            part_of: avatar_layer
            id: eyes-open
        eyes_closed:
            type: "actor"
            part_of: avatar_layer
            id: eyes-closed

        # ── Narration ────────────────────────────────────────────────────────
        # One clip per phrase. Each is declared for its DURATION as much as for
        # its sound: the phrase it belongs to lasts exactly as long as the line,
        # so re-recording one sentence re-times one phrase and shifts the rest.
        # Generate them with narrate.yaml before rendering.
        narration_1:
            type: "audio"
            file: "./resource/audio/part_01_welcome.mp3"
        narration_2:
            type: "audio"
            file: "./resource/audio/part_02_modules.mp3"
        narration_3:
            type: "audio"
            file: "./resource/audio/part_03_order.mp3"
        narration_4:
            type: "audio"
            file: "./resource/audio/part_04_labs.mp3"
        narration_5:
            type: "audio"
            file: "./resource/audio/part_05_forum.mp3"
        narration_6:
            type: "audio"
            file: "./resource/audio/part_06_signoff.mp3"

        template:
            type: "template"
            file: "./resource/template/main.html"
            style: style

        style:
            type: "style"
            file: "./resource/style/theme_agentic.css"

    const:
        FADE_WINDOW: 700
        VIDEO_MARGIN: 500

        # ── Speech, as phrases rather than a flap ────────────────────────────
        # ⚠️ A SINGLE PULSE ACROSS THE WHOLE TALK IS WHAT READS AS A MACHINE: one
        # rate, no silences, starting and stopping with the shot. Real speech
        # comes in phrases of different lengths, separated by pauses you can see.
        # Six phrases, one per line of type — and the mouth SHAPE alternates
        # between them, wide then half-open.
        #
        # ⚡ A PHRASE'S LENGTH IS ITS RECORDING. Only the RATE is authored: how many
        # times the mouth opens across the line. Re-record a sentence and its phrase
        # re-times itself, the ones after it shift, and the flap stays at the same
        # syllables-per-second because the cycle count travels with the line.
        PHRASE_1_CYCLES: 6 # "Welcome to the course — glad you're here."
        PAUSE_1_MS: 600

        PHRASE_2_CYCLES: 8 # four modules
        PAUSE_2_MS: 700

        PHRASE_3_CYCLES: 9 # any order
        PAUSE_3_MS: 700

        PHRASE_4_CYCLES: 8 # labs and answers
        PAUSE_4_MS: 800

        PHRASE_5_CYCLES: 10 # the forum
        PAUSE_5_MS: 900

        PHRASE_6_CYCLES: 4 # "See you in module one."

        TALK_MS: "PHRASE_6_AT + narration_6.duration"

        # ⚠️ `hold.before` IS MEASURED FROM THE BOOKMARK, NOT FROM THE ENTRY ABOVE.
        # Sub-actions of the same type chain inside ONE entry; separate actors each
        # start at the bookmark. The six lines are six actors, so each states the
        # whole elapsed time — write a gap instead and line 3 arrives before line 2.
        PHRASE_2_AT: "narration_1.duration + PAUSE_1_MS"
        PHRASE_3_AT: "PHRASE_2_AT + narration_2.duration + PAUSE_2_MS"
        PHRASE_4_AT: "PHRASE_3_AT + narration_3.duration + PAUSE_3_MS"
        PHRASE_5_AT: "PHRASE_4_AT + narration_4.duration + PAUSE_4_MS"
        PHRASE_6_AT: "PHRASE_5_AT + narration_5.duration + PAUSE_5_MS"

        # ── Blinking ─────────────────────────────────────────────────────────
        # ⚠️ EVENLY SPACED BLINKS READ AS A METRONOME. These five gaps are
        # deliberately unequal, and 150 ms is about what a blink takes — long
        # enough to see, short enough not to look like a wince.
        BLINK_MS: 150
        BLINK_1_LEAD: 2200
        BLINK_2_GAP: 4600
        BLINK_3_GAP: 3100
        BLINK_4_GAP: 5200
        BLINK_5_GAP: 4400

        # ── Idle motion ──────────────────────────────────────────────────────
        # Two slow cycles that do not divide into each other, so the bubble never
        # returns to the same pose on a beat: breathing scales, the sway rotates.
        BREATHE_CYCLES: 8
        SWAY_CYCLES: 3
        # ⚠️ A rotation target must sit in [0, 360), so the sway rocks from upright
        # to SWAY_DEGREES and back rather than swinging either side of centre.
        SWAY_DEGREES: 1.6

animation:
    defaults:
        assets:
            scene: avatar_layer

    timeline:
        # Declaration order fixes the z-order; the head margin is quiet.
        0 @ setup_ts:
            - backdrop:
                  - show:
                        opacity: 1
                        hold:
                            before: "VIDEO_MARGIN"
            - pitch_text:
                  - show:
                        opacity: 1
                        hold:
                            before: "VIDEO_MARGIN"
            - avatar_layer:
                  - show:
                        opacity: 1
                        hold:
                            before: "VIDEO_MARGIN"

        setup_ts.end @ talk_ts:
            # ── The type: one line per phrase, each in before its phrase opens ─
            - line_1:
                  - show:
                        duration: FADE_WINDOW
                        actions:
                            - show:
                                  opacity: 1
                            - move:
                                  from:
                                      dx: 0
                                      dy: 18
                                  to:
                                      dx: 0
                                      dy: -18
            - line_2:
                  - show:
                        hold:
                            before: "PHRASE_2_AT - FADE_WINDOW"
                        duration: FADE_WINDOW
                        actions:
                            - show:
                                  opacity: 1
                            - move:
                                  from:
                                      dx: 0
                                      dy: 18
                                  to:
                                      dx: 0
                                      dy: -18
            - line_3:
                  - show:
                        hold:
                            before: "PHRASE_3_AT - FADE_WINDOW"
                        duration: FADE_WINDOW
                        actions:
                            - show:
                                  opacity: 1
                            - move:
                                  from:
                                      dx: 0
                                      dy: 18
                                  to:
                                      dx: 0
                                      dy: -18
            - line_4:
                  - show:
                        hold:
                            before: "PHRASE_4_AT - FADE_WINDOW"
                        duration: FADE_WINDOW
                        actions:
                            - show:
                                  opacity: 1
                            - move:
                                  from:
                                      dx: 0
                                      dy: 18
                                  to:
                                      dx: 0
                                      dy: -18
            - line_5:
                  - show:
                        hold:
                            before: "PHRASE_5_AT - FADE_WINDOW"
                        duration: FADE_WINDOW
                        actions:
                            - show:
                                  opacity: 1
                            - move:
                                  from:
                                      dx: 0
                                      dy: 18
                                  to:
                                      dx: 0
                                      dy: -18
            - line_6:
                  - show:
                        hold:
                            before: "PHRASE_6_AT - FADE_WINDOW"
                        duration: FADE_WINDOW
                        actions:
                            - show:
                                  opacity: 1
                            - move:
                                  from:
                                      dx: 0
                                      dy: 18
                                  to:
                                      dx: 0
                                      dy: -18

            # ── Idle motion: two slow cycles on the whole bubble ─────────────
            - presenter:
                  - pulse:
                        duration: "TALK_MS"
                        cycles: BREATHE_CYCLES
                        scale:
                            from: 1
                            to: 1.015
            - presenter:
                  - pulse:
                        duration: "TALK_MS"
                        cycles: SWAY_CYCLES
                        rotation:
                            from: 0
                            to: SWAY_DEGREES

            # ── The mouth ────────────────────────────────────────────────────
            # The resting smile leaves on every phrase, so it carries a
            # counter-pulse for each — same window, same cycles as whichever
            # shape is arriving. These ARE same-type sub-actions inside one
            # entry, so each `hold.before` is the gap since the last, not the
            # elapsed time.
            - mouth_closed:
                  - pulse:
                        duration: "narration_1.duration"
                        cycles: PHRASE_1_CYCLES
                        opacity:
                            from: 1
                            to: 0
                  - pulse:
                        hold:
                            before: PAUSE_1_MS
                        duration: "narration_2.duration"
                        cycles: PHRASE_2_CYCLES
                        opacity:
                            from: 1
                            to: 0.4
                  - pulse:
                        hold:
                            before: PAUSE_2_MS
                        duration: "narration_3.duration"
                        cycles: PHRASE_3_CYCLES
                        opacity:
                            from: 1
                            to: 0
                  - pulse:
                        hold:
                            before: PAUSE_3_MS
                        duration: "narration_4.duration"
                        cycles: PHRASE_4_CYCLES
                        opacity:
                            from: 1
                            to: 0.4
                  - pulse:
                        hold:
                            before: PAUSE_4_MS
                        duration: "narration_5.duration"
                        cycles: PHRASE_5_CYCLES
                        opacity:
                            from: 1
                            to: 0
                  - pulse:
                        hold:
                            before: PAUSE_5_MS
                        duration: "narration_6.duration"
                        cycles: PHRASE_6_CYCLES
                        opacity:
                            from: 1
                            to: 0.4

            # Wide open on the emphatic phrases — 1, 3 and 5.
            - mouth_open:
                  - pulse:
                        duration: "narration_1.duration"
                        cycles: PHRASE_1_CYCLES
                        opacity:
                            from: 0
                            to: 1
                  - pulse:
                        hold:
                            before: "PAUSE_1_MS + narration_2.duration + PAUSE_2_MS"
                        duration: "narration_3.duration"
                        cycles: PHRASE_3_CYCLES
                        opacity:
                            from: 0
                            to: 1
                  - pulse:
                        hold:
                            before: "PAUSE_3_MS + narration_4.duration + PAUSE_4_MS"
                        duration: "narration_5.duration"
                        cycles: PHRASE_5_CYCLES
                        opacity:
                            from: 0
                            to: 1

            # Half-open on the quieter ones — 2, 4 and 6.
            - mouth_mid:
                  - pulse:
                        hold:
                            before: "narration_1.duration + PAUSE_1_MS"
                        duration: "narration_2.duration"
                        cycles: PHRASE_2_CYCLES
                        opacity:
                            from: 0
                            to: 0.85
                  - pulse:
                        hold:
                            before: "PAUSE_2_MS + narration_3.duration + PAUSE_3_MS"
                        duration: "narration_4.duration"
                        cycles: PHRASE_4_CYCLES
                        opacity:
                            from: 0
                            to: 0.85
                  - pulse:
                        hold:
                            before: "PAUSE_4_MS + narration_5.duration + PAUSE_5_MS"
                        duration: "narration_6.duration"
                        cycles: PHRASE_6_CYCLES
                        opacity:
                            from: 0
                            to: 0.85

            # ── The eyes ─────────────────────────────────────────────────────
            # Each blink is one cycle of a pair: the lids arrive as the open eyes
            # leave. Both actors carry the same unequal gaps, so they stay in step
            # without either knowing about the other.
            - eyes_closed:
                  - pulse:
                        hold:
                            before: BLINK_1_LEAD
                        duration: BLINK_MS
                        cycles: 1
                        opacity:
                            from: 0
                            to: 1
                  - pulse:
                        hold:
                            before: BLINK_2_GAP
                        duration: BLINK_MS
                        cycles: 1
                        opacity:
                            from: 0
                            to: 1
                  - pulse:
                        hold:
                            before: BLINK_3_GAP
                        duration: BLINK_MS
                        cycles: 1
                        opacity:
                            from: 0
                            to: 1
                  - pulse:
                        hold:
                            before: BLINK_4_GAP
                        duration: BLINK_MS
                        cycles: 1
                        opacity:
                            from: 0
                            to: 1
                  - pulse:
                        hold:
                            before: BLINK_5_GAP
                        duration: BLINK_MS
                        cycles: 1
                        opacity:
                            from: 0
                            to: 1
            - eyes_open:
                  - pulse:
                        hold:
                            before: BLINK_1_LEAD
                        duration: BLINK_MS
                        cycles: 1
                        opacity:
                            from: 1
                            to: 0
                  - pulse:
                        hold:
                            before: BLINK_2_GAP
                        duration: BLINK_MS
                        cycles: 1
                        opacity:
                            from: 1
                            to: 0
                  - pulse:
                        hold:
                            before: BLINK_3_GAP
                        duration: BLINK_MS
                        cycles: 1
                        opacity:
                            from: 1
                            to: 0
                  - pulse:
                        hold:
                            before: BLINK_4_GAP
                        duration: BLINK_MS
                        cycles: 1
                        opacity:
                            from: 1
                            to: 0
                  - pulse:
                        hold:
                            before: BLINK_5_GAP
                        duration: BLINK_MS
                        cycles: 1
                        opacity:
                            from: 1
                            to: 0

        # The tail margin is quiet, like the head.
        talk_ts.end @ tear_down_ts:
            - backdrop:
                  - show:
                        hold:
                            after: "VIDEO_MARGIN"
                        opacity: 1

    capture:
        course_welcome_silent:
            output: "./resource/video/course_welcome_silent.mp4"
            fps: 30

# The picture is captured silent above; the voice is laid over it here, one mix
# per phrase. ⚠️ A mix's `span.from` is measured in the rolled clip's own time, so
# each offset is the head margin plus everything that ran before that phrase —
# the same expressions the timeline uses, which is what keeps voice and mouth on
# the same instant.
composition:
    context:
        status: active

    timeline:
        "0":
            - course_welcome_silent:
                  - roll:
                  - mix:
                        span:
                            from: "VIDEO_MARGIN"
                        asset: narration_1
                  - mix:
                        span:
                            from: "VIDEO_MARGIN + PHRASE_2_AT"
                        asset: narration_2
                  - mix:
                        span:
                            from: "VIDEO_MARGIN + PHRASE_3_AT"
                        asset: narration_3
                  - mix:
                        span:
                            from: "VIDEO_MARGIN + PHRASE_4_AT"
                        asset: narration_4
                  - mix:
                        span:
                            from: "VIDEO_MARGIN + PHRASE_5_AT"
                        asset: narration_5
                  - mix:
                        span:
                            from: "VIDEO_MARGIN + PHRASE_6_AT"
                        asset: narration_6

    capture:
        out:
            output: "./course_welcome.mp4"
            fps: 30
