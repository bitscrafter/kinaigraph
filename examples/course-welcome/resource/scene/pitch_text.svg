<svg id="pitch_text" width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- The course's practicalities, one line per spoken phrase. Every line is a
       single glance: a viewer reads it while the instructor keeps talking. -->
  <style>
    .line-1 { fill: var(--title-text-color, #ffffff); font-family: var(--presenter-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 44px; font-weight: 800; letter-spacing: -0.01em; }
    .line-2,
    .line-3,
    .line-4,
    .line-5,
    .line-6 { fill: var(--body-text-color, #a8a8a8); font-family: var(--presenter-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 27px; font-weight: 400; }
  </style>

  <text id="line-1" class="line-1" opacity="0">
    <tspan x="72" y="192">Welcome to the course.</tspan>
  </text>

  <text id="line-2" class="line-2" opacity="0">
    <tspan x="72" y="296">Four modules, about ten minutes each.</tspan>
  </text>

  <text id="line-3" class="line-3" opacity="0">
    <tspan x="72" y="364">Watch them in any order — they do not depend on each other.</tspan>
  </text>

  <text id="line-4" class="line-4" opacity="0">
    <tspan x="72" y="432">Each one ends with a lab, and a worked answer.</tspan>
  </text>

  <text id="line-5" class="line-5" opacity="0">
    <tspan x="72" y="500">Questions go to the forum. I check it every morning.</tspan>
  </text>

  <text id="line-6" class="line-6" opacity="0">
    <tspan x="72" y="568">See you in module one.</tspan>
  </text>
</svg>
