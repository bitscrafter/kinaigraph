<svg id="paper_texture_rough_high" xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deeper, sharper fibres: bigger surfaceScale + lower light elevation = harsher shadows -->
    <filter id="fibers" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="6" seed="6" stitchTiles="stitch" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="3.2" diffuseConstant="1" lighting-color="#ffffff" result="l">
        <feDistantLight azimuth="235" elevation="42"/>
      </feDiffuseLighting>
    </filter>

    <!-- Grittier grain: higher frequency + discrete (hard-stepped) alpha for a punchier speckle -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m">
        <feFuncA type="discrete" tableValues="0 0.05 0.12 0.22 0.35"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#f2f1ec"/>
  <rect width="1280" height="720" filter="url(#fibers)" style="mix-blend-mode:multiply" opacity="0.6"/>
  <rect width="1280" height="720" filter="url(#grain)"/>
</svg>
