<svg id="paper_texture_rough_low" xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Soft fibrous bumps: low-frequency noise lit from one side = watercolor-paper dimples -->
    <filter id="fibers" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="5" seed="6" stitchTiles="stitch" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="1.6" diffuseConstant="1" lighting-color="#ffffff" result="l">
        <feDistantLight azimuth="235" elevation="60"/>
      </feDiffuseLighting>
    </filter>

    <!-- Fine grain: high-frequency noise, desaturated, faint -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="12" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m">
        <feFuncA type="linear" slope="0.14"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- 1. base paper colour -->
  <rect width="1280" height="720" fill="#f4f3ef"/>
  <!-- 2. embossed fibres, multiplied in so the creases darken slightly -->
  <rect width="1280" height="720" filter="url(#fibers)" style="mix-blend-mode:multiply" opacity="0.45"/>
  <!-- 3. fine speckle grain -->
  <rect width="1280" height="720" filter="url(#grain)"/>
</svg>
