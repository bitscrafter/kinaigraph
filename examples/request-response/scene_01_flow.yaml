# ------------------------------------------
# request-response — Beat 1: the request
# ------------------------------------------
# ✅ COMPILES. This document was written BEFORE `action-bookmarks` was built, to check
# the design against a real document rather than a sketch. The feature shipped
# 2026-08-06 and this file needed no change to become valid — the spelling it was
# written against is the spelling that shipped.
#
# What it uses that `action-bookmarks` added:
#   - `- move @ leg1:`      a bookmark on an action / sub-action
#   - `leg1.start`          a sub-action bookmark used as a timestamp key
#   - `leg1.duration`       its window, as a value
#   - `pace_by: distance` on a parent whose sub-actions are bookmarked
#
# ⚡ IT IS ALSO MORE CORRECT THAN `scene_01_flow_with_orient_at_parent_action.yaml`, not merely shorter. Both put the
# packet on the road at 350 ms and take it off at 13442.7 ms — the envelope matches to a
# tenth of a millisecond. The LEG BOUNDARIES do not:
#
#     leg          hand-measured        compiler-measured
#     1 & 6           2552.2 ms            2674.2 ms   (372.0 px)
#     2..5            1997.1 ms            1936.1 ms   (269.3 px)
#
# The compiler's numbers hold ONE speed across every leg — 372.0/2674.2 and 269.3/1936.1
# are both 0.1391 px/ms. The hand-measured consts give leg 1 a length ratio of 1.278
# where the true arc ratio is 1.381, so the packet SPEEDS UP AND SLOWS DOWN at each leg
# boundary. That is the whole point of `pace_by: distance`, and it was silently not
# being delivered: the consts were measured on the raw `<path>`, while the ride is
# `inset` 14 px at both ends and pushed onto a parallel lane by `lateral`. The script
# measured a line the packet never travels.
#
# A "Get User Profile" request walks the system: the client calls the gateway, the gateway
# checks the caller with auth, fetches the profile from the user service, and carries
# the answer home. Six legs over three drawn connectors, each ridden twice.
#
# The packet rides the LINKS THEMSELVES — `move … along` naming the `<path>` the diagram
# draws — so the route travelled and the route drawn cannot drift apart. There is ONE
# packet, not one per direction: `orient: auto` turns it onto each leg's heading, which
# is why the marker layer's pre-drawn left/up/down chevrons go unused here.
#
# Outbound and return share a connector, and would otherwise retrace the identical
# pixels. `lateral` offsets the ride onto a parallel lane — and because a side is
# relative to the DIRECTION OF TRAVEL, `side: left` on every leg puts the return on the
# opposite side of the line from the outbound pass automatically. One keyword, no
# per-leg bookkeeping, and the two passes read as distinct.
#
# WHY ONE `move` WITH SIX SUB-ACTIONS rather than six timeline entries: a sub-action can
# now be BOOKMARKED, so a badge pulse hangs off a leg boundary by name. That is what
# `scene_01_flow_with_orient_at_parent_action.yaml` could not do — it pays for the addressability with six entries,
# six hand-measured `LEG_n_PX` consts, six `LEG_n_MS` expressions, a `PATH_PX` total, and
# a generator script whose only job is to measure arc lengths the compiler already knows.
# Move a node in the SVG there and thirteen numbers must be re-derived by hand; here the
# timing follows by itself.

defs:
    assets:
        # v1 — no data store. Beat 2 introduces it, so it must genuinely be absent here
        # rather than hidden; the change is the point of that beat.
        get_user_profile_v1:
            type: "scene"
            file: "./resource/scene/get_user_profile_v1.svg"
        # Stacked ABOVE the diagram (declaration order is render order), so the packet
        # travels over the connectors rather than under them.
        chevrons:
            type: "scene"
            file: "./resource/scene/chevron_layer.svg"

        # The connectors the packet rides. Each is a `<path>`; `along` rides it by its
        # declared name — bare, since a defs key names one actor wherever it is written.
        link_client_gateway:
            type: "actor"
            part_of: get_user_profile_v1
            id: link-client-gateway
        link_gateway_auth:
            type: "actor"
            part_of: get_user_profile_v1
            id: link-gateway-auth
        link_gateway_user:
            type: "actor"
            part_of: get_user_profile_v1
            id: link-gateway-user

        # The step badges. Each leg pulses the badge of the node it is ARRIVING at, so
        # the numbers stop being decoration and become a running position indicator.
        badge_client:
            type: "actor"
            part_of: get_user_profile_v1
            id: step-1-badge
        badge_gateway:
            type: "actor"
            part_of: get_user_profile_v1
            id: step-2-badge
        badge_auth:
            type: "actor"
            part_of: get_user_profile_v1
            id: step-3-badge
        badge_user:
            type: "actor"
            part_of: get_user_profile_v1
            id: step-4-badge

        # ONE packet. `orient: auto` supplies every heading it needs.
        packet:
            type: "actor"
            part_of: chevrons
            id: chevron-packet
            origin: center

        # Last of the scenes, so it draws above everything. Its own scene because it
        # carries ~60 KB of embedded PNG — inside the diagram that payload would be
        # four fifths of the file and bury the geometry. Authored in the same
        # 1280 x 720 viewBox the other scenes use, so one coordinate space covers
        # every scene in the document.
        brand:
            type: "scene"
            file: "./resource/scene/brand_layer.svg"

        brand_mark:
            type: "actor"
            part_of: brand
            id: brand-mark

        # ── The payloads, read from the files that hold them ──────────────────────
        # Each callout's text is the committed payload under `resource/text/`, named
        # by `file:` rather than copied inline. The compiler reads it at Pass 3 and
        # inlines the contents, so the .txt file is the single authority and there is
        # no second copy to keep in agreement with it. A file it cannot read — absent,
        # unreadable, not UTF-8 — is a compilation error, not a silently empty box.
        #
        # The payloads are indented with SPACES, not tabs, and that is a rendering
        # constraint rather than a style choice: a tab inside SVG text has no defined
        # advance width, so the browser would set the JSON's shape at its own
        # discretion.
        #
        # Monospace, not the diagram's Arial stack: an HTTP payload set in a
        # proportional face stops reading as a wire format, and the header block's
        # colon alignment carries information. The stack ends in the generic
        # `monospace` keyword, so it resolves in any render container even when none
        # of the named faces is installed.
        #
        # Every one carries `font_size: 12` written out rather than a shared const: a
        # `type: text` asset's `font_size` takes a literal number and cannot read
        # `defs.const`, so changing one means changing all five.
        client_request_text:
            type: "text"
            file: "./resource/text/get_user_profile_request.txt"
            font_family: 'Menlo, "Liberation Mono", "DejaVu Sans Mono", Consolas, monospace'
            font_size: 12
            # A literal, necessarily: css() reads a style selected on a scene or
            # template, and no style is in scope inside `defs`. This is blueprint's
            # --title-text-color; re-theming the callouts' TEXT means editing it here.
            font_color: "#eafaff"

        profile_response_text:
            type: "text"
            file: "./resource/text/get_user_profile_response.txt"
            font_family: 'Menlo, "Liberation Mono", "DejaVu Sans Mono", Consolas, monospace'
            font_size: 12
            font_color: "#eafaff"

        # Hop B — the gateway presents its own credentials and the caller's token,
        # and authn/authz answers with a verdict and the subject it resolved to. The
        # `id` it returns is the one the user request below is addressed with, so a
        # viewer who reads both boxes watches a value carried forward.
        authz_request_text:
            type: "text"
            file: "./resource/text/authn_authz_request.txt"
            font_family: 'Menlo, "Liberation Mono", "DejaVu Sans Mono", Consolas, monospace'
            font_size: 12
            font_color: "#eafaff"

        authz_response_text:
            type: "text"
            file: "./resource/text/authn_authz_response.txt"
            font_family: 'Menlo, "Liberation Mono", "DejaVu Sans Mono", Consolas, monospace'
            font_size: 12
            font_color: "#eafaff"

        # Hop C — addressed by the id authz just returned, on the gateway's own
        # credentials rather than the caller's.
        user_request_text:
            type: "text"
            file: "./resource/text/user_profile_request.txt"
            font_family: 'Menlo, "Liberation Mono", "DejaVu Sans Mono", Consolas, monospace'
            font_size: 12
            font_color: "#eafaff"
        # Declared for its DURATION, not played here — the clip takes its length from
        # the voice. All three lines mix once, in the stitch.
        narration:
            type: "audio"
            file: "./resource/audio/part_01_flow.mp3"

        template:
            type: "template"
            file: "./resource/template/main.html"
            style: style
        style:
            type: "style"
            file: "./resource/style/theme_blueprint.css"

    const:
        VIDEO_MARGIN: 350
        PULSE_CYCLES: 1

        # ── Derived timings ───────────────────────────────────────────────────────
        # The clip is exactly as long as the line that narrates it; the walk fills
        # what is left after the head and tail pads.
        #
        # ⚠️ THE SIX `LEG_n_PX` AND SIX `LEG_n_MS` CONSTS ARE GONE, AND SO IS
        # `PATH_PX`. `pace_by: distance` on the parent `move` splits TRAVEL_MS
        # across the six legs in proportion to each leg's own arc length, which the
        # compiler measures. Re-position a node in the SVG and the timing follows by
        # itself, where thirteen authored numbers would each have to be corrected.
        FIXED_MS: "VIDEO_MARGIN * 2"
        TRAVEL_MS: "narration.duration - FIXED_MS"

        # Keeps the packet clear of the node boxes at each end of a connector, instead
        # of sliding under them. Whole-path arc-length trim, both ends.
        LINK_INSET: 14
        # Perpendicular offset of the ride. Sized to clear the connector's own stroke
        # so the two passes never overlap.
        LANE_OFFSET: 11

        # ── The payload callouts ──────────────────────────────────────────────────
        # Two callouts, each up for exactly ONE leg: the request while the packet
        # carries it out (leg 1, client -> gateway), the response while the packet
        # carries it home (leg 6, gateway -> client). Both hang off the SAME drawn
        # connector, and `lateral` has already put the two passes in different lanes —
        # the outbound rides ABOVE the line, the return BELOW it — so the request box
        # sits above and the response box below, and each is on the side its own
        # packet travels. Neither ever shares the screen with the other.
        #
        # ⚠️ EVERY COORDINATE HERE IS IN THE SCENE'S OWN viewBox UNITS (1280 x 720),
        # not the 1920 x 1080 capture. The frame is the viewBox scaled 1.5x; an
        # annotation placed at a capture coordinate lands off-screen and paints
        # nothing at all.
        CALLOUT_PADDING: 12
        CALLOUT_RADIUS: 6
        CALLOUT_STROKE_WIDTH: 1.5
        # ⚠️ THE TWO BOXES DO NOT SHARE A LEFT EDGE, and cannot: the response is
        # nearly four times the request's height and has to take the one field tall
        # enough to hold it. Each is placed against the obstacles on its own side.

        # Request: three header lines, parked between the title and the outbound lane.
        # The packet sweeps x 304 -> 566 at y 349, directly beneath this box, so the
        # pointer stays short for the whole leg. x 290 clears badge 1 (which ends at
        # x 255) and the right edge at 570 clears the gateway (which starts at 580).
        CLIENT_CALLOUT_X: 290
        CLIENT_CALLOUT_Y: 210
        CLIENT_CALLOUT_WIDTH: 280
        CLIENT_CALLOUT_HEIGHT: 74

        # Response: status line, one header and a nested JSON body — SEVENTEEN lines.
        # That needs the lower-left field entire, and it is the only block in the
        # frame big enough: the client box ends at y 410 and the gateway occupies
        # x 580..700 down to y 460, so a box this tall must sit below the one and
        # left of the other. x 175..575, y 428..693 does both and clears the frame
        # floor at 720.
        #
        # ⚠️ THE WIDTH IS SET BY THE LONGEST LINE, NOT BY TASTE. A note does not
        # auto-fit and does not auto-wrap on purpose — overflow is a soft CSS outcome,
        # never a compile error — so a box narrower than its widest line wraps
        # SILENTLY. At 360 the 46-character `"id"` line broke across two rows and the
        # JSON stopped looking like JSON. 400 leaves it whole and still stops short of
        # the gateway at x 580.
        PROFILE_CALLOUT_X: 175
        PROFILE_CALLOUT_Y: 428
        PROFILE_CALLOUT_WIDTH: 380
        PROFILE_CALLOUT_HEIGHT: 265

        # Hop B, legs 2 and 3. Both take the upper-left field — the client-request box
        # has gone by then and the two never share the screen. y 128 clears the title
        # (which ends at y 121 for a 26 px face on a y 115 baseline) and the box stops
        # short of badge 1 at y 270.
        AUTHZ_CALLOUT_X: 175
        AUTHZ_CALLOUT_Y: 128
        AUTHZ_CALLOUT_WIDTH: 360
        AUTHZ_REQUEST_CALLOUT_HEIGHT: 140
        AUTHZ_RESPONSE_CALLOUT_HEIGHT: 126

        # Hop C's request, leg 4. Below the user service (which ends at y 540) and
        # left of the brand mark (which starts at x 1126).
        USER_CALLOUT_X: 600
        USER_CALLOUT_Y: 600
        USER_CALLOUT_WIDTH: 360
        USER_CALLOUT_HEIGHT: 74

        # ⚠️ THE APEX LANDS ON THE TARGET — there is no standoff field. A pointer's tip
        # is placed at `pointer.target`, so aimed at the packet's centre it draws over
        # the chevron. `dx`/`dy` on the anchor pull it back, and because each box sits
        # in one place for its whole leg, the BEARING from packet to box barely turns:
        # a fixed offset along that bearing reads as a constant gap. It is an
        # approximation, not a radius — the gap breathes by a pixel or so across a leg.
        #
        # ⚠️ THE OFFSET MUST CLEAR THE GLYPH BEFORE IT BUYS ANY GAP. The anchor is the
        # packet's CENTRE, and the chevron is drawn around that centre: its symbol path
        # runs `M 6 7 L 10 12 L 6 17` inside a 24x24 box placed at (-12,-12), so the
        # strokes reach 5 units from centre and a 2.5 stroke-width adds 1.25 more. A
        # 5-unit pullback therefore lands ON the chevron. 7 clears it; the 5 after that
        # is the gap actually seen.
        PACKET_HALF_EXTENT: 7
        CALLOUT_APEX_GAP: "PACKET_HALF_EXTENT + 5"

        # Each callout fades in, holds for the middle of its leg, and fades out so the
        # last frame it paints is the last frame of that leg.
        #
        # ⚠️ A SHARE OF THE LEG, NOT A DURATION IN MILLISECONDS. Two fades are spent
        # inside one leg's window and the hold is what is left, so a fixed fade would
        # go NEGATIVE on any leg shorter than twice it — and a leg's length is
        # `narration.duration` divided by the arc lengths, which a short re-recording
        # can make small. A share cannot outrun its own leg: the three windows are
        # SHARE + (1 - 2·SHARE) + SHARE, which is 1 at every narration length. Must
        # stay in (0, 0.5]; at 0.5 the callout is all fade and never holds.
        CALLOUT_FADE_SHARE: 0.12
animation:
    defaults:
        assets:
            scene: get_user_profile_v1

    annotations:
        # ── The payload callouts ──────────────────────────────────────────────────
        # A note carrying a `pointer` is a CALLOUT, and what makes these two work is
        # that the box and the pointer are bound at different times:
        #
        #   `at`              a literal coordinate — the box does not move.
        #   `pointer.target`  an anchor on the packet with `binding: live` — the apex
        #                     re-resolves EVERY FRAME, so the leader tracks the packet
        #                     down the connector while the box holds still.
        #
        # That split is the whole reason these are notes rather than artwork. A box
        # drawn into the SVG could name the payload but could not follow the thing
        # carrying it, and a box that travelled WITH the packet would be unreadable
        # for the same reason a moving subtitle is.
        #
        # `binding` cascades from `at` to `pointer.target` when the latter omits it —
        # here `at` is a literal, which carries no binding to inherit, so `live` is
        # stated where it is meant. Naming `pointer.target` explicitly is also
        # REQUIRED off a literal `at`: there is no anchor for it to default from, and
        # omitting it is a MissingRequiredField.
        #
        # The pointer aims at the packet, which lives in the `chevrons` scene while
        # the box is placed in `get_user_profile_v1`. Both SVGs share the 0 0 1280 720
        # viewBox, so the two coordinate systems are one; a `defs`-declared actor is
        # document-global and resolves from either.
        callout_client_request:
            note:
                text: client_request_text
                shape:
                    rect:
                        width: CLIENT_CALLOUT_WIDTH
                        height: CLIENT_CALLOUT_HEIGHT
                        radius: CALLOUT_RADIUS
                padding: CALLOUT_PADDING
                align: left
                pointer:
                    target:
                        anchor:
                            asset: packet
                            pos: center
                            # box sits ABOVE the leg-1 lane
                            dy: "-CALLOUT_APEX_GAP"
                            binding: live
            at:
                x: CLIENT_CALLOUT_X
                y: CLIENT_CALLOUT_Y
            origin: top_left
            fill: 'css("callout-fill-color")'
            stroke: 'css("callout-stroke-color")'
            stroke_width: CALLOUT_STROKE_WIDTH

        callout_profile_response:
            note:
                text: profile_response_text
                shape:
                    rect:
                        width: PROFILE_CALLOUT_WIDTH
                        height: PROFILE_CALLOUT_HEIGHT
                        radius: CALLOUT_RADIUS
                padding: CALLOUT_PADDING
                align: left
                pointer:
                    target:
                        anchor:
                            asset: packet
                            pos: center
                            # box sits BELOW both legs it spans
                            dy: "CALLOUT_APEX_GAP"
                            binding: live
            at:
                x: PROFILE_CALLOUT_X
                y: PROFILE_CALLOUT_Y
            origin: top_left
            fill: 'css("callout-fill-color")'
            stroke: 'css("callout-stroke-color")'
            stroke_width: CALLOUT_STROKE_WIDTH

        callout_authz_request:
            note:
                text: authz_request_text
                shape:
                    rect:
                        width: AUTHZ_CALLOUT_WIDTH
                        height: AUTHZ_REQUEST_CALLOUT_HEIGHT
                        radius: CALLOUT_RADIUS
                padding: CALLOUT_PADDING
                align: left
                pointer:
                    target:
                        anchor:
                            asset: packet
                            pos: center
                            # box sits LEFT of the auth link
                            dx: "-CALLOUT_APEX_GAP"
                            binding: live
            at:
                x: AUTHZ_CALLOUT_X
                y: AUTHZ_CALLOUT_Y
            origin: top_left
            fill: 'css("callout-fill-color")'
            stroke: 'css("callout-stroke-color")'
            stroke_width: CALLOUT_STROKE_WIDTH

        callout_authz_response:
            note:
                text: authz_response_text
                shape:
                    rect:
                        width: AUTHZ_CALLOUT_WIDTH
                        height: AUTHZ_RESPONSE_CALLOUT_HEIGHT
                        radius: CALLOUT_RADIUS
                padding: CALLOUT_PADDING
                align: left
                pointer:
                    target:
                        anchor:
                            asset: packet
                            pos: center
                            # box sits LEFT of the auth link
                            dx: "-CALLOUT_APEX_GAP"
                            binding: live
            at:
                x: AUTHZ_CALLOUT_X
                y: AUTHZ_CALLOUT_Y
            origin: top_left
            fill: 'css("callout-fill-color")'
            stroke: 'css("callout-stroke-color")'
            stroke_width: CALLOUT_STROKE_WIDTH

        callout_user_request:
            note:
                text: user_request_text
                shape:
                    rect:
                        width: USER_CALLOUT_WIDTH
                        height: USER_CALLOUT_HEIGHT
                        radius: CALLOUT_RADIUS
                padding: CALLOUT_PADDING
                align: left
                pointer:
                    target:
                        anchor:
                            asset: packet
                            pos: center
                            # box sits BELOW the user link
                            dy: "CALLOUT_APEX_GAP"
                            binding: live
            at:
                x: USER_CALLOUT_X
                y: USER_CALLOUT_Y
            origin: top_left
            fill: 'css("callout-fill-color")'
            stroke: 'css("callout-stroke-color")'
            stroke_width: CALLOUT_STROKE_WIDTH
    timeline:
        0 @ setup_ts:
            - get_user_profile_v1:
                  - show:
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"
            # Present from the first frame and never touched again — it is the
            # publisher's mark, not part of the story.
            - brand_mark:
                  - show:
                        opacity: 1
            - packet:
                  - show:
                        opacity: 0
            - callout_client_request:
                  - show:
                        opacity: 0
            - callout_profile_response:
                  - show:
                        opacity: 0
            - callout_authz_request:
                  - show:
                        opacity: 0
            - callout_authz_response:
                  - show:
                        opacity: 0
            - callout_user_request:
                  - show:
                        opacity: 0

        # ── The whole journey, as ONE move ────────────────────────────────────────
        # Six legs over three connectors, each ridden twice. `pace_by: distance`
        # splits TRAVEL_MS among them in proportion to arc length, so the packet holds
        # ONE speed throughout — a property the engine guarantees rather than
        # arithmetic the author maintains.
        #
        # Each leg is bookmarked, which is what makes this spelling possible at all:
        # the badge pulses below hang off those bookmarks. Without them a sub-action
        # has no name, nothing can be scheduled at a leg boundary, and the whole
        # journey has to be six separate entries with six hand-measured durations.
        #
        # `orient: auto` sits on EVERY LEG, never on the parent. The parent carries no
        # `along`, so it has no tangent to face — and it would still claim the rotation
        # window, which then rejects the per-leg spelling as an overlapping write. The
        # rule generalises: a field that WRITES a property belongs on the rung that owns
        # the geometry it writes from. `duration` and `pace_by` pace the group and
        # belong on the parent; `orient` does not.
        setup_ts.end @ walk_ts:
            - packet:
                  - show:
                        opacity: 1
                  - move @ walk:
                        duration: TRAVEL_MS
                        pace_by: distance
                        easing: linear
                        actions:
                            # Leg 1: client -> gateway. Natural head.
                            - move @ leg1:
                                  orient: auto
                                  along:
                                      asset: link_client_gateway
                                  inset:
                                      from: LINK_INSET
                                      to: LINK_INSET
                                  lateral:
                                      side: left
                                      distance: LANE_OFFSET

                            # Leg 2: gateway -> auth. Natural head — drawn gateway-first.
                            - move @ leg2:
                                  orient: auto
                                  along:
                                      asset: link_gateway_auth
                                  inset:
                                      from: LINK_INSET
                                      to: LINK_INSET
                                  lateral:
                                      side: left
                                      distance: LANE_OFFSET

                            # Leg 3: auth -> gateway. `head: right` enters from the far
                            # end, reversing the traversal; `side: left` is relative to
                            # travel, so the return rides the opposite lane by itself.
                            - move @ leg3:
                                  orient: auto
                                  along:
                                      asset: link_gateway_auth
                                      head: right
                                  inset:
                                      from: LINK_INSET
                                      to: LINK_INSET
                                  lateral:
                                      side: left
                                      distance: LANE_OFFSET

                            # Leg 4: gateway -> user.
                            - move @ leg4:
                                  orient: auto
                                  along:
                                      asset: link_gateway_user
                                  inset:
                                      from: LINK_INSET
                                      to: LINK_INSET
                                  lateral:
                                      side: left
                                      distance: LANE_OFFSET

                            # Leg 5: user -> gateway.
                            - move @ leg5:
                                  orient: auto
                                  along:
                                      asset: link_gateway_user
                                      head: right
                                  inset:
                                      from: LINK_INSET
                                      to: LINK_INSET
                                  lateral:
                                      side: left
                                      distance: LANE_OFFSET

                            # Leg 6: gateway -> client. The answer comes home.
                            - move @ leg6:
                                  orient: auto
                                  along:
                                      asset: link_client_gateway
                                      head: right
                                  inset:
                                      from: LINK_INSET
                                      to: LINK_INSET
                                  lateral:
                                      side: left
                                      distance: LANE_OFFSET
        # ── The badges ────────────────────────────────────────────────────────────
        # Each leg pulses the badge of the node it is ARRIVING at, for exactly that
        # leg's window. This is the part that could not be written before: a badge
        # entry keyed on a sub-action's bookmark, sized by that sub-action's duration.
        leg1.start:
            - badge_gateway:
                  - pulse:
                        duration: leg1.duration
                        cycles: PULSE_CYCLES
                        stroke: 'css("pulse-stroke-color")'
                        stroke_width: 'css("pulse-stroke-width")'
            # The request, for exactly the leg that carries it. ACTIONS WITHIN ONE
            # ENTRY RUN IN SEQUENCE, so the two shows below are a fade in, a hold and
            # a fade out laid end to end — and the three windows sum to `leg1.duration`
            # exactly at any narration length, which is what keeps the callout
            # inside its own leg. Keying the
            # fade-out at `leg1.end` instead would start it there and let the box
            # linger a fade into leg 2.
            - callout_client_request:
                  - show:
                        duration: "leg1.duration * CALLOUT_FADE_SHARE"
                        opacity:
                            from: 0
                            to: 1
                        easing: ease_out_quad
                        hold:
                            after: "leg1.duration * (1 - CALLOUT_FADE_SHARE * 2)"
                  - show:
                        duration: "leg1.duration * CALLOUT_FADE_SHARE"
                        opacity:
                            from: 1
                            to: 0
                        easing: ease_in_quad

        leg2.start:
            - badge_auth:
                  - pulse:
                        duration: leg2.duration
                        cycles: PULSE_CYCLES
                        stroke: 'css("pulse-stroke-color")'
                        stroke_width: 'css("pulse-stroke-width")'
            # Hop B outbound: the gateway asks authn/authz to vouch for the caller.
            - callout_authz_request:
                  - show:
                        duration: "(leg2.duration) * CALLOUT_FADE_SHARE"
                        opacity:
                            from: 0
                            to: 1
                        easing: ease_out_quad
                        hold:
                            after: "(leg2.duration) * (1 - CALLOUT_FADE_SHARE * 2)"
                  - show:
                        duration: "(leg2.duration) * CALLOUT_FADE_SHARE"
                        opacity:
                            from: 1
                            to: 0
                        easing: ease_in_quad

        leg3.start:
            - badge_gateway:
                  - pulse:
                        duration: leg3.duration
                        cycles: PULSE_CYCLES
                        stroke: 'css("pulse-stroke-color")'
                        stroke_width: 'css("pulse-stroke-width")'
            # Hop B home: the verdict, and the subject id leg 4 is addressed with.
            - callout_authz_response:
                  - show:
                        duration: "(leg3.duration) * CALLOUT_FADE_SHARE"
                        opacity:
                            from: 0
                            to: 1
                        easing: ease_out_quad
                        hold:
                            after: "(leg3.duration) * (1 - CALLOUT_FADE_SHARE * 2)"
                  - show:
                        duration: "(leg3.duration) * CALLOUT_FADE_SHARE"
                        opacity:
                            from: 1
                            to: 0
                        easing: ease_in_quad

        leg4.start:
            - badge_user:
                  - pulse:
                        duration: leg4.duration
                        cycles: PULSE_CYCLES
                        stroke: 'css("pulse-stroke-color")'
                        stroke_width: 'css("pulse-stroke-width")'
            # Hop C outbound: addressed by that id, on the gateway's own credentials.
            - callout_user_request:
                  - show:
                        duration: "(leg4.duration) * CALLOUT_FADE_SHARE"
                        opacity:
                            from: 0
                            to: 1
                        easing: ease_out_quad
                        hold:
                            after: "(leg4.duration) * (1 - CALLOUT_FADE_SHARE * 2)"
                  - show:
                        duration: "(leg4.duration) * CALLOUT_FADE_SHARE"
                        opacity:
                            from: 1
                            to: 0
                        easing: ease_in_quad

        leg5.start:
            - badge_gateway:
                  - pulse:
                        duration: leg5.duration
                        cycles: PULSE_CYCLES
                        stroke: 'css("pulse-stroke-color")'
                        stroke_width: 'css("pulse-stroke-width")'
            # ⚡ THE ONLY CALLOUT THAT OUTLIVES ITS LEG, and deliberately. The body
            # the user service returns and the body the gateway hands back are the
            # same bytes, so showing it twice would read as repetition rather than as
            # a pass-through. One box, held across legs 5 AND 6, SHOWS what a second
            # box could only assert: the gateway did not touch it.
            - callout_profile_response:
                  - show:
                        duration: "(leg5.duration + leg6.duration) * CALLOUT_FADE_SHARE"
                        opacity:
                            from: 0
                            to: 1
                        easing: ease_out_quad
                        hold:
                            after: "(leg5.duration + leg6.duration) * (1 - CALLOUT_FADE_SHARE * 2)"
                  - show:
                        duration: "(leg5.duration + leg6.duration) * CALLOUT_FADE_SHARE"
                        opacity:
                            from: 1
                            to: 0
                        easing: ease_in_quad

        leg6.start:
            - badge_client:
                  - pulse:
                        duration: leg6.duration
                        cycles: PULSE_CYCLES
                        stroke: 'css("pulse-stroke-color")'
                        stroke_width: 'css("pulse-stroke-width")'

        # --- The request is answered; the packet leaves and the legend clears. ---
        # `walk.end` — the PARENT's bookmark — rather than `leg6.end`. Both resolve to
        # the same instant, and naming the whole journey says what this moment is.
        walk.end @ tear_down_ts:
            - packet:
                  - show:
                        opacity: 0
            - get_user_profile_v1:
                  - show:
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"

    capture:
        # An INTERMEDIATE: the beats stitch into ./request_response.mp4, which is the
        # deliverable that lands beside the document.
        video_flow:
            output: "./resource/video/scene_01_flow.mp4"
            fps: 30
