# ------------------------------------------
# request-response — Audio Generation
# ------------------------------------------
# Generates the narration for the three beats. Run ONCE, before rendering them, and
# again whenever a script changes.
#
# This is the FIRST step of the build, not an afterthought, because the narration is
# what the animation is timed to. Each beat declares its own line as an audio asset and
# derives its dwell from that clip's probed `.duration`, so the visuals stretch to the
# voice rather than the voice being trimmed to fit. Re-record a line and the scene
# re-fits itself on the next render; nothing is measured by hand and pasted across.
#
#     kinaigraph narrate.yaml --outdir .
#
# Needs ELEVENLABS_API_KEY in the environment. Every run costs credits and calls out to
# the provider, so it is deliberately a separate file from the scenes — re-rendering a
# beat must not re-synthesise audio that did not change.

metadata:
    title: "Request/Response - Audio Generation"
    description: "Generate the narration for the three interaction beats"
    version: "1.0"

defs:
    assets:
        elevenlabs_credentials:
            type: "credentials"
            env: "ELEVENLABS_API_KEY"

    defaults:
        tts:
            provider: "elevenlabs"
            credentials: "elevenlabs_credentials"
            voice: "Uh6UEmMIUnnL0GOOUghh" # Ray

synthesis:
    context:
        status: active

    tts:
        # Beat 1 — the flow. Establishes the system so the next two beats have
        # something to change, and names what the author did NOT write: the heading,
        # the lane, the six durations.
        #
        # ⚠️ ITS SIX CLAUSES ARE BALANCED AGAINST THE SIX LEGS, which are fixed
        # fractions of the walk. Rewrite a clause and the voice stops tracking the
        # packet — the fractions need re-checking after regenerating. At the
        # committed recording the worst boundary is 0.56 s out, 1.7% of the walk.
        audio_beat_01_flow:
            file: "./resource/script/part_01_flow.txt"
            export: "./resource/audio/part_01_flow.mp3"

        # Beat 2 — structural evolution. The diagram gains a node it was missing, by
        # editing the source rather than redrawing anything.
        audio_beat_02_store:
            file: "./resource/script/part_02_store.txt"
            export: "./resource/audio/part_02_store.mp3"

        # Beat 3 — compile-time theming. One document, a 2x1 grid, and each half
        # naming its own stylesheet. Free-form: nothing here is balanced against a leg.
        audio_beat_03_theme:
            file: "./resource/script/part_03_theme.txt"
            export: "./resource/audio/part_03_theme.mp3"
