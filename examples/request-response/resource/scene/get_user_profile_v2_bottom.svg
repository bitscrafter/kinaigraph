<svg id="get_user_profile_v2_bottom" width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- GENERATED: get_user_profile_v1.svg PLUS a Data Store the User service reads.
       The ONLY differences are the `data-store` group and the `link-store-user` path.
       Every other node, link, badge and rule is byte-identical to v1, because beat 2
       claims nothing was re-drawn and a viewer can check that claim by watching the
       cut. Re-derive this file from v1 rather than hand-editing it.

       Static architecture diagram (Scenes 01-02). The chevron-packet that animates
       through this flow lives in a separate, stacked scene asset
       (resource/scene/chevron_layer.svg). Both SVGs share the 0 0 1280 720 viewBox
       so the DSL move coordinates apply across layers.

       Theming: each element carries a class matching its id; the style block below
       maps that class to the theme variables and the element's typography. The
       stylesheet owns the VALUES; this file owns the MAPPING. Every var() carries a
       fallback holding theme_dark.css's value, so opening this file directly in a
       browser renders the dark theme rather than an unstyled diagram. Swap the
       attached theme CSS to retheme. -->

  <style>
    .scene-bg { fill: var(--scene-background-color, #1a1a1a); }

    .title    { fill: var(--title-text-color, #ffffff); font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 26px; font-weight: 600; text-anchor: middle; }

    .link-client-gateway,
    .link-gateway-auth,
    .link-gateway-user,
    .link-store-user   { stroke: var(--link-stroke-color, #666666); stroke-width: var(--link-stroke-width, 2); stroke-dasharray: var(--link-dash-pattern, 6 4); }

    /* Every node carries its stroke on the GROUP (not the rect) so a stroke pulse
       on the actor — which targets the group element — reaches the rect via
       inheritance; the rect keeps only its own fill, and the text opts out of the
       stroke so the pulse highlights the border only. */
    .client            { stroke: var(--service-node-stroke-color, #555555); stroke-width: var(--service-node-stroke-width, 2); }
    .client rect       { fill: var(--service-node-fill-color, #333333); }
    .client text       { fill: var(--node-label-text-color, #eeeeee); stroke: none; font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 14px; text-anchor: middle; }

    .api-gateway       { stroke: var(--gateway-stroke-color, #444444); stroke-width: var(--gateway-stroke-width, 2); }
    .api-gateway rect  { fill: var(--gateway-fill-color, #222222); }
    .api-gateway text  { fill: var(--title-text-color, #ffffff); stroke: none; font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 16px; font-weight: bold; text-anchor: middle; }

    .auth-service      { stroke: var(--service-node-stroke-color, #555555); stroke-width: var(--service-node-stroke-width, 2); }
    .auth-service rect { fill: var(--service-node-fill-color, #333333); }
    .auth-service text { fill: var(--node-label-text-color, #eeeeee); stroke: none; font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 14px; text-anchor: middle; }

    .data-store        { stroke: var(--service-node-stroke-color, #555555); stroke-width: var(--service-node-stroke-width, 2); }
    .data-store rect   { fill: var(--service-node-fill-color, #333333); }
    .data-store text   { fill: var(--node-label-text-color, #eeeeee); stroke: none; font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 14px; text-anchor: middle; }

    .user-service      { stroke: var(--service-node-stroke-color, #555555); stroke-width: var(--service-node-stroke-width, 2); }
    .user-service rect { fill: var(--service-node-fill-color, #333333); }
    .user-service text { fill: var(--node-label-text-color, #eeeeee); stroke: none; font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 14px; text-anchor: middle; }

    .step-1-badge circle, .step-2-badge circle, .step-3-badge circle, .step-4-badge circle {
      fill: var(--step-badge-fill-color, #444444); stroke: var(--step-badge-stroke-color, #888888); stroke-width: var(--step-badge-stroke-width, 1.5);
    }
    .step-1-badge text, .step-2-badge text, .step-3-badge text, .step-4-badge text {
      fill: var(--title-text-color, #ffffff); font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 13px; font-weight: bold; text-anchor: middle;
    }
  </style>

  <rect class="scene-bg" width="1280" height="720" />

  <text id="title" class="title" x="640" y="115" text-anchor="middle">Get User Profile</text>

  <!-- Connection lines: center-to-center geometry; in-box portions hidden by the node groups. -->
  <path id="link-client-gateway" class="link-client-gateway" d="M 290 360 L 580 360" />
  <path id="link-gateway-auth" class="link-gateway-auth" d="M 700 360 L 980 260" />
  <path id="link-gateway-user" class="link-gateway-user" d="M 700 360 L 980 460" />
  <!-- Store to user: edge to edge, like every other link here. 35 px of it is
       visible; the nodes are that close. -->
  <path id="link-store-user" class="link-store-user" d="M 1040 420 L 1040 385" />

  <g id="client" class="client">
    <rect x="190" y="310" width="100" height="100" rx="10" />
    <text x="240" y="365">Client</text>
  </g>

  <g id="api-gateway" class="api-gateway">
    <rect x="580" y="260" width="120" height="200" rx="10" />
    <text x="640" y="365">API Gateway</text>
  </g>

  <g id="auth-service" class="auth-service">
    <rect x="980" y="220" width="120" height="80" rx="8" />
    <text x="1040" y="265">Auth Service</text>
  </g>

  <!-- The added shared store, in the gap between auth and user (centre 1040,360). -->
  <g id="data-store" class="data-store">
    <rect id="data-store-box" x="980" y="335" width="120" height="50" rx="8" />
    <text x="1040" y="365">Data Store</text>
  </g>

  <g id="user-service" class="user-service">
    <rect x="980" y="420" width="120" height="80" rx="8" />
    <text x="1040" y="465">User Service</text>
  </g>

  <g id="step-1-badge" class="step-1-badge">
    <circle cx="240" cy="285" r="14" />
    <text x="240" y="290">1</text>
  </g>

  <g id="step-2-badge" class="step-2-badge">
    <circle cx="640" cy="235" r="14" />
    <text x="640" y="240">2</text>
  </g>

  <g id="step-3-badge" class="step-3-badge">
    <circle cx="1040" cy="195" r="14" />
    <text x="1040" y="200">3</text>
  </g>

  <!-- Below the user service, not above it: v2 puts the shared store in the gap
       above, and the two diagrams must differ by the store ALONE. -->
  <g id="step-4-badge" class="step-4-badge">
    <circle cx="1040" cy="560" r="14" />
    <text x="1040" y="565">4</text>
  </g>

</svg>
