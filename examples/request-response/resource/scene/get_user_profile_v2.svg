<svg id="get_user_profile_v2" width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- v2 diagram: get_user_profile_v1 + a Data Store the User service reads.
       Differences from get_user_profile_v1.svg:
         - new node data-store (centered at 1040,360)
         - one new leg: link-store-user (auth is stateless — JWT authn/authz — so it
           does NOT consult the store; only the user service does)
         - auth-service moved up and user-service moved down; step-4 sits at the
           bottom-centre of the user service
       The callout naming the store is NOT drawn here. It is a `note` annotation
       declared by the document that uses this scene, so its box, pointer and fade
       are authored in YAML rather than baked into the artwork — see the example
       README. This file stays a pure diagram.
       The chevron-packet layer (chevron_layer.svg) is stacked on top, sharing this
       0 0 1280 720 viewBox so move coordinates match.

       Theming: each element carries a class matching its id; the style block below
       maps that class to the theme variables and the element's typography (one class
       encloses everything a given element needs). The stylesheet owns the VALUES;
       this file owns the MAPPING. Every var() carries a fallback holding
       theme_dark.css's value, so opening this file directly in a browser renders the
       dark theme rather than an unstyled diagram. Swap the attached theme CSS to
       retheme. -->

  <style>
    .scene-bg      { fill: var(--scene-background-color, #1a1a1a); }

    .title         { fill: var(--title-text-color, #ffffff); font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 26px; font-weight: 600; text-anchor: middle; }

    .link-client-gateway,
    .link-gateway-auth,
    .link-gateway-user,
    .link-store-user { stroke: var(--link-stroke-color, #666666); stroke-width: var(--link-stroke-width, 2); stroke-dasharray: var(--link-dash-pattern, 6 4); }

    .client rect       { fill: var(--service-node-fill-color, #333333); stroke: var(--service-node-stroke-color, #555555); stroke-width: var(--service-node-stroke-width, 2); }
    .client text       { fill: var(--node-label-text-color, #eeeeee); font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 14px; text-anchor: middle; }

    .api-gateway rect  { fill: var(--gateway-fill-color, #222222); stroke: var(--gateway-stroke-color, #444444); stroke-width: var(--gateway-stroke-width, 2); }
    .api-gateway text  { fill: var(--title-text-color, #ffffff); font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 16px; font-weight: bold; text-anchor: middle; }

    .auth-service rect { fill: var(--service-node-fill-color, #333333); stroke: var(--service-node-stroke-color, #555555); stroke-width: var(--service-node-stroke-width, 2); }
    .auth-service text { fill: var(--node-label-text-color, #eeeeee); font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 14px; text-anchor: middle; }

    .data-store rect   { fill: var(--service-node-fill-color, #333333); stroke: var(--service-node-stroke-color, #555555); stroke-width: var(--service-node-stroke-width, 2); }
    .data-store text   { fill: var(--node-label-text-color, #eeeeee); font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 14px; text-anchor: middle; }

    .user-service rect { fill: var(--service-node-fill-color, #333333); stroke: var(--service-node-stroke-color, #555555); stroke-width: var(--service-node-stroke-width, 2); }
    .user-service text { fill: var(--node-label-text-color, #eeeeee); font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 14px; text-anchor: middle; }

    .step-1-badge circle, .step-2-badge circle, .step-3-badge circle, .step-4-badge circle {
      fill: var(--step-badge-fill-color, #444444); stroke: var(--step-badge-stroke-color, #888888); stroke-width: var(--step-badge-stroke-width, 1.5);
    }
    .step-1-badge text, .step-2-badge text, .step-3-badge text, .step-4-badge text {
      fill: var(--title-text-color, #ffffff); font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif); font-size: 13px; font-weight: bold; text-anchor: middle;
    }
  </style>

  <rect class="scene-bg" width="1280" height="720" />

  <text id="title" class="title" x="640" y="115" text-anchor="middle">Get User Profile</text>

  <!-- Connection lines (center-to-center); in-box portions hidden by the node groups. -->
  <path id="link-client-gateway" class="link-client-gateway" d="M 290 360 L 580 360" />
  <path id="link-gateway-auth" class="link-gateway-auth" d="M 700 360 L 980 220" />
  <path id="link-gateway-user" class="link-gateway-user" d="M 700 360 L 980 500" />
  <path id="link-store-user" class="link-store-user" d="M 1040 460 L 1040 385" />

  <g id="client" class="client">
    <rect x="190" y="310" width="100" height="100" rx="10" />
    <text x="240" y="365">Client</text>
  </g>

  <g id="api-gateway" class="api-gateway">
    <rect x="580" y="260" width="120" height="200" rx="10" />
    <text x="640" y="365">API Gateway</text>
  </g>

  <!-- Auth moved up (center 1040,220). -->
  <g id="auth-service" class="auth-service">
    <rect x="980" y="180" width="120" height="80" rx="8" />
    <text x="1040" y="225">Auth Service</text>
  </g>

  <!-- The added shared store (center 1040,360). -->
  <g id="data-store" class="data-store">
    <rect id="data-store-box" x="980" y="335" width="120" height="50" rx="8" />
    <text x="1040" y="365">Data Store</text>
  </g>

  <!-- User moved down (center 1040,500). -->
  <g id="user-service" class="user-service">
    <rect x="980" y="460" width="120" height="80" rx="8" />
    <text x="1040" y="505">User Service</text>
  </g>

  <g id="step-1-badge" class="step-1-badge">
    <circle cx="240" cy="285" r="14" />
    <text x="240" y="290">1</text>
  </g>

  <g id="step-2-badge" class="step-2-badge">
    <circle cx="640" cy="240" r="14" />
    <text x="640" y="245">2</text>
  </g>

  <!-- Step 3 follows auth up. -->
  <g id="step-3-badge" class="step-3-badge">
    <circle cx="1040" cy="155" r="14" />
    <text x="1040" y="160">3</text>
  </g>

  <!-- Step 4 at the bottom-centre of the user service. -->
  <g id="step-4-badge" class="step-4-badge">
    <circle cx="1040" cy="560" r="14" />
    <text x="1040" y="565">4</text>
  </g>

</svg>
