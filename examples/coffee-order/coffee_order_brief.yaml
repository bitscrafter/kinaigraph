# A UML sequence diagram, drawn as it is explained.
#
# ⚡ THE DIAGRAM'S AXIS AND THE VIDEO'S AXIS ARE THE SAME AXIS. A sequence
# diagram is the one drawing whose vertical direction means TIME. The drawing is
# 1520 tall, the frame is 1080, and the camera walks down it as the story
# advances — so the playback head and the diagram's own clock move together.
# Every other diagram in this repository is spatial; this one is not.
#
# THE CAMERA. There is no camera primitive, so the drawing moves instead. The
# `<svg>` root is the actor and it takes the `move` itself; the mark is a
# separate scene, frame-sized, so it never travels.
#
# ⚠️ WHAT IS REVEALED AND WHAT IS FADED, AND WHY IT IS NOT A STYLE CHOICE.
# `reveal` works by arc-length dash offset — the same property a dashed stroke
# already uses. So the SOLID call arrows draw themselves, and the DASHED returns
# and lifelines fade instead. A dashed stroke cannot be drawn on without giving
# up its dashes.
#
# ⚠️ EVERY ARROWHEAD IS ITS OWN ACTOR. A `marker` is not touched by the dash
# machinery, so a marker-headed arrow shows its point before the shaft arrives.
# Each head is shown when its shaft lands.

metadata:
    title: "Coffee Order — a sequence diagram, drawn as it is told"
    description: "lifelines, activations, opt and par, walked by a descending camera"
    version: "1.0"

defs:
    assets:
        diagram:
            type: "scene"
            file: "./resource/scene/sequence_coffee_order.svg"
            style: style

        # Frame-sized and never moved, so the mark stays put while the diagram
        # travels under it.
        brand:
            type: "scene"
            file: "./resource/scene/brand_layer.svg"

        # The drawing itself is the actor the camera moves. `pivot: top_left`
        # because the default `center` scales about the drawing's own middle,
        # which moves as the drawing does.
        # ⛔ THIS IS THE INNER GROUP, NOT THE SCENE ROOT. Targeting the root
        # `<svg>` as an actor resets the scene every frame and every child state
        # written alongside it is discarded — the drawing renders complete and
        # never moves. Measured, not guessed: that is exactly what the first
        # build of this example did.
        sheet:
            type: "actor"
            part_of: diagram
            id: sheet
            pivot: top_left

        # 1x1 grid: the diagram and the mark share the single cell and z-stack
        # by declaration order — diagram first, mark over it.
        stage:
            type: "layout"
            kind: "grid"
            rows: 1
            cols: 1

        # ── the furniture ────────────────────────────────────────────────────
        life_customer:
            type: "actor"
            part_of: diagram
            id: life_customer
        life_barista:
            type: "actor"
            part_of: diagram
            id: life_barista
        life_machine:
            type: "actor"
            part_of: diagram
            id: life_machine
        life_wand:
            type: "actor"
            part_of: diagram
            id: life_wand

        head_customer:
            type: "actor"
            part_of: diagram
            id: head_customer
        head_barista:
            type: "actor"
            part_of: diagram
            id: head_barista
        head_machine:
            type: "actor"
            part_of: diagram
            id: head_machine
        head_wand:
            type: "actor"
            part_of: diagram
            id: head_wand

        title:
            type: "actor"
            part_of: diagram
            id: title

        # ── the activation bars ──────────────────────────────────────────────
        # Stroked lines rather than rects, so `reveal` grows them DOWNWARD —
        # a rect's stroke would draw around its perimeter instead.
        bar_customer:
            type: "actor"
            part_of: diagram
            id: bar_customer
        bar_barista:
            type: "actor"
            part_of: diagram
            id: bar_barista
        bar_machine:
            type: "actor"
            part_of: diagram
            id: bar_machine
        bar_wand:
            type: "actor"
            part_of: diagram
            id: bar_wand
        bar_prepare:
            type: "actor"
            part_of: diagram
            id: bar_prepare

        # ── the messages ─────────────────────────────────────────────────────
        msg_order:
            type: "actor"
            part_of: diagram
            id: msg_order
        head_order:
            type: "actor"
            part_of: diagram
            id: head_order
        lbl_order:
            type: "actor"
            part_of: diagram
            id: lbl_order

        msg_name:
            type: "actor"
            part_of: diagram
            id: msg_name
        head_name:
            type: "actor"
            part_of: diagram
            id: head_name
        lbl_name:
            type: "actor"
            part_of: diagram
            id: lbl_name

        frag_opt:
            type: "actor"
            part_of: diagram
            id: frag_opt
        ret_outofoat:
            type: "actor"
            part_of: diagram
            id: ret_outofoat
        lbl_outofoat:
            type: "actor"
            part_of: diagram
            id: lbl_outofoat
        msg_semi:
            type: "actor"
            part_of: diagram
            id: msg_semi
        head_semi:
            type: "actor"
            part_of: diagram
            id: head_semi
        lbl_semi:
            type: "actor"
            part_of: diagram
            id: lbl_semi

        frag_par:
            type: "actor"
            part_of: diagram
            id: frag_par
        frag_par_divider:
            type: "actor"
            part_of: diagram
            id: frag_par_divider
        msg_shot:
            type: "actor"
            part_of: diagram
            id: msg_shot
        head_shot:
            type: "actor"
            part_of: diagram
            id: head_shot
        lbl_shot:
            type: "actor"
            part_of: diagram
            id: lbl_shot
        ret_espresso:
            type: "actor"
            part_of: diagram
            id: ret_espresso
        lbl_espresso:
            type: "actor"
            part_of: diagram
            id: lbl_espresso
        msg_steam:
            type: "actor"
            part_of: diagram
            id: msg_steam
        head_steam:
            type: "actor"
            part_of: diagram
            id: head_steam
        lbl_steam:
            type: "actor"
            part_of: diagram
            id: lbl_steam
        ret_milk:
            type: "actor"
            part_of: diagram
            id: ret_milk
        lbl_milk:
            type: "actor"
            part_of: diagram
            id: lbl_milk

        msg_prepare:
            type: "actor"
            part_of: diagram
            id: msg_prepare
        head_prepare:
            type: "actor"
            part_of: diagram
            id: head_prepare
        lbl_prepare:
            type: "actor"
            part_of: diagram
            id: lbl_prepare

        ret_handoff:
            type: "actor"
            part_of: diagram
            id: ret_handoff
        lbl_handoff:
            type: "actor"
            part_of: diagram
            id: lbl_handoff

        # ── the riders ───────────────────────────────────────────────────────
        # One mug per message. Separate elements rather than one token reused,
        # because the `par` needs TWO in flight at the same moment.
        rider_order:
            type: "actor"
            part_of: diagram
            id: rider_order
        rider_semi:
            type: "actor"
            part_of: diagram
            id: rider_semi
        rider_shot:
            type: "actor"
            part_of: diagram
            id: rider_shot
        rider_steam:
            type: "actor"
            part_of: diagram
            id: rider_steam
        rider_outofoat:
            type: "actor"
            part_of: diagram
            id: rider_outofoat
        rider_espresso:
            type: "actor"
            part_of: diagram
            id: rider_espresso
        rider_milk:
            type: "actor"
            part_of: diagram
            id: rider_milk
        rider_handoff:
            type: "actor"
            part_of: diagram
            id: rider_handoff
        rider_name:
            type: "actor"
            part_of: diagram
            id: rider_name
        rider_prepare:
            type: "actor"
            part_of: diagram
            id: rider_prepare

        # ── groups ───────────────────────────────────────────────────────────
        # ⚡ A GROUP BROADCASTS; IT IS NOT A CONTAINER. Naming one in a timeline
        # expands into one instruction per member, so members stay individually
        # addressable afterwards — which is why `not_yet` can hide forty actors
        # in one line and every one of them can still be shown on its own beat.
        #
        # ⚠️ The two starting states are different PROPERTIES, not one state:
        # a faded thing waits at `opacity: 0`, a drawn thing at `reveal: 0`.
        # They cannot share a group because they do not share a verb.
        not_yet:
            type: "group"
            member_type: "actor"
            members:
                - head_order
                - head_name
                - head_semi
                - head_shot
                - head_steam
                - head_prepare
                - ret_outofoat
                - ret_espresso
                - ret_milk
                - ret_handoff
                - lbl_order
                - lbl_name
                - lbl_outofoat
                - lbl_semi
                - lbl_shot
                - lbl_espresso
                - lbl_steam
                - lbl_milk
                - lbl_prepare
                - lbl_handoff
                - frag_opt
                - frag_par
                - frag_par_divider
                - rider_order
                - rider_semi
                - rider_shot
                - rider_steam
                - rider_outofoat
                - rider_espresso
                - rider_milk
                - rider_name
                - rider_prepare
                - life_customer
                - life_barista
                - life_machine
                - life_wand

        undrawn:
            type: "group"
            member_type: "actor"
            members:
                - bar_customer
                - bar_barista
                - bar_machine
                - bar_wand
                - bar_prepare
                - msg_order
                - msg_name
                - msg_semi
                - msg_shot
                - msg_steam
                - msg_prepare

        # The four lifelines arrive together, and always have.
        lifelines:
            type: "group"
            member_type: "actor"
            members:
                - life_customer
                - life_barista
                - life_machine
                - life_wand

        # ⚡ The barista's work and the customer's wait begin together, advance
        # together and end together. They were two identical entries at every
        # beat; as a group the document says once what it used to say five times.
        long_bars:
            type: "group"
            member_type: "actor"
            members:
                - bar_barista
                - bar_customer

        # ⚡ THE `par` GROUPS ARE THE ARGUMENT, not a saving. Two entries at one
        # bookmark merely happen to coincide; a group STATES that the espresso
        # leg and the milk leg are one thing that happens once.
        # ⛔ The riders are deliberately NOT grouped: a group move may only use
        # `dx`, and these two cross different distances.
        par_frame:
            type: "group"
            member_type: "actor"
            members:
                - frag_par
                - frag_par_divider
        # The two devices acknowledge together, as they work together.
        par_boxes:
            type: "group"
            member_type: "actor"
            members: [head_machine, head_wand]

        par_calls:
            type: "group"
            member_type: "actor"
            members:
                - msg_shot
                - msg_steam
        par_heads:
            type: "group"
            member_type: "actor"
            members:
                - head_shot
                - head_steam
        par_bars:
            type: "group"
            member_type: "actor"
            members:
                - bar_machine
                - bar_wand
        par_returns:
            type: "group"
            member_type: "actor"
            members:
                - lbl_espresso
                - lbl_milk
                - ret_espresso
                - ret_milk

        # ── narration ────────────────────────────────────────────────────────
        # One clip per beat. Each is declared for its DURATION as much as for its
        # sound: the beat it belongs to lasts exactly as long as the line, so
        # re-recording one sentence re-times one beat and nothing else.
        # Generate them with narrate_brief.yaml before rendering.
        narration_01:
            type: "audio"
            file: "./resource/audio/brief/part_01_order.mp3"
        narration_02:
            type: "audio"
            file: "./resource/audio/brief/part_02_name.mp3"
        narration_03:
            type: "audio"
            file: "./resource/audio/brief/part_03_opt.mp3"
        narration_04:
            type: "audio"
            file: "./resource/audio/brief/part_04_par.mp3"
        narration_05:
            type: "audio"
            file: "./resource/audio/brief/part_05_prepare.mp3"
        narration_06:
            type: "audio"
            file: "./resource/audio/brief/part_06_handoff.mp3"

        template:
            type: "template"
            file: "./resource/template/main.html"
            style: style
        style:
            type: "style"
            file: "./resource/style/theme_paper.css"

    const:
        # ── the camera ───────────────────────────────────────────────────────
        FRAME_H: 1080
        SHEET_BOTTOM: 1600 # how deep the conversation runs; the helper prints it
        TRAVEL: "SHEET_BOTTOM - FRAME_H"
        # ⚠️ 0.42 left the par frame's bottom edge 1.6px off screen.
        STOP_MID: "TRAVEL * 0.50"

        # ⚡ TWO CLOCKS, AND EACH BEAT USES BOTH. The mechanical half — an arrow
        # drawing, a label arriving, a bar advancing — runs on plain
        # milliseconds and is over quickly. The narrated half is the MUG'S
        # JOURNEY, and that takes exactly as long as the line spoken over it.
        # So every beat is a pair: `beat_pre_<x>` sets the message up fast,
        # `beat_<x>` carries the voice across.
        NOD_MS: 360 # a participant acknowledging what just reached it
        FADE_MS: 250 # anything that cannot be drawn, arriving
        DRAW_MS: 750 # a call arrow drawing itself


        # ── how far each long bar has grown ──────────────────────────────────
        # The drawing's own row positions, as fractions of the bar's length, so
        # moving a row in the artwork moves the bar with it.
        BAR_TOP: 284
        BAR_BOTTOM: 1538
        GROWN_ORDER: "(344 - BAR_TOP) / (BAR_BOTTOM - BAR_TOP)"
        GROWN_NAME: "(436 - BAR_TOP) / (BAR_BOTTOM - BAR_TOP)"
        GROWN_OPT: "(686 - BAR_TOP) / (BAR_BOTTOM - BAR_TOP)"
        GROWN_PAR: "(1260 - BAR_TOP) / (BAR_BOTTOM - BAR_TOP)"
        GROWN_PREPARE: "(1460 - BAR_TOP) / (BAR_BOTTOM - BAR_TOP)"

        # ── the lifelines, so a mug's run is a distance between people ───────

        VIDEO_MARGIN: 400 # quiet at the very end
        BEAT_PAD: 250

animation:
    context:
        layout: stage
        scenes:
            - asset: diagram
              cell:
                  - 0
                  - 0
            - asset: brand
              cell:
                  - 0
                  - 0

    timeline:
        # ── setup: an empty counter ──────────────────────────────────────────
        # ⚡ ACTIONS INSIDE ONE ENTRY RUN IN SEQUENCE. That is the whole reason
        # there is no `hold` arithmetic below: a beat is written as the list of
        # things that happen, in order, and each states only its own length.
        0 @ setup:
            - sheet:
                  - show:
                        opacity: 1
            - brand:
                  - show:
                        opacity: 1
            - title:
                  - show:
                        opacity: 1
            - head_customer:
                  - show:
                        opacity: 1
            - head_barista:
                  - show:
                        opacity: 1
            - head_machine:
                  - show:
                        opacity: 1
            - head_wand:
                  - show:
                        opacity: 1
            - undrawn:
                  - show:
                        opacity: 1
                        reveal: 0
            - not_yet:
                  - show:
                        opacity: 0
            - rider_handoff:
                  - show:
                        hold:
                            after: BEAT_PAD
                        opacity: 0

        # ── 1. the order ─────────────────────────────────────────────────────
        setup.end @ beat_pre_order:
            - lifelines:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - lbl_order:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - msg_order:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - head_order:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - long_bars:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: "GROWN_ORDER"
            - rider_order:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1

        beat_pre_order.end @ beat_order:
            - rider_order:
                  - move:
                        duration: "narration_01.duration"
                        anchor:
                            asset: msg_order
                            pos: right
                            dx: -30
                        origin: center
                        easing: "ease_in_out_quad"
                  - show:
                        duration: "FADE_MS"
                        opacity: 0
            - head_barista:
                  - pulse:
                        hold:
                            before: "narration_01.duration"
                        duration: "NOD_MS"
                        cycles: 1
                        scale:
                            from: 1
                            to: 1.06
                        pivot: center

        # ── 2. the cup is written ────────────────────────────────────────────
        beat_order.end @ beat_pre_name:
            - lbl_name:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - msg_name:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - head_name:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - long_bars:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: "GROWN_ORDER"
                            to: "GROWN_NAME"
            - rider_name:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1

        beat_pre_name.end @ beat_name:
            - rider_name:
                  - move:
                        duration: "narration_02.duration * 0.4"
                        anchor:
                            asset: msg_name
                            pos: top_right
                        origin: center
                        easing: "ease_in_out_quad"
                  - move:
                        duration: "narration_02.duration * 0.25"
                        anchor:
                            asset: msg_name
                            pos: bottom_right
                        origin: center
                        easing: "ease_in_out_quad"
                  - move:
                        duration: "narration_02.duration * 0.35"
                        anchor:
                            asset: msg_name
                            pos: bottom_left
                        origin: center
                        easing: "ease_in_out_quad"
                  - show:
                        duration: "FADE_MS"
                        opacity: 0
            - head_barista:
                  - pulse:
                        hold:
                            before: "narration_02.duration"
                        duration: "NOD_MS"
                        cycles: 1
                        scale:
                            from: 1
                            to: 1.06
                        pivot: center

        # ── 3. the detour some mornings take ─────────────────────────────────
        beat_name.end @ beat_pre_opt:
            - frag_opt:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - lbl_outofoat:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - ret_outofoat:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - long_bars:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: "GROWN_NAME"
                            to: "GROWN_OPT"
            - rider_outofoat:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1

        beat_pre_opt.end @ beat_opt:
            - rider_outofoat:
                  - move:
                        duration: "narration_03.duration * 0.5"
                        anchor:
                            asset: ret_outofoat
                            pos: left
                            dx: 30
                        origin: center
                        easing: "ease_in_out_quad"
                  - show:
                        duration: "FADE_MS"
                        opacity: 0
            - lbl_semi:
                  - show:
                        hold:
                            before: "narration_03.duration * 0.5 + FADE_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - msg_semi:
                  - show:
                        hold:
                            before: "narration_03.duration * 0.5 + FADE_MS"
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - head_semi:
                  - show:
                        hold:
                            before: "narration_03.duration * 0.5 + FADE_MS + DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - rider_semi:
                  - show:
                        hold:
                            before: "narration_03.duration * 0.5 + FADE_MS + DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
                  - move:
                        duration: "narration_03.duration * 0.5"
                        anchor:
                            asset: msg_semi
                            pos: right
                            dx: -30
                        origin: center
                        easing: "ease_in_out_quad"
                  - show:
                        duration: "FADE_MS"
                        opacity: 0
            - head_customer:
                  - pulse:
                        hold:
                            before: "narration_03.duration * 0.5"
                        duration: "NOD_MS"
                        cycles: 1
                        scale:
                            from: 1
                            to: 1.06
                        pivot: center
            - head_barista:
                  - pulse:
                        hold:
                            before: "narration_03.duration"
                        duration: "NOD_MS"
                        cycles: 1
                        scale:
                            from: 1
                            to: 1.06
                        pivot: center

        # ── 4. the two slow jobs, at the same time ───────────────────────────
        beat_opt.end @ beat_pre_par:
            - sheet:
                  - move:
                        duration: "DRAW_MS"
                        dy: "-STOP_MID"
                        easing: "ease_in_out_quad"
            - par_frame:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - lbl_shot:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - lbl_steam:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - par_calls:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - par_heads:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - par_bars:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - long_bars:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: "GROWN_OPT"
                            to: "GROWN_PAR"
            - rider_shot:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - rider_steam:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1

        beat_pre_par.end @ beat_par:
            - rider_shot:
                  - move:
                        duration: "narration_04.duration * 0.5"
                        anchor:
                            asset: msg_shot
                            pos: right
                            dx: -30
                        origin: center
                        easing: "ease_in_out_quad"
                  - show:
                        duration: "FADE_MS"
                        opacity: 0
            - rider_steam:
                  - move:
                        duration: "narration_04.duration * 0.5"
                        anchor:
                            asset: msg_steam
                            pos: right
                            dx: -30
                        origin: center
                        easing: "ease_in_out_quad"
                  - show:
                        duration: "FADE_MS"
                        opacity: 0
            - par_returns:
                  - show:
                        hold:
                            before: "narration_04.duration * 0.5 + FADE_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - rider_espresso:
                  - show:
                        hold:
                            before: "narration_04.duration * 0.5 + FADE_MS"
                        duration: "FADE_MS"
                        opacity: 1
                  - move:
                        duration: "narration_04.duration * 0.5"
                        anchor:
                            asset: ret_espresso
                            pos: left
                            dx: 30
                        origin: center
                        easing: "ease_in_out_quad"
                  - show:
                        duration: "FADE_MS"
                        opacity: 0
            - rider_milk:
                  - show:
                        hold:
                            before: "narration_04.duration * 0.5 + FADE_MS"
                        duration: "FADE_MS"
                        opacity: 1
                  - move:
                        duration: "narration_04.duration * 0.5"
                        anchor:
                            asset: ret_milk
                            pos: left
                            dx: 30
                        origin: center
                        easing: "ease_in_out_quad"
                  - show:
                        duration: "FADE_MS"
                        opacity: 0
            - par_boxes:
                  - pulse:
                        hold:
                            before: "narration_04.duration * 0.5"
                        duration: "NOD_MS"
                        cycles: 1
                        scale:
                            from: 1
                            to: 1.06
                        pivot: center
            - head_barista:
                  - pulse:
                        hold:
                            before: "narration_04.duration"
                        duration: "NOD_MS"
                        cycles: 1
                        scale:
                            from: 1
                            to: 1.06
                        pivot: center

        # ── 5. the two halves become one drink ───────────────────────────────
        beat_par.end @ beat_pre_prepare:
            - sheet:
                  - move:
                        duration: "DRAW_MS"
                        dy: "-(TRAVEL - STOP_MID)"
                        easing: "ease_in_out_quad"
            - lbl_prepare:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - msg_prepare:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - head_prepare:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - bar_prepare:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - long_bars:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: "GROWN_PAR"
                            to: "GROWN_PREPARE"
            - rider_prepare:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1

        beat_pre_prepare.end @ beat_prepare:
            - rider_prepare:
                  - move:
                        duration: "narration_05.duration * 0.4"
                        anchor:
                            asset: msg_prepare
                            pos: top_right
                        origin: center
                        easing: "ease_in_out_quad"
                  - move:
                        duration: "narration_05.duration * 0.25"
                        anchor:
                            asset: msg_prepare
                            pos: bottom_right
                        origin: center
                        easing: "ease_in_out_quad"
                  - move:
                        duration: "narration_05.duration * 0.35"
                        anchor:
                            asset: msg_prepare
                            pos: bottom_left
                        origin: center
                        easing: "ease_in_out_quad"
                  - show:
                        duration: "FADE_MS"
                        opacity: 0
            - head_barista:
                  - pulse:
                        hold:
                            before: "narration_05.duration"
                        duration: "NOD_MS"
                        cycles: 1
                        scale:
                            from: 1
                            to: 1.06
                        pivot: center

        # ── 6. the handover ──────────────────────────────────────────────────
        beat_prepare.end @ beat_pre_handoff:
            - lbl_handoff:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - ret_handoff:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - long_bars:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: "GROWN_PREPARE"
                            to: 1
            - rider_handoff:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1

        # The drink reaches the customer and goes with them — the last thing to
        # leave, and the only actor that exits rather than simply stopping.
        beat_pre_handoff.end @ beat_handoff:
            - rider_handoff:
                  - move:
                        duration: "narration_06.duration"
                        anchor:
                            asset: ret_handoff
                            pos: left
                            dx: 30
                        origin: center
                        easing: "ease_in_out_quad"
                  - show:
                        hold:
                            after: "VIDEO_MARGIN"
                        duration: "FADE_MS"
                        opacity: 0
            - head_customer:
                  - pulse:
                        hold:
                            before: "narration_06.duration"
                        duration: "NOD_MS"
                        cycles: 1
                        scale:
                            from: 1
                            to: 1.06
                        pivot: center

    capture:
        video_coffee_order_animation:
            output: "./resource/video/coffee_order_brief_animation.mp4"
            fps: 30

composition:
    context:
        status: active

    timeline:
        "0":
            - video_coffee_order_animation:
                  - roll:
                  - mix:
                        span:
                            from: "animation::beat_order.start"
