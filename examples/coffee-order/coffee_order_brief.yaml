# A UML sequence diagram, drawn as it is explained.
#
# ⚡ THE DIAGRAM'S AXIS AND THE VIDEO'S AXIS ARE THE SAME AXIS. A sequence
# diagram is the one drawing whose vertical direction means TIME. The drawing is
# 1520 tall, the frame is 1080, and the camera walks down it as the story
# advances — so the playback head and the diagram's own clock move together.
# Every other diagram in this repository is spatial; this one is not.
#
# THE CAMERA. There is no camera primitive, so the drawing moves instead. The
# `<svg>` root is the actor and it takes the `move` itself; the mark is a
# separate scene, frame-sized, so it never travels.
#
# ⚠️ WHAT IS REVEALED AND WHAT IS FADED, AND WHY IT IS NOT A STYLE CHOICE.
# `reveal` works by arc-length dash offset — the same property a dashed stroke
# already uses. So the SOLID call arrows draw themselves, and the DASHED returns
# and lifelines fade instead. A dashed stroke cannot be drawn on without giving
# up its dashes.
#
# ⚠️ EVERY ARROWHEAD IS ITS OWN ACTOR. A `marker` is not touched by the dash
# machinery, so a marker-headed arrow shows its point before the shaft arrives.
# Each head is shown when its shaft lands.

metadata:
    title: "Coffee Order — a sequence diagram, drawn as it is told"
    description: "lifelines, activations, opt and par, walked by a descending camera"
    version: "1.0"

defs:
    assets:
        diagram:
            type: "scene"
            file: "./resource/scene/sequence_coffee_order.svg"
            style: style

        # Frame-sized and never moved, so the mark stays put while the diagram
        # travels under it.
        brand:
            type: "scene"
            file: "./resource/scene/brand_layer.svg"

        # The drawing itself is the actor the camera moves. `pivot: top_left`
        # because the default `center` scales about the drawing's own middle,
        # which moves as the drawing does.
        # ⛔ THIS IS THE INNER GROUP, NOT THE SCENE ROOT. Targeting the root
        # `<svg>` as an actor resets the scene every frame and every child state
        # written alongside it is discarded — the drawing renders complete and
        # never moves. Measured, not guessed: that is exactly what the first
        # build of this example did.
        sheet:
            type: "actor"
            part_of: diagram
            id: sheet
            pivot: top_left

        # 1x1 grid: the diagram and the mark share the single cell and z-stack
        # by declaration order — diagram first, mark over it.
        stage:
            type: "layout"
            kind: "grid"
            rows: 1
            cols: 1

        # ── the furniture ────────────────────────────────────────────────────
        life_customer: { type: "actor", part_of: diagram, id: life_customer }
        life_barista: { type: "actor", part_of: diagram, id: life_barista }
        life_machine: { type: "actor", part_of: diagram, id: life_machine }
        life_wand: { type: "actor", part_of: diagram, id: life_wand }

        head_customer: { type: "actor", part_of: diagram, id: head_customer }
        head_barista: { type: "actor", part_of: diagram, id: head_barista }
        head_machine: { type: "actor", part_of: diagram, id: head_machine }
        head_wand: { type: "actor", part_of: diagram, id: head_wand }

        title: { type: "actor", part_of: diagram, id: title }
        subtitle: { type: "actor", part_of: diagram, id: subtitle }

        # ── the activation bars ──────────────────────────────────────────────
        # Stroked lines rather than rects, so `reveal` grows them DOWNWARD —
        # a rect's stroke would draw around its perimeter instead.
        bar_customer: { type: "actor", part_of: diagram, id: bar_customer }
        bar_barista: { type: "actor", part_of: diagram, id: bar_barista }
        bar_machine: { type: "actor", part_of: diagram, id: bar_machine }
        bar_wand: { type: "actor", part_of: diagram, id: bar_wand }
        bar_prepare: { type: "actor", part_of: diagram, id: bar_prepare }

        # ── the messages ─────────────────────────────────────────────────────
        msg_order: { type: "actor", part_of: diagram, id: msg_order }
        head_order: { type: "actor", part_of: diagram, id: head_order }
        lbl_order: { type: "actor", part_of: diagram, id: lbl_order }

        msg_name: { type: "actor", part_of: diagram, id: msg_name }
        head_name: { type: "actor", part_of: diagram, id: head_name }
        lbl_name: { type: "actor", part_of: diagram, id: lbl_name }

        frag_opt: { type: "actor", part_of: diagram, id: frag_opt }
        ret_outofoat: { type: "actor", part_of: diagram, id: ret_outofoat }
        head_outofoat: { type: "actor", part_of: diagram, id: head_outofoat }
        lbl_outofoat: { type: "actor", part_of: diagram, id: lbl_outofoat }
        msg_semi: { type: "actor", part_of: diagram, id: msg_semi }
        head_semi: { type: "actor", part_of: diagram, id: head_semi }
        lbl_semi: { type: "actor", part_of: diagram, id: lbl_semi }

        frag_par: { type: "actor", part_of: diagram, id: frag_par }
        frag_par_divider: { type: "actor", part_of: diagram, id: frag_par_divider }
        msg_shot: { type: "actor", part_of: diagram, id: msg_shot }
        head_shot: { type: "actor", part_of: diagram, id: head_shot }
        lbl_shot: { type: "actor", part_of: diagram, id: lbl_shot }
        ret_espresso: { type: "actor", part_of: diagram, id: ret_espresso }
        head_espresso: { type: "actor", part_of: diagram, id: head_espresso }
        lbl_espresso: { type: "actor", part_of: diagram, id: lbl_espresso }
        msg_steam: { type: "actor", part_of: diagram, id: msg_steam }
        head_steam: { type: "actor", part_of: diagram, id: head_steam }
        lbl_steam: { type: "actor", part_of: diagram, id: lbl_steam }
        ret_milk: { type: "actor", part_of: diagram, id: ret_milk }
        head_milk: { type: "actor", part_of: diagram, id: head_milk }
        lbl_milk: { type: "actor", part_of: diagram, id: lbl_milk }

        msg_prepare: { type: "actor", part_of: diagram, id: msg_prepare }
        head_prepare: { type: "actor", part_of: diagram, id: head_prepare }
        lbl_prepare: { type: "actor", part_of: diagram, id: lbl_prepare }

        ret_handoff: { type: "actor", part_of: diagram, id: ret_handoff }
        head_handoff: { type: "actor", part_of: diagram, id: head_handoff }
        lbl_handoff: { type: "actor", part_of: diagram, id: lbl_handoff }

        # ── the riders ───────────────────────────────────────────────────────
        # One mug per message. Separate elements rather than one token reused,
        # because the `par` needs TWO in flight at the same moment.
        rider_order: { type: "actor", part_of: diagram, id: rider_order }
        rider_semi: { type: "actor", part_of: diagram, id: rider_semi }
        rider_shot: { type: "actor", part_of: diagram, id: rider_shot }
        rider_steam: { type: "actor", part_of: diagram, id: rider_steam }
        rider_outofoat: { type: "actor", part_of: diagram, id: rider_outofoat }
        rider_espresso: { type: "actor", part_of: diagram, id: rider_espresso }
        rider_milk: { type: "actor", part_of: diagram, id: rider_milk }
        rider_handoff: { type: "actor", part_of: diagram, id: rider_handoff }
        rider_name: { type: "actor", part_of: diagram, id: rider_name }
        rider_prepare: { type: "actor", part_of: diagram, id: rider_prepare }

        # ── narration ────────────────────────────────────────────────────────
        # One clip per beat. Each is declared for its DURATION as much as for its
        # sound: the beat it belongs to lasts exactly as long as the line, so
        # re-recording one sentence re-times one beat and nothing else.
        # Generate them with narrate_brief.yaml before rendering.
        narration_01: { type: "audio", file: "./resource/audio/brief/part_01_order.mp3" }
        narration_02: { type: "audio", file: "./resource/audio/brief/part_02_name.mp3" }
        narration_03: { type: "audio", file: "./resource/audio/brief/part_03_opt.mp3" }
        narration_04: { type: "audio", file: "./resource/audio/brief/part_04_par.mp3" }
        narration_05: { type: "audio", file: "./resource/audio/brief/part_05_prepare.mp3" }
        narration_06: { type: "audio", file: "./resource/audio/brief/part_06_handoff.mp3" }

        template:
            type: "template"
            file: "./resource/template/main.html"
            style: style
        style:
            type: "style"
            file: "./resource/style/theme_paper.css"

    const:
        # ── the camera ───────────────────────────────────────────────────────
        FRAME_H: 1080
        SHEET_BOTTOM: 1600 # how deep the conversation runs; the helper prints it
        TRAVEL: "SHEET_BOTTOM - FRAME_H"
        STOP_MID: "TRAVEL * 0.42"

        # ── every duration in the piece is a SHARE OF ITS OWN LINE ───────────
        # ⚡ There is not one millisecond anywhere below. Each of these is a
        # fraction of the sentence being spoken over that beat, so a longer line
        # does not just wait longer — it draws, travels and rests longer, in
        # proportion. Re-record anything and the whole beat re-fits itself.
        DRAW: 0.16 # a call arrow drawing itself
        FADE: 0.09 # anything that cannot be drawn, arriving
        RUN: 0.36 # a mug crossing the gap between two lifelines
        DESCEND: 0.34 # the camera, taken EARLY so its row is there to be used
        PAUSE: 0.04 # quiet after the line, before the next begins

        # ── how far each long bar has grown ──────────────────────────────────
        # The drawing's own row positions, as fractions of the bar's length, so
        # moving a row in the artwork moves the bar with it.
        BAR_TOP: 284
        BAR_BOTTOM: 1538
        GROWN_ORDER: "(344 - BAR_TOP) / (BAR_BOTTOM - BAR_TOP)"
        GROWN_NAME: "(436 - BAR_TOP) / (BAR_BOTTOM - BAR_TOP)"
        GROWN_OPT: "(686 - BAR_TOP) / (BAR_BOTTOM - BAR_TOP)"
        GROWN_PAR: "(1260 - BAR_TOP) / (BAR_BOTTOM - BAR_TOP)"
        GROWN_PREPARE: "(1460 - BAR_TOP) / (BAR_BOTTOM - BAR_TOP)"

        # ── the lifelines, so a mug's run is a distance between people ───────
        X_CUSTOMER: 300
        X_BARISTA: 750
        X_MACHINE: 1200
        X_WAND: 1650

        # The three legs of a self-call loop: out, down, back onto the bar.
        SELF_OUT: 110
        SELF_DOWN: 64
        SELF_BACK: -94

        MARGIN: 400 # quiet at the very end

animation:
    context:
        layout: stage
        scenes:
            - asset: diagram
              cell: [0, 0]
            - asset: brand
              cell: [0, 0]

    timeline:
        # ── setup: an empty counter ──────────────────────────────────────────
        # ⚡ ACTIONS INSIDE ONE ENTRY RUN IN SEQUENCE. That is the whole reason
        # there is no `hold` arithmetic below: a beat is written as the list of
        # things that happen, in order, and each states only its own length.
        0 @ setup:
            - sheet: [{ show: { opacity: 1 } }]
            - brand: [{ show: { opacity: 1 } }]
            - title: [{ show: { opacity: 1 } }]
            - subtitle: [{ show: { opacity: 1 } }]
            - head_customer: [{ show: { opacity: 1 } }]
            - head_barista: [{ show: { opacity: 1 } }]
            - head_machine: [{ show: { opacity: 1 } }]
            - head_wand: [{ show: { opacity: 1 } }]
            - bar_customer: [{ show: { opacity: 1, reveal: 0 } }]
            - bar_barista: [{ show: { opacity: 1, reveal: 0 } }]
            - bar_machine: [{ show: { opacity: 1, reveal: 0 } }]
            - bar_wand: [{ show: { opacity: 1, reveal: 0 } }]
            - bar_prepare: [{ show: { opacity: 1, reveal: 0 } }]
            - msg_order: [{ show: { opacity: 1, reveal: 0 } }]
            - msg_name: [{ show: { opacity: 1, reveal: 0 } }]
            - msg_semi: [{ show: { opacity: 1, reveal: 0 } }]
            - msg_shot: [{ show: { opacity: 1, reveal: 0 } }]
            - msg_steam: [{ show: { opacity: 1, reveal: 0 } }]
            - msg_prepare: [{ show: { opacity: 1, reveal: 0 } }]
            - head_order: [{ show: { opacity: 0 } }]
            - head_name: [{ show: { opacity: 0 } }]
            - head_semi: [{ show: { opacity: 0 } }]
            - head_shot: [{ show: { opacity: 0 } }]
            - head_steam: [{ show: { opacity: 0 } }]
            - head_prepare: [{ show: { opacity: 0 } }]
            - head_outofoat: [{ show: { opacity: 0 } }]
            - head_espresso: [{ show: { opacity: 0 } }]
            - head_milk: [{ show: { opacity: 0 } }]
            - head_handoff: [{ show: { opacity: 0 } }]
            - ret_outofoat: [{ show: { opacity: 0 } }]
            - ret_espresso: [{ show: { opacity: 0 } }]
            - ret_milk: [{ show: { opacity: 0 } }]
            - ret_handoff: [{ show: { opacity: 0 } }]
            - lbl_order: [{ show: { opacity: 0 } }]
            - lbl_name: [{ show: { opacity: 0 } }]
            - lbl_outofoat: [{ show: { opacity: 0 } }]
            - lbl_semi: [{ show: { opacity: 0 } }]
            - lbl_shot: [{ show: { opacity: 0 } }]
            - lbl_espresso: [{ show: { opacity: 0 } }]
            - lbl_steam: [{ show: { opacity: 0 } }]
            - lbl_milk: [{ show: { opacity: 0 } }]
            - lbl_prepare: [{ show: { opacity: 0 } }]
            - lbl_handoff: [{ show: { opacity: 0 } }]
            - frag_opt: [{ show: { opacity: 0 } }]
            - frag_par: [{ show: { opacity: 0 } }]
            - frag_par_divider: [{ show: { opacity: 0 } }]
            - rider_order: [{ show: { opacity: 0 } }]
            - rider_semi: [{ show: { opacity: 0 } }]
            - rider_shot: [{ show: { opacity: 0 } }]
            - rider_steam: [{ show: { opacity: 0 } }]
            - rider_outofoat: [{ show: { opacity: 0 } }]
            - rider_espresso: [{ show: { opacity: 0 } }]
            - rider_milk: [{ show: { opacity: 0 } }]
            - rider_name: [{ show: { opacity: 0 } }]
            - rider_prepare: [{ show: { opacity: 0 } }]
            - life_customer: [{ show: { opacity: 0 } }]
            - life_barista: [{ show: { opacity: 0 } }]
            - life_machine: [{ show: { opacity: 0 } }]
            - life_wand: [{ show: { opacity: 0 } }]
            - rider_handoff:
                  - show:
                        opacity: 0
                        hold:
                            after: 400

        # ── 1. the order ─────────────────────────────────────────────────────
        setup.end @ beat_order:
            - life_customer: [{ show: { opacity: 1, duration: "narration_01.duration * FADE" } }]
            - life_barista: [{ show: { opacity: 1, duration: "narration_01.duration * FADE" } }]
            - life_machine: [{ show: { opacity: 1, duration: "narration_01.duration * FADE" } }]
            - life_wand: [{ show: { opacity: 1, duration: "narration_01.duration * FADE" } }]
            - lbl_order:
                  - show:
                        opacity: 1
                        duration: "narration_01.duration * FADE"
                        hold:
                            after: "narration_01.duration * (1 + PAUSE - FADE)"
            - msg_order:
                  - show: { reveal: { from: 0, to: 1 }, duration: "narration_01.duration * DRAW" }
            - head_order:
                  - show: { opacity: 0, duration: "narration_01.duration * DRAW" }
                  - show: { opacity: 1, duration: 1 }
            - rider_order:
                  - show: { opacity: 0, duration: "narration_01.duration * DRAW" }
                  - show: { opacity: 1, duration: "narration_01.duration * FADE" }
                  - move: { dx: "X_BARISTA - X_CUSTOMER", duration: "narration_01.duration * RUN", easing: "ease_in_out_quad" }
                  - show: { opacity: 0, duration: "narration_01.duration * FADE" }
            - bar_barista:
                  - show: { reveal: 0, duration: "narration_01.duration * DRAW" }
                  - show: { reveal: { from: 0, to: "GROWN_ORDER" }, duration: "narration_01.duration * RUN" }
            - bar_customer:
                  - show: { reveal: 0, duration: "narration_01.duration * DRAW" }
                  - show: { reveal: { from: 0, to: "GROWN_ORDER" }, duration: "narration_01.duration * RUN" }

        # ── 2. the cup is written ────────────────────────────────────────────
        beat_order.end @ beat_name:
            - lbl_name:
                  - show:
                        opacity: 1
                        duration: "narration_02.duration * FADE"
                        hold:
                            after: "narration_02.duration * (1 + PAUSE - FADE)"
            - msg_name:
                  - show: { reveal: { from: 0, to: 1 }, duration: "narration_02.duration * DRAW" }
            - head_name:
                  - show: { opacity: 0, duration: "narration_02.duration * DRAW" }
                  - show: { opacity: 1, duration: 1 }
            - rider_name:
                  - show: { opacity: 0, duration: "narration_02.duration * DRAW" }
                  - show: { opacity: 1, duration: "narration_02.duration * FADE" }
                  - move: { dx: "SELF_OUT", duration: "narration_02.duration * RUN * 0.4", easing: "ease_in_out_quad" }
                  - move: { dy: "SELF_DOWN", duration: "narration_02.duration * RUN * 0.25", easing: "linear" }
                  - move: { dx: "SELF_BACK", duration: "narration_02.duration * RUN * 0.35", easing: "ease_in_out_quad" }
                  - show: { opacity: 0, duration: "narration_02.duration * FADE" }
            - bar_barista:
                  - show: { reveal: "GROWN_ORDER", duration: "narration_02.duration * DRAW" }
                  - show: { reveal: { from: "GROWN_ORDER", to: "GROWN_NAME" }, duration: "narration_02.duration * RUN" }
            - bar_customer:
                  - show: { reveal: "GROWN_ORDER", duration: "narration_02.duration * DRAW" }
                  - show: { reveal: { from: "GROWN_ORDER", to: "GROWN_NAME" }, duration: "narration_02.duration * RUN" }

        # ── 3. the detour some mornings take ─────────────────────────────────
        beat_name.end @ beat_opt:
            - sheet:
                  - move: { dy: "-STOP_MID", duration: "narration_03.duration * DRAW", easing: "ease_in_out_quad" }
            - frag_opt:
                  - show: { opacity: 0, duration: "narration_03.duration * DRAW" }
                  - show: { opacity: 1, duration: "narration_03.duration * FADE" }
            - lbl_outofoat:
                  - show: { opacity: 0, duration: "narration_03.duration * DRAW" }
                  - show:
                        opacity: 1
                        duration: "narration_03.duration * FADE"
                        hold:
                            after: "narration_03.duration * (1 + PAUSE - FADE)"
            - ret_outofoat:
                  - show: { opacity: 0, duration: "narration_03.duration * DRAW" }
                  - show: { opacity: 1, duration: "narration_03.duration * FADE" }
            - head_outofoat:
                  - show: { opacity: 0, duration: "narration_03.duration * FADE" }
                  - show: { opacity: 1, duration: 1 }
            - rider_outofoat:
                  - show: { opacity: 0, duration: "narration_03.duration * FADE" }
                  - show: { opacity: 1, duration: "narration_03.duration * FADE" }
                  - move: { dx: "X_CUSTOMER - X_BARISTA", duration: "narration_03.duration * RUN * 0.55", easing: "ease_in_out_quad" }
                  - show: { opacity: 0, duration: "narration_03.duration * FADE" }
            - lbl_semi:
                  - show: { opacity: 0, duration: "narration_03.duration * (FADE * 3 + RUN * 0.55)" }
                  - show: { opacity: 1, duration: "narration_03.duration * FADE" }
            - msg_semi:
                  - show: { reveal: 0, duration: "narration_03.duration * (FADE * 3 + RUN * 0.55)" }
                  - show: { reveal: { from: 0, to: 1 }, duration: "narration_03.duration * DRAW" }
            - head_semi:
                  - show: { opacity: 0, duration: "narration_03.duration * ((DESCEND + 0.34) + DRAW)" }
                  - show: { opacity: 1, duration: 1 }
            - rider_semi:
                  - show: { opacity: 0, duration: "narration_03.duration * (FADE * 3 + RUN * 0.55 + DRAW)" }
                  - show: { opacity: 1, duration: "narration_03.duration * FADE" }
                  - move: { dx: "X_BARISTA - X_CUSTOMER", duration: "narration_03.duration * RUN * 0.55", easing: "ease_in_out_quad" }
                  - show: { opacity: 0, duration: "narration_03.duration * FADE" }
            - bar_barista:
                  - show: { reveal: "GROWN_NAME", duration: "narration_03.duration * DRAW" }
                  - show: { reveal: { from: "GROWN_NAME", to: "GROWN_OPT" }, duration: "narration_03.duration * RUN" }
            - bar_customer:
                  - show: { reveal: "GROWN_NAME", duration: "narration_03.duration * DRAW" }
                  - show: { reveal: { from: "GROWN_NAME", to: "GROWN_OPT" }, duration: "narration_03.duration * RUN" }

        # ── 4. the two slow jobs, at the same time ───────────────────────────
        # ⚡ BOTH OPERANDS ARE ENTRIES AT THE SAME BOOKMARK, so they run together
        # — two mugs in flight at once. That is the one thing the drawing can
        # only say by convention, its compartments being stacked in a picture
        # where down has meant later all along.
        beat_opt.end @ beat_par:
            - frag_par:
                  - show: { opacity: 1, duration: "narration_04.duration * FADE" }
            - frag_par_divider:
                  - show: { opacity: 1, duration: "narration_04.duration * FADE" }
            - lbl_shot:
                  - show:
                        opacity: 1
                        duration: "narration_04.duration * FADE"
                        hold:
                            after: "narration_04.duration * (1 + PAUSE - FADE)"
            - lbl_steam:
                  - show: { opacity: 0, duration: "narration_04.duration * 0.02" }
                  - show: { opacity: 1, duration: "narration_04.duration * FADE" }
            - msg_shot:
                  - show: { reveal: { from: 0, to: 1 }, duration: "narration_04.duration * DRAW" }
            - head_shot:
                  - show: { opacity: 0, duration: "narration_04.duration * DRAW" }
                  - show: { opacity: 1, duration: 1 }
            - msg_steam:
                  - show: { reveal: { from: 0, to: 1 }, duration: "narration_04.duration * DRAW" }
            - head_steam:
                  - show: { opacity: 0, duration: "narration_04.duration * DRAW" }
                  - show: { opacity: 1, duration: 1 }
            - rider_shot:
                  - show: { opacity: 0, duration: "narration_04.duration * DRAW" }
                  - show: { opacity: 1, duration: "narration_04.duration * FADE" }
                  - move: { dx: "X_MACHINE - X_BARISTA", duration: "narration_04.duration * RUN", easing: "ease_in_out_quad" }
                  - show: { opacity: 0, duration: "narration_04.duration * FADE" }
            - rider_steam:
                  - show: { opacity: 0, duration: "narration_04.duration * DRAW" }
                  - show: { opacity: 1, duration: "narration_04.duration * FADE" }
                  - move: { dx: "X_WAND - X_BARISTA", duration: "narration_04.duration * RUN", easing: "ease_in_out_quad" }
                  - show: { opacity: 0, duration: "narration_04.duration * FADE" }
            - bar_machine:
                  - show: { reveal: 0, duration: "narration_04.duration * DRAW" }
                  - show: { reveal: { from: 0, to: 1 }, duration: "narration_04.duration * RUN" }
            - bar_wand:
                  - show: { reveal: 0, duration: "narration_04.duration * DRAW" }
                  - show: { reveal: { from: 0, to: 1 }, duration: "narration_04.duration * RUN" }
            - lbl_espresso:
                  - show: { opacity: 0, duration: "narration_04.duration * 0.40" }
                  - show: { opacity: 1, duration: "narration_04.duration * FADE" }
            - lbl_milk:
                  - show: { opacity: 0, duration: "narration_04.duration * 0.40" }
                  - show: { opacity: 1, duration: "narration_04.duration * FADE" }
            - ret_espresso:
                  - show: { opacity: 0, duration: "narration_04.duration * 0.40" }
                  - show: { opacity: 1, duration: "narration_04.duration * FADE" }
            - head_espresso:
                  - show: { opacity: 0, duration: "narration_04.duration * (0.40 + FADE)" }
                  - show: { opacity: 1, duration: 1 }
            - ret_milk:
                  - show: { opacity: 0, duration: "narration_04.duration * 0.40" }
                  - show: { opacity: 1, duration: "narration_04.duration * FADE" }
            - head_milk:
                  - show: { opacity: 0, duration: "narration_04.duration * (0.40 + FADE)" }
                  - show: { opacity: 1, duration: 1 }
            - rider_espresso:
                  - show: { opacity: 0, duration: "narration_04.duration * (0.40 + FADE)" }
                  - show: { opacity: 1, duration: "narration_04.duration * FADE" }
                  - move: { dx: "X_BARISTA - X_MACHINE", duration: "narration_04.duration * RUN", easing: "ease_in_out_quad" }
                  - show: { opacity: 0, duration: "narration_04.duration * FADE" }
            - rider_milk:
                  - show: { opacity: 0, duration: "narration_04.duration * (0.40 + FADE)" }
                  - show: { opacity: 1, duration: "narration_04.duration * FADE" }
                  - move: { dx: "X_BARISTA - X_WAND", duration: "narration_04.duration * RUN", easing: "ease_in_out_quad" }
                  - show: { opacity: 0, duration: "narration_04.duration * FADE" }
            - bar_barista:
                  - show: { reveal: "GROWN_OPT", duration: "narration_04.duration * DRAW" }
                  - show: { reveal: { from: "GROWN_OPT", to: "GROWN_PAR" }, duration: "narration_04.duration * RUN" }
            - bar_customer:
                  - show: { reveal: "GROWN_OPT", duration: "narration_04.duration * DRAW" }
                  - show: { reveal: { from: "GROWN_OPT", to: "GROWN_PAR" }, duration: "narration_04.duration * RUN" }

        # ── 5. the two halves become one drink ───────────────────────────────
        beat_par.end @ beat_prepare:
            - sheet:
                  - move: { dy: "-(TRAVEL - STOP_MID)", duration: "narration_05.duration * DESCEND", easing: "ease_in_out_quad" }
            - lbl_prepare:
                  - show: { opacity: 0, duration: "narration_05.duration * DESCEND" }
                  - show:
                        opacity: 1
                        duration: "narration_05.duration * FADE"
                        hold:
                            after: "narration_05.duration * (1 + PAUSE - FADE - DESCEND)"
            - msg_prepare:
                  - show: { reveal: 0, duration: "narration_05.duration * DESCEND" }
                  - show: { reveal: { from: 0, to: 1 }, duration: "narration_05.duration * DRAW" }
            - head_prepare:
                  - show: { opacity: 0, duration: "narration_05.duration * (DESCEND + DRAW)" }
                  - show: { opacity: 1, duration: 1 }
            - rider_prepare:
                  - show: { opacity: 0, duration: "narration_05.duration * (DESCEND + DRAW)" }
                  - show: { opacity: 1, duration: "narration_05.duration * FADE" }
                  - move: { dx: "SELF_OUT", duration: "narration_05.duration * RUN * 0.4", easing: "ease_in_out_quad" }
                  - move: { dy: "SELF_DOWN", duration: "narration_05.duration * RUN * 0.25", easing: "linear" }
                  - move: { dx: "SELF_BACK", duration: "narration_05.duration * RUN * 0.35", easing: "ease_in_out_quad" }
                  - show: { opacity: 0, duration: "narration_05.duration * FADE" }
            - bar_prepare:
                  - show: { reveal: 0, duration: "narration_05.duration * DESCEND" }
                  - show: { reveal: { from: 0, to: 1 }, duration: "narration_05.duration * RUN" }
            - bar_barista:
                  - show: { reveal: "GROWN_PAR", duration: "narration_05.duration * DESCEND" }
                  - show: { reveal: { from: "GROWN_PAR", to: "GROWN_PREPARE" }, duration: "narration_05.duration * RUN" }
            - bar_customer:
                  - show: { reveal: "GROWN_PAR", duration: "narration_05.duration * DESCEND" }
                  - show: { reveal: { from: "GROWN_PAR", to: "GROWN_PREPARE" }, duration: "narration_05.duration * RUN" }

        # ── 6. the handover ──────────────────────────────────────────────────
        beat_prepare.end @ beat_handoff:
            - lbl_handoff:
                  - show:
                        opacity: 1
                        duration: "narration_06.duration * FADE"
                        hold:
                            after: "narration_06.duration * (1 + PAUSE - FADE)"
            - ret_handoff:
                  - show: { opacity: 1, duration: "narration_06.duration * FADE" }
            - head_handoff:
                  - show: { opacity: 0, duration: "narration_06.duration * FADE" }
                  - show: { opacity: 1, duration: 1 }
            - bar_barista:
                  - show: { reveal: "GROWN_PREPARE", duration: "narration_06.duration * DRAW" }
                  - show: { reveal: { from: "GROWN_PREPARE", to: "1" }, duration: "narration_06.duration * RUN" }
            - bar_customer:
                  - show: { reveal: "GROWN_PREPARE", duration: "narration_06.duration * DRAW" }
                  - show: { reveal: { from: "GROWN_PREPARE", to: "1" }, duration: "narration_06.duration * RUN" }
            # The mug stays where it lands. It is the drink, and the drink
            # does not go anywhere after this.
            - rider_handoff:
                  - show: { opacity: 0, duration: "narration_06.duration * FADE" }
                  - show: { opacity: 1, duration: "narration_06.duration * FADE" }
                  - move:
                        dx: "X_CUSTOMER - X_BARISTA"
                        duration: "narration_06.duration * RUN"
                        easing: "ease_in_out_quad"
                        hold:
                            after: "MARGIN"

    capture:
        video_coffee_order_animation:
            output: "./resource/video/coffee_order_brief_animation.mp4"
            fps: 30

composition:
    context:
        status: active

    timeline:
        "0":
            - video_coffee_order_animation:
                  - roll:
                  - mix: { span: { from: "animation::beat_order.start" }, asset: narration_01 }
                  - mix: { span: { from: "animation::beat_name.start" }, asset: narration_02 }
                  - mix: { span: { from: "animation::beat_opt.start" }, asset: narration_03 }
                  - mix: { span: { from: "animation::beat_par.start" }, asset: narration_04 }
                  - mix: { span: { from: "animation::beat_prepare.start" }, asset: narration_05 }
                  - mix: { span: { from: "animation::beat_handoff.start" }, asset: narration_06 }

    capture:
        video_coffee_order:
            output: "./coffee_order_brief.mp4"
            fps: 30
