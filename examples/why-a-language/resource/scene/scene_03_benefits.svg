<?xml version="1.0" encoding="UTF-8"?>
<svg id="benefits" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1920" height="1080" class="canvas-bg"/>

    <defs>
        <style>
            /* ── Mapping only: class -> variable. The VALUES live in
                  ../style/theme_dark.css and ../style/theme_light.css. ───────
               Every var() carries the PAPER value as its fallback. ⚠️ GENERATED
               — see resource/temp/make_scenes.py. */

            .canvas-bg {
                fill: var(--scene-background-color, #f2eee5);
            }

            /* The icon catalog's vocabulary — only the classes this scene's
               own glyphs carry. */
            .icon-fill {
                fill: var(--icon-fill, #ffffff);
            }

            .icon-fill-light {
                fill: var(--icon-fill-light, #ece7dc);
            }

            .icon-fill-dark {
                fill: var(--icon-fill-dark, #4a4540);
            }

            .icon-stroke {
                stroke: var(--icon-stroke, #6b635a);
            }

            /* The thirteen benefit boxes. Unlike scene 02's pain-point boxes
               these take fill and stroke from ONE class, because no icon here
               reuses either half. */
            .benefit-box {
                fill: var(--box-fill-color, #ffffff);
                stroke: var(--box-stroke-color, #4a4540);
                stroke-width: 2;
                rx: 8;
            }

            /* Three ranks of text: the scene heading, the line under it, and
               each box's own title over its supporting line. */
            .heading-text {
                fill: var(--title-text-color, #1a1714);
                font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif);
                font-size: 72px;
                font-weight: 700;
                text-anchor: middle;
            }

            .subheading-text {
                fill: var(--title-text-color, #1a1714);
                font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif);
                font-size: 48px;
                font-weight: 500;
                text-anchor: middle;
            }

            .title-text {
                fill: var(--title-text-color, #1a1714);
                font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif);
                font-size: 36px;
                font-weight: 600;
                text-anchor: middle;
            }

            .subtitle-text {
                fill: var(--detail-text-color, #6b635a);
                font-family: var(--diagram-font-family, Arial, "Liberation Sans", Helvetica, sans-serif);
                font-size: 26px;
                font-weight: 400;
                text-anchor: middle;
            }
        </style>

<symbol id="eye" viewBox="0 0 24 24">
            <!-- Clam-like eye shape (taller and wider) -->
            <path
				d="M 2,12 Q 12,2 22,12 Q 12,22 2,12 Z"
				class="icon-fill icon-stroke"
				stroke-width="1"
			/>
            <!-- Pupil -->
            <circle cx="12" cy="12" r="2.25" class="icon-fill-dark" />
        </symbol>
<symbol id="square_ruler" viewBox="0 0 24 24">
            <!-- Triangle body with hole -->
            <path
				d="M 3,3 L 3,21 L 21,21 Z M 6.5,11 L 6.5,17 L 12.5,17 Z"
				class="icon-fill icon-stroke"
				stroke-width="1"
				stroke-linejoin="round"
			/>
            <!-- Ticks on left edge -->
            <line x1="3" y1="7" x2="5" y2="7" class="icon-stroke" stroke-width="0.8" />
            <line x1="3" y1="10" x2="6" y2="10" class="icon-stroke" stroke-width="0.8" />
            <line x1="3" y1="13" x2="5" y2="13" class="icon-stroke" stroke-width="0.8" />
            <line x1="3" y1="16" x2="5" y2="16" class="icon-stroke" stroke-width="0.8" />
            <!-- Ticks on bottom edge -->
            <line x1="7" y1="21" x2="7" y2="19" class="icon-stroke" stroke-width="0.8" />
            <line x1="10" y1="21" x2="10" y2="18" class="icon-stroke" stroke-width="0.8" />
            <line x1="13" y1="21" x2="13" y2="19" class="icon-stroke" stroke-width="0.8" />
            <line x1="16" y1="21" x2="16" y2="18" class="icon-stroke" stroke-width="0.8" />
        </symbol>
<symbol id="audio" viewBox="0 0 24 24">
            <!-- Audio waveform bars centered vertically -->
            <rect
				x="3"
				y="10"
				width="2"
				height="4"
				rx="1"
				class="icon-fill icon-stroke"
				stroke-width="0.75"
			/>
            <rect
				x="7"
				y="6"
				width="2"
				height="12"
				rx="1"
				class="icon-fill icon-stroke"
				stroke-width="0.75"
			/>
            <rect
				x="11"
				y="4"
				width="2"
				height="17"
				rx="1"
				class="icon-fill icon-stroke"
				stroke-width="0.75"
			/>
            <rect
				x="15"
				y="7"
				width="2"
				height="10"
				rx="1"
				class="icon-fill icon-stroke"
				stroke-width="0.75"
			/>
            <rect
				x="19"
				y="11"
				width="2"
				height="2"
				rx="1"
				class="icon-fill icon-stroke"
				stroke-width="0.75"
			/>
        </symbol>
<symbol id="pattern" viewBox="0 0 24 24">
            <!-- 3x3 Grid of circles -->
            <circle cx="6" cy="6" r="1.2" class="icon-fill icon-stroke" stroke-width="0.5" />
            <circle cx="12" cy="6" r="1.2" class="icon-fill icon-stroke" stroke-width="0.5" />
            <circle cx="18" cy="6" r="1.2" class="icon-fill icon-stroke" stroke-width="0.5" />

            <circle cx="6" cy="12" r="1.2" class="icon-fill icon-stroke" stroke-width="0.5" />
            <circle cx="12" cy="12" r="1.2" class="icon-fill icon-stroke" stroke-width="0.5" />
            <circle cx="18" cy="12" r="1.2" class="icon-fill icon-stroke" stroke-width="0.5" />

            <circle cx="6" cy="18" r="1.2" class="icon-fill icon-stroke" stroke-width="0.5" />
            <circle cx="12" cy="18" r="1.2" class="icon-fill icon-stroke" stroke-width="0.5" />
            <circle cx="18" cy="18" r="1.2" class="icon-fill icon-stroke" stroke-width="0.5" />

            <!-- Joining line -->
            <path
				d="M 6,18 L 12,12 L 18,12 L 18,6"
				fill="none"
				class="icon-stroke"
				stroke-width="1.2"
				stroke-linecap="round"
				stroke-linejoin="round"
			/>
        </symbol>
<symbol id="puzzle" viewBox="0 0 24 24">
            <!-- Top-Left piece -->
            <path
				d="M 4,4 L 12,4 L 12,7 A 1.5,1.5 0 0,1 12,10 L 12,12 L 9,12 A 1.5,1.5 0 0,0 6,12 L 4,12 Z"
				class="icon-fill icon-stroke"
				stroke-width="1"
			/>
            <!-- Top-Right piece -->
            <path
				d="M 12,4 L 20,4 L 20,12 L 17,12 A 1.5,1.5 0 0,0 14,12 L 12,12 L 12,10 A 1.5,1.5 0 0,0 12,7 L 12,4"
				class="icon-fill-light icon-stroke"
				stroke-width="1"
			/>
            <!-- Bottom-Left piece -->
            <path
				d="M 4,12 L 6,12 A 1.5,1.5 0 0,1 9,12 L 12,12 L 12,15 A 1.5,1.5 0 0,0 12,18 L 12,20 L 4,20 Z"
				class="icon-fill-light icon-stroke"
				stroke-width="1"
			/>
            <!-- Bottom-Right piece -->
            <path
				d="M 12,12 L 14,12 A 1.5,1.5 0 0,1 17,12 L 20,12 L 20,20 L 12,20 L 12,18 A 1.5,1.5 0 0,1 12,15 L 12,12"
				class="icon-fill icon-stroke"
				stroke-width="1"
			/>
        </symbol>
<symbol id="source_code" viewBox="0 0 24 24">
            <!-- Left bracket < -->
            <path
				d="M 7,8 L 2,12 L 7,16"
				fill="none"
				class="icon-stroke"
				stroke-width="1.25"
				stroke-linecap="round"
				stroke-linejoin="round"
			/>
            <!-- Right bracket > -->
            <path
				d="M 17,8 L 22,12 L 17,16"
				fill="none"
				class="icon-stroke"
				stroke-width="1.4"
				stroke-linecap="round"
				stroke-linejoin="round"
			/>
            <!-- Slash / -->
            <line
				x1="13"
				y1="6"
				x2="11"
				y2="18"
				class="icon-stroke"
				stroke-width="1.25"
				stroke-linecap="round"
			/>
        </symbol>
<symbol id="deterministic" viewBox="0 0 24 24">
            <!-- Source/Output anchor (6x6 square) -->
            <rect
				x="4"
				y="10"
				width="4.5"
				height="4.5"
				rx="0.5"
				class="icon-fill icon-stroke"
				stroke-width="1"
			/>
            <!-- Loop with r=5, center (15, 12) for 2px padding from square at x=8 -->
            <path
				d="M 12,8 A 5,5 0 1,1 12,16"
				fill="none"
				class="icon-stroke"
				stroke-width="1.25"
				stroke-linecap="round"
			/>
            <!-- Arrowhead at (12, 16), rotated CW to point towards the square -->
            <path
				d="M 15,15.2 L 12,16 L 14.2,18.8"
				fill="none"
				class="icon-stroke"
				stroke-width="1.25"
				stroke-linecap="round"
				stroke-linejoin="round"
			/>
        </symbol>
<symbol id="aiagent" viewBox="0 0 24 24">
            <!-- Antenna -->
            <line x1="12" y1="3" x2="12" y2="6" class="icon-stroke" stroke-width="1" />
            <circle cx="12" cy="3" r="1.5" class="icon-fill icon-stroke" stroke-width="1" />

            <!-- Robot head (rounded rectangle) -->
            <rect
				x="6"
				y="6"
				width="12"
				height="13"
				rx="2"
				ry="2"
				class="icon-fill icon-stroke"
				stroke-width="1"
			/>

            <!-- Left eye -->
            <circle cx="9" cy="11" r="1.75" class="icon-fill icon-stroke" stroke-width="1" />
            <circle cx="9" cy="11" r="0.85" class="icon-fill-dark" />

            <!-- Right eye -->
            <circle cx="15" cy="11" r="1.75" class="icon-fill icon-stroke" stroke-width="1" />
            <circle cx="15" cy="11" r="0.85" class="icon-fill-dark" />

            <!-- Mouth line -->
            <line x1="9" y1="16" x2="15" y2="16" class="icon-stroke" stroke-width="1" />
        </symbol>
<symbol id="version" viewBox="0 0 24 24">
            <!-- Main branch line (vertical) -->
            <line
				x1="8"
				y1="6"
				x2="8"
				y2="18"
				class="icon-stroke"
				stroke-width="1.25"
				stroke-linecap="round"
			/>
            <!-- Side branch rounded elbow connection (starting from top node) -->
            <path
				d="M 8,6 Q 16,6 16,14"
				fill="none"
				class="icon-stroke"
				stroke-width="1.25"
				stroke-linecap="round"
			/>

            <!-- Nodes (circles) -->
            <!-- Main branch nodes -->
            <circle cx="8" cy="6" r="2" class="icon-fill icon-stroke" stroke-width="1.5" />
            <circle cx="8" cy="18" r="2" class="icon-fill icon-stroke" stroke-width="1.5" />
            <!-- Side branch node (moved down) -->
            <circle cx="16" cy="14" r="2" class="icon-fill icon-stroke" stroke-width="1.5" />
        </symbol>
<symbol id="lightning" viewBox="0 0 24 24">
            <path
				d="M 15,3 L 9,3 L 6,12 L 11,12 L 8,21 L 18,10 L 13,10 L 15,3 Z"
				class="icon-fill icon-stroke"
				stroke-width="1.2"
				stroke-linejoin="round"
			/>
        </symbol>
<symbol id="robotic_arm" viewBox="0 0 24 24">
            <!-- Base -->
            <rect
				x="10"
				y="20"
				width="10"
				height="2"
				rx="0.5"
				class="icon-fill icon-stroke"
				stroke-width="1"
			/>
            <!-- Lower arm (romboid tilted left) -->
            <path
				d="M 15,20 L 7,10 L 10,10 L 18,20 Z"
				class="icon-fill icon-stroke"
				stroke-width="1"
			/>
            <!-- Elbow joint -->
            <circle cx="8.5" cy="10" r="2.5" class="icon-fill icon-stroke" stroke-width="1" />
            <!-- Upper arm (rectangle to the right) -->
            <rect
				x="8.5"
				y="9"
				width="8"
				height="2"
				class="icon-fill icon-stroke"
				stroke-width="1"
			/>
            <!-- Gripper (hexagon without right side) -->
            <path
				d="M 20,6 L 18,6 L 16.5,10 L 18,14 L 20,14"
				fill="none"
				class="icon-stroke"
				stroke-width="1.5"
				stroke-linecap="round"
				stroke-linejoin="round"
			/>
        </symbol>
<symbol id="language" viewBox="0 0 24 24">
          <!-- Top Character: 'A' -->
          <path d="m4 15 3.5-9L11 15" fill="none" class="icon-stroke" stroke-width="1" />
          <path d="M5.3 12h4.4" fill="none" class="icon-stroke" stroke-width="1" />

          <!-- Dividing / Linking Arrows -->
          <path d="M12 6h8" fill="none" class="icon-stroke" stroke-width="1" />
          <path d="m18 4 2 2-2 2" fill="none" class="icon-stroke" stroke-width="1" />

          <!-- Bottom Right: Asian Character/Symbol (Wen/Culture metaphor) -->
          <path d="M14 11h6" fill="none" class="icon-stroke" stroke-width="1" />
          <path d="M17 11v2a6 6 0 0 1-4 5" fill="none" class="icon-stroke" stroke-width="1" />
          <path
				d="M15.5 14.5c1.5 2 3.5 3.5 4.5 3.5"
				fill="none"
				class="icon-stroke"
				stroke-width="1"
			/>
        </symbol>
<symbol id="desktop_computer" viewBox="0 0 24 24">
        	<!-- Monitor screen -->
	        <rect
				x="2"
				y="4"
				width="13"
				height="10"
				rx="2"
				class="icon-fill icon-stroke"
				stroke-width="1"
			/>
	        <!-- Stand -->
	        <path d="M8.5 14v4" fill="none" class="icon-stroke" stroke-width="1" />
	        <path d="M5.5 18h6" fill="none" class="icon-stroke" stroke-width="1" />
	        <!-- Tower -->
	        <rect
				x="17"
				y="4"
				width="5"
				height="16"
				rx="1"
				class="icon-fill icon-stroke"
				stroke-width="1"
			/>
	        <path d="M19.5 7h.01" fill="none" class="icon-stroke" stroke-width="1" stroke-linecap="round" />
	        <path d="M19.5 10h.01" fill="none" class="icon-stroke" stroke-width="1" stroke-linecap="round" />
	        <path d="M18.5 16h2" fill="none" class="icon-stroke" stroke-width="1" />
        </symbol>
    </defs>

    <g id="heading">
        <text x="960" y="92" class="heading-text">The Better Way</text>
        <text x="960" y="160" class="subheading-text">Storytelling with Kinaigraph</text>
    </g>

    <g id="left_1" transform="translate(80, 210)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#eye" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Consistent Styling</text>
        <text x="280" y="100" class="subtitle-text">Unified Visuals</text>
    </g>
    <g id="left_2" transform="translate(80, 385)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#square_ruler" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Precision Control</text>
        <text x="280" y="100" class="subtitle-text">Time and Space</text>
    </g>
    <g id="left_3" transform="translate(80, 560)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#audio" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Narration-Paced</text>
        <text x="280" y="100" class="subtitle-text">Re-Record and It Re-Fits</text>
    </g>
    <g id="left_4" transform="translate(80, 735)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#pattern" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Pattern Reuse</text>
        <text x="280" y="100" class="subtitle-text">Source Structure</text>
    </g>
    <g id="left_5" transform="translate(80, 910)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#puzzle" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Composable</text>
        <text x="280" y="100" class="subtitle-text">Assemble Assets</text>
    </g>

    <g id="center_1" transform="translate(710, 385)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#source_code" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Declarative Code</text>
        <text x="280" y="100" class="subtitle-text">What, Not How</text>
    </g>
    <g id="center_2" transform="translate(710, 560)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#deterministic" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Deterministic</text>
        <text x="280" y="100" class="subtitle-text">Same Source, Same Output</text>
    </g>
    <g id="center_3" transform="translate(710, 735)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#aiagent" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">AI-Authorable</text>
        <text x="280" y="100" class="subtitle-text">LLM Writes the Source</text>
    </g>

    <g id="right_1" transform="translate(1340, 210)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#version" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Version Control</text>
        <text x="280" y="100" class="subtitle-text">Diff-Friendly Text</text>
    </g>
    <g id="right_2" transform="translate(1340, 385)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#lightning" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Fast Iterations</text>
        <text x="280" y="100" class="subtitle-text">Edit and Regenerate</text>
    </g>
    <g id="right_3" transform="translate(1340, 560)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#robotic_arm" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Scalable</text>
        <text x="280" y="100" class="subtitle-text">Automate Creation</text>
    </g>
    <g id="right_4" transform="translate(1340, 735)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#language" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Localization</text>
        <text x="280" y="100" class="subtitle-text">One Source, Many Languages</text>
    </g>
    <g id="right_5" transform="translate(1340, 910)">
        <rect class="benefit-box" width="500" height="140"/>
        <use href="#desktop_computer" x="30" y="45" width="50" height="50"/>
        <text x="280" y="62" class="title-text">Renders Locally</text>
        <text x="280" y="100" class="subtitle-text">No LLM at Render Time</text>
    </g>
</svg>
