# ------------------------------------------
# why-a-language — Audio Generation: the BRIEF cut
# ------------------------------------------
# Fifteen lines, and they are what makes this the short cut: the voice names a
# CATEGORY and lets the boxes enumerate it. Scene 2's shared band is three of
# them, one per wave.
#
# ⚠️ ONE CLIP PER CATEGORY, NOT FRACTIONS OF ONE CLIP. Each wave takes its
# length from its own line, so re-recording one sentence moves one wave and
# nothing else.
#
# ⚡ EACH CUT OWNS ITS WHOLE SCRIPT. This document lists every line the brief cut
# speaks — nothing is borrowed from the other cut, and two lines that happen to
# be word-for-word identical across the two are stored twice on purpose. A cut
# you can read and rebuild without cross-referencing the other one is worth the
# duplication.
#
#     kinaigraph scene_00_tts_brief.yaml
#
# Needs ELEVENLABS_API_KEY. Every run costs credits, and re-running this
# re-records EVERY line listed — `synthesis.context.status` is section-wide.
#
# ⛔ NEVER SWEEP THIS FOLDER with `for y in scene_*.yaml` — that pulls in both
# synthesis documents and re-records the whole example. Use
# `ls scene_*.yaml | grep -v scene_00`.

metadata:
    title: "Why a Language - Audio Generation (brief cut)"
    description: "Every line the brief cut speaks"
    version: "1.0"

defs:
    assets:
        elevenlabs_credentials:
            type: "credentials"
            env: "ELEVENLABS_API_KEY"

    defaults:
        tts:
            provider: "elevenlabs"
            credentials: "elevenlabs_credentials"
            voice: "Uh6UEmMIUnnL0GOOUghh" # Ray

synthesis:
    context:
        status: active

    tts:
        scene_01_01_premise:
            file: "./resource/script/brief/scene_01_01_premise.txt"
            export: "./resource/audio/brief/scene_01_01_premise.mp3"
        scene_02_01_hand_work:
