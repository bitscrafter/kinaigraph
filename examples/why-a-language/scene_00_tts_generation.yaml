# ------------------------------------------
# why-a-language — Audio Generation
# ------------------------------------------
# Generates the narration for all four scenes. Run ONCE, before rendering them,
# and again only when a script changes.
#
# This is the FIRST step of the build, not an afterthought, because the narration
# is what the animation is timed to. Every scene derives its phase lengths from
# its own lines' probed `.duration`, so the visuals stretch to the voice rather
# than the voice being trimmed to fit. Re-record a line and the scene re-fits
# itself on the next render; nothing is measured by hand and pasted across.
#
#     kinaigraph scene_00_tts_generation.yaml --outdir .
#
# Needs ELEVENLABS_API_KEY in the environment. Every run costs credits and calls
# out to the provider, so it is deliberately a separate file from the scenes —
# re-rendering a beat must not re-synthesise audio that did not change.
#
# ⛔ THE COMMITTED TAKE IS THE ONE THE SCENES ARE TIMED AGAINST. Regenerating
# replaces all thirteen clips, and each new length silently moves every fraction
# measured against the old one. Never sweep this directory with
# `for y in scene_*.yaml` — that pulls this file in and re-records the example.
# Use `ls scene_*.yaml | grep -v scene_00`.

metadata:
    title: "Why a Language - Audio Generation"
    description: "Generate the narration for the four scenes of the pitch"
    version: "1.0"

defs:
    assets:
        elevenlabs_credentials:
            type: "credentials"
            env: "ELEVENLABS_API_KEY"

    defaults:
        tts:
            provider: "elevenlabs"
            credentials: "elevenlabs_credentials"
            voice: "Uh6UEmMIUnnL0GOOUghh" # Ray

synthesis:
    context:
        status: active

    tts:
        # ── Scene 1: the premise ──────────────────────────────────────────────
        # One line, and the scene is sized to it end to end: the icons drift for
        # exactly its duration.
        scene_01_01_premise:
            file: "./resource/script/scene_01_01_premise.txt"
            export: "./resource/audio/scene_01_01_premise.mp3"

        # ── Scene 2: the challenge ────────────────────────────────────────────
        # Three lines, one per section of the diagram — what both approaches
        # cost, then what the traditional one costs, then what the AI one costs.
        # Each section's boxes slide in across its OWN line, so a re-recording
        # moves that section and nothing else.
        scene_02_01_intro:
            file: "./resource/script/scene_02_01_intro.txt"
            export: "./resource/audio/scene_02_01_intro.mp3"
        scene_02_02_traditional:
            file: "./resource/script/scene_02_02_traditional.txt"
            export: "./resource/audio/scene_02_02_traditional.mp3"
        scene_02_03_ai:
            file: "./resource/script/scene_02_03_ai.txt"
            export: "./resource/audio/scene_02_03_ai.mp3"

        # ── Scene 3: the benefits ─────────────────────────────────────────────
        # Four lines against a 4-2-4 layout: the centre pair, then the left
        # column, then the right, then a closing line that runs under the fade.
        scene_03_01_intro:
            file: "./resource/script/scene_03_01_intro.txt"
            export: "./resource/audio/scene_03_01_intro.mp3"
        scene_03_02_production:
            file: "./resource/script/scene_03_02_production.txt"
            export: "./resource/audio/scene_03_02_production.mp3"
        scene_03_03_workflow:
            file: "./resource/script/scene_03_03_workflow.txt"
            export: "./resource/audio/scene_03_03_workflow.mp3"
        scene_03_04_closing:
            file: "./resource/script/scene_03_04_closing.txt"
            export: "./resource/audio/scene_03_04_closing.mp3"

        # ── Scene 4: the possibilities ────────────────────────────────────────
        # Five short lines: an opener, then one per topic circle.
        scene_04_01_intro:
            file: "./resource/script/scene_04_01_intro.txt"
            export: "./resource/audio/scene_04_01_intro.mp3"
        scene_04_02_social:
            file: "./resource/script/scene_04_02_social.txt"
            export: "./resource/audio/scene_04_02_social.mp3"
        scene_04_03_docs:
            file: "./resource/script/scene_04_03_docs.txt"
            export: "./resource/audio/scene_04_03_docs.mp3"
        scene_04_04_edu:
            file: "./resource/script/scene_04_04_edu.txt"
            export: "./resource/audio/scene_04_04_edu.mp3"
        scene_04_05_biz:
            file: "./resource/script/scene_04_05_biz.txt"
            export: "./resource/audio/scene_04_05_biz.mp3"
