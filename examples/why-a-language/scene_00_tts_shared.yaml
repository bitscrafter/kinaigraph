# ------------------------------------------
# why-a-language — Audio Generation: the lines BOTH cuts use
# ------------------------------------------
# The example ships two cuts of the same argument, and these seven lines are
# word-for-word identical in both — the opener, scene 3's closing line, and
# scene 4's five topics. They are recorded once and rolled by both stitches, so
# neither cut's synthesis document owns them.
#
#     kinaigraph scene_00_tts_shared.yaml
#
# ⛔ THREE SYNTHESIS DOCUMENTS, AND EACH BILLS ONLY WHAT IT OWNS. Running this
# one does not touch the full cut's long lines or the brief cut's category
# lines; `synthesis.context.status` is section-wide, so a document that listed
# everything would re-record everything.
#
# Needs ELEVENLABS_API_KEY. Every run costs credits.
#
# ⛔ NEVER SWEEP THIS FOLDER with `for y in scene_*.yaml` — that pulls in all
# three synthesis documents and re-records the example. Use
# `ls scene_*.yaml | grep -v scene_00`.

metadata:
    title: "Why a Language - Audio Generation (shared)"
    description: "The lines both cuts use"
    version: "1.0"

defs:
    assets:
        elevenlabs_credentials:
            type: "credentials"
            env: "ELEVENLABS_API_KEY"

    defaults:
        tts:
            provider: "elevenlabs"
            credentials: "elevenlabs_credentials"
            voice: "Uh6UEmMIUnnL0GOOUghh" # Ray

synthesis:
    context:
        status: active

    tts:
        scene_01_01_premise:
            file: "./resource/script/scene_01_01_premise.txt"
            export: "./resource/audio/scene_01_01_premise.mp3"
        scene_03_04_closing:
            file: "./resource/script/scene_03_04_closing.txt"
            export: "./resource/audio/scene_03_04_closing.mp3"
        scene_04_01_intro:
            file: "./resource/script/scene_04_01_intro.txt"
            export: "./resource/audio/scene_04_01_intro.mp3"
        scene_04_02_social:
            file: "./resource/script/scene_04_02_social.txt"
            export: "./resource/audio/scene_04_02_social.mp3"
        scene_04_03_docs:
            file: "./resource/script/scene_04_03_docs.txt"
            export: "./resource/audio/scene_04_03_docs.mp3"
        scene_04_04_edu:
            file: "./resource/script/scene_04_04_edu.txt"
            export: "./resource/audio/scene_04_04_edu.mp3"
        scene_04_05_biz:
            file: "./resource/script/scene_04_05_biz.txt"
            export: "./resource/audio/scene_04_05_biz.mp3"
