# An annotated video built from a picture the author already had.
#
# `resource/image/atmosphere.png` is the input — a 1100 x 2700 raster. Nothing in
# it is an actor, nothing in it moves, and this document never edits it. What the
# document adds is a CAMERA and a set of CALLOUTS.
#
# THE CAMERA. The language has no camera primitive, so the picture moves instead.
# There is no rig to build: the <image> element IS the actor, it takes the move
# and the scale itself, and `pivot: top_left` keeps the picture's own origin
# still under the zoom. A picture point p therefore lands on screen at
# PAN + ZOOM × p — one expression, used below for every stop.
#
# THE CALLOUTS. Each note is parked in the 1920 x 1080 frame, so it stays the
# same size wherever the camera is, and each opens with a LABEL naming what it is
# about. NONE of them has a pointer, and that is the design: a leader is a claim
# about a place in the picture, and it goes stale silently the moment the words
# above it change. A label cannot come to disagree with its own sentence.
#
#   establish   the whole poster, fitted to the frame's height
#   push_in     zoom onto the masthead
#   upper … troposphere   pan down one band at a time, one callout each
#   pull_out    back to the whole poster
metadata:
    title: "The Air Above You — annotated layers tour"
    description: "a camera and callouts over a pre-existing PNG infographic"
    version: "1.0"

defs:
    assets:
        frame:
            type: "scene"
            file: "./resource/scene/atmosphere_frame.svg"
        # The picture itself. `pivot: top_left` — the default is `center`, which
        # scales about the actor's own middle: fine for a shape, wrong for a
        # camera, because the fixed point then moves as the picture does. With the
        # image drawn at (0, 0), the zoom leaves the origin alone and the pan alone
        # decides what is on screen.
        atmosphere_infographic:
            type: "actor"
            part_of: frame
            pivot: top_left

        # ── Callout texts ────────────────────────────────────────────────────────
        # Each one says something the poster does not say for itself. A callout that
        # repeats the caption under it has cost a viewer a read and told them nothing.
        title_text:
            type: "text"
            content: |
                ATMOSPHERE
                  Half of this air sits below 5.5 km —
                  lower than Everest's summit.
            font_family: 'Arial, "Liberation Sans", Helvetica, sans-serif'
            font_size: 30
            font_color: "#14181d"
        upper_text:
            type: "text"
            content: |
                AURORA
                  This layer glowing: oxygen atoms
                  struck by particles from the Sun.
            font_family: 'Arial, "Liberation Sans", Helvetica, sans-serif'
            font_size: 30
            font_color: "#14181d"
        # The poster has 41px of clear space beside the ISS marker — not enough for
        # the fact that makes it worth marking. The video is where it fits.
        iss_text:
            type: "text"
            content: |
                SPACE STATION
                  Four times above the edge of space,
                  and the air still drags it down.
            font_family: 'Arial, "Liberation Sans", Helvetica, sans-serif'
            font_size: 30
            font_color: "#14181d"
        mesosphere_text:
            type: "text"
            content: |
                NOCTILUCENT CLOUDS
                  The highest clouds on Earth, forming
                  at the mesopause in summer twilight.
            font_family: 'Arial, "Liberation Sans", Helvetica, sans-serif'
            font_size: 30
            font_color: "#14181d"
        stratosphere_text:
            type: "text"
            content: |
                OZONE LAYER
                  At sea-level pressure, all of it
                  would be a layer 3 mm thick.
            font_family: 'Arial, "Liberation Sans", Helvetica, sans-serif'
            font_size: 30
            font_color: "#14181d"
        troposphere_text:
            type: "text"
            content: |
                TROPOPAUSE
                  The troposphere's ceiling: 8 km over
                  the poles, 18 km over the equator.
            font_family: 'Arial, "Liberation Sans", Helvetica, sans-serif'
            font_size: 30
            font_color: "#14181d"

        # ── Narration ────────────────────────────────────────────────────────────
        # One clip per dwell. Each is declared for its DURATION as much as for its
        # sound: the stop it belongs to lasts exactly as long as the line, so
        # re-recording one sentence re-times one stop and nothing else.
        # Generate them with narrate_brief.yaml before rendering.
        narration_title:
            type: "audio"
            file: "./resource/audio/brief/scene_01_01_title.mp3"
        narration_upper:
            type: "audio"
            file: "./resource/audio/brief/scene_01_02_upper.mp3"
        narration_iss:
            type: "audio"
            file: "./resource/audio/brief/scene_01_03_iss.mp3"
        narration_mesosphere:
            type: "audio"
            file: "./resource/audio/brief/scene_01_04_mesosphere.mp3"
        narration_stratosphere:
            type: "audio"
            file: "./resource/audio/brief/scene_01_05_stratosphere.mp3"
        narration_troposphere:
            type: "audio"
            file: "./resource/audio/brief/scene_01_06_troposphere.mp3"
        narration_closing:
            type: "audio"
            file: "./resource/audio/brief/scene_01_07_closing.mp3"
        # The bookends. Both are SHORT on purpose: each fits inside silence the
        # camera already needed — 5.0s of establish and push-in at the front, 4.5s
        # of pull-out at the back — so the voice reaches both ends of the piece
        # without adding a frame to it.
        narration_open:
            type: "audio"
            file: "./resource/audio/brief/scene_01_00_open.mp3"
        narration_close:
            type: "audio"
            file: "./resource/audio/brief/scene_01_08_close.mp3"

        template:
            type: "template"
            file: "./resource/template/main.html"
            style: style
        style:
            type: "style"
            file: "./resource/style/theme_dark.css"

    const:
        FRAME_W: 1920
        FRAME_H: 1080
        # The input image's size. make_frame_svg.py prints it.
        IMAGE_W: 1100
        IMAGE_H: 2700

        # Overview: the full height fits the frame, centred horizontally.
        OVERVIEW_ZOOM: "FRAME_H / IMAGE_H"
        OVERVIEW_PAN_X: "FRAME_W / 2 - OVERVIEW_ZOOM * IMAGE_W / 2"

        # Detail: 1180 image px across the frame — the poster's width plus a margin.
        DETAIL_W: 1180
        DETAIL_ZOOM: "FRAME_W / DETAIL_W"
        DETAIL_PAN_X: "FRAME_W / 2 - DETAIL_ZOOM * IMAGE_W / 2"

        # The vertical centre of each stop, in image px.
        TITLE_Y: 340
        UPPER_Y: 870
        MESOSPHERE_Y: 1290
        STRATOSPHERE_Y: 1730
        TROPOSPHERE_Y: 2260
        TITLE_PAN_Y: "FRAME_H / 2 - DETAIL_ZOOM * TITLE_Y"
        UPPER_PAN_Y: "FRAME_H / 2 - DETAIL_ZOOM * UPPER_Y"
        MESOSPHERE_PAN_Y: "FRAME_H / 2 - DETAIL_ZOOM * MESOSPHERE_Y"
        STRATOSPHERE_PAN_Y: "FRAME_H / 2 - DETAIL_ZOOM * STRATOSPHERE_Y"
        TROPOSPHERE_PAN_Y: "FRAME_H / 2 - DETAIL_ZOOM * TROPOSPHERE_Y"


        # ── The callout boxes, in SCREEN px ──────────────────────────────────────
        # Sized by measuring the render — nothing measures the text for us.
        #
        # ⛔ A LINE TOO LONG FOR THE BOX WRAPS, AND THE OVERFLOW IS DROPPED WITHOUT
        # A WORD. Counting rendered lines does not catch it — a wrapped half still
        # renders as a line. Run resource/helper/check_note_widths.py after any edit.
        #
        # ⚠️ THE TYPE IS SIZED AGAINST THE PICTURE, NOT THE FRAME. The detail stops
        # magnify the poster by DETAIL_ZOOM, so its own 20px captions arrive on
        # screen at 32.5px. A callout set at 20px would read as fine print beside
        # them; 30px is the same apparent size as the thing it annotates.
        # The smallest box that keeps NOTE_PAD clear around the longest line.
        NOTE_W: 570
        NOTE_H: 152
        NOTE_PAD: 22
        NOTE_RADIUS: 14

        ZOOM_MS: 2500
        PAN_MS: 2000
        FADE_MS: 400
        # ⚠️ NO DWELL CONSTANT. A dwell is its LINE's length: every callout's hold
        # is `<that line>.duration - FADE_MS * 2`, the two fades being spent inside
        # the same window. Rewrite a script, regenerate the clip, and the stop
        # re-times itself — nothing here needs touching.
        ESTABLISH_MS: 2500
        END_MS: 2000

animation:
    defaults:
        assets:
            scene: frame

    annotations:
        # Each box is parked where its stop leaves empty frame.
        note_title:
            note:
                text: title_text
                shape:
                    rect:
                        width: NOTE_W
                        height: NOTE_H
                        radius: NOTE_RADIUS
                padding: NOTE_PAD
                align: left
            # Parked in the masthead's empty right half — the title text ends well
            # left of it.
            at:
                x: 1180
                y: 200
            origin: top_left
            fill: "#f7f8fa"
            stroke: "#555c66"
            stroke_width: 2

        note_upper:
            note:
                text: upper_text
                shape:
                    rect:
                        width: NOTE_W
                        height: NOTE_H
                        radius: NOTE_RADIUS
                padding: NOTE_PAD
                align: left
            # The bottom clears the MESOSPHERE heading at screen y 979.
            at:
                x: 800
                y: 780
            origin: top_left
            fill: "#f7f8fa"
            stroke: "#555c66"
            stroke_width: 2

        # Same box position as note_upper: the camera has not moved between them, so
        # the second callout reads as a replacement in place rather than a new frame.
        note_iss:
            note:
                text: iss_text
                shape:
                    rect:
                        width: NOTE_W
                        height: NOTE_H
                        radius: NOTE_RADIUS
                padding: NOTE_PAD
                align: left
            at:
                x: 800
                y: 780
            origin: top_left
            fill: "#f7f8fa"
            stroke: "#555c66"
            stroke_width: 2

        note_mesosphere:
            note:
                text: mesosphere_text
                shape:
                    rect:
                        width: NOTE_W
                        height: NOTE_H
                        radius: NOTE_RADIUS
                padding: NOTE_PAD
                align: left
            # Below the poster's own fact box, which ends at screen y 570.
            at:
                x: 180
                y: 600
            origin: top_left
            fill: "#f7f8fa"
            stroke: "#555c66"
            stroke_width: 2

        note_stratosphere:
            note:
                text: stratosphere_text
                shape:
                    rect:
                        width: NOTE_W
                        height: NOTE_H
                        radius: NOTE_RADIUS
                padding: NOTE_PAD
                align: left
            at:
                x: 390
                y: 660
            origin: top_left
            fill: "#f7f8fa"
            stroke: "#555c66"
            stroke_width: 2

        note_troposphere:
            note:
                text: troposphere_text
                shape:
                    rect:
                        width: NOTE_W
                        height: NOTE_H
                        radius: NOTE_RADIUS
                padding: NOTE_PAD
                align: left

            at:
                x: 200
                y: 560
            origin: top_left
            fill: "#f7f8fa"
            stroke: "#555c66"
            stroke_width: 2

    timeline:
        0 @ establish:
            - atmosphere_infographic:
                  - move:
                        dx: "OVERVIEW_PAN_X"
                        duration: 0
            - atmosphere_infographic:
                  - show:
                        opacity: 1
                        scale:
                            from: "OVERVIEW_ZOOM"
                            to: "OVERVIEW_ZOOM"
                        duration: 0
                        hold:
                            after: "ESTABLISH_MS"
            # Every callout starts hidden; each stop is what brings its own up.
            - note_title:
                  - show:
                        opacity: 0
                        duration: 0
            - note_upper:
                  - show:
                        opacity: 0
                        duration: 0
            - note_iss:
                  - show:
                        opacity: 0
                        duration: 0
            - note_mesosphere:
                  - show:
                        opacity: 0
                        duration: 0
            - note_stratosphere:
                  - show:
                        opacity: 0
                        duration: 0
            - note_troposphere:
                  - show:
                        opacity: 0
                        duration: 0

        # TWO ENTRIES, ONE ACTOR, ONE BOOKMARK. `move` writes position and `show`
        # writes scale — different properties, so they run together, which is what
        # a push-in is. Sub-actions inside a SINGLE entry would run in sequence
        # instead: a dolly, then a zoom.
        establish.end @ push_in:
            - atmosphere_infographic:
                  - move:
                        dx: "DETAIL_PAN_X - OVERVIEW_PAN_X"
                        dy: "TITLE_PAN_Y"
                        duration: "ZOOM_MS"
                        easing: ease_in_out_quad
            - atmosphere_infographic:
                  - show:
                        scale:
                            from: "OVERVIEW_ZOOM"
                            to: "DETAIL_ZOOM"
                        duration: "ZOOM_MS"
                        easing: ease_in_out_quad

        # A dwell bookmark holds no camera action at all: the picture is still, and
        # the callout's own fade in, hold and fade out are what fill the window.
        push_in.end @ title:
            - note_title:
                  - show:
                        opacity:
                            from: 0
                            to: 1
                        duration: "FADE_MS"
                        hold:
                            after: "narration_title.duration - FADE_MS * 2"
                  - show:
                        opacity:
                            from: 1
                            to: 0
                        duration: "FADE_MS"

        title.end @ pan_upper:
            - atmosphere_infographic:
                  - move:
                        dy: "UPPER_PAN_Y - TITLE_PAN_Y"
                        duration: "PAN_MS"
                        easing: ease_in_out_quad

        pan_upper.end @ upper:
            - note_upper:
                  - show:
                        opacity:
                            from: 0
                            to: 1
                        duration: "FADE_MS"
                        hold:
                            after: "narration_upper.duration - FADE_MS * 2"
                  - show:
                        opacity:
                            from: 1
                            to: 0
                        duration: "FADE_MS"

        # A second dwell at the SAME camera position: the stop earns two facts.
        upper.end @ upper_iss:
            - note_iss:
                  - show:
                        opacity:
                            from: 0
                            to: 1
                        duration: "FADE_MS"
                        hold:
                            after: "narration_iss.duration - FADE_MS * 2"
                  - show:
                        opacity:
                            from: 1
                            to: 0
                        duration: "FADE_MS"

        upper_iss.end @ pan_mesosphere:
            - atmosphere_infographic:
                  - move:
                        dy: "MESOSPHERE_PAN_Y - UPPER_PAN_Y"
                        duration: "PAN_MS"
                        easing: ease_in_out_quad

        pan_mesosphere.end @ mesosphere:
            - note_mesosphere:
                  - show:
                        opacity:
                            from: 0
                            to: 1
                        duration: "FADE_MS"
                        hold:
                            after: "narration_mesosphere.duration - FADE_MS * 2"
                  - show:
                        opacity:
                            from: 1
                            to: 0
                        duration: "FADE_MS"

        mesosphere.end @ pan_stratosphere:
            - atmosphere_infographic:
                  - move:
                        dy: "STRATOSPHERE_PAN_Y - MESOSPHERE_PAN_Y"
                        duration: "PAN_MS"
                        easing: ease_in_out_quad

        pan_stratosphere.end @ stratosphere:
            - note_stratosphere:
                  - show:
                        opacity:
                            from: 0
                            to: 1
                        duration: "FADE_MS"
                        hold:
                            after: "narration_stratosphere.duration - FADE_MS * 2"
                  - show:
                        opacity:
                            from: 1
                            to: 0
                        duration: "FADE_MS"

        stratosphere.end @ pan_troposphere:
            - atmosphere_infographic:
                  - move:
                        dy: "TROPOSPHERE_PAN_Y - STRATOSPHERE_PAN_Y"
                        duration: "PAN_MS"
                        easing: ease_in_out_quad

        pan_troposphere.end @ troposphere:
            - note_troposphere:
                  - show:
                        opacity:
                            from: 0
                            to: 1
                        duration: "FADE_MS"
                        hold:
                            after: "narration_troposphere.duration - FADE_MS * 2"
                  - show:
                        opacity:
                            from: 1
                            to: 0
                        duration: "FADE_MS"

        # The closing line plays over a STILL frame at the troposphere framing: the
        # recap finishes before the camera moves, and the pull-out is silent. No
        # callout here — the voice is the whole beat, so the entry is a no-op show
        # whose only job is to hold the picture for the line's length.
        troposphere.end @ closing:
            - atmosphere_infographic:
                  - show:
                        opacity: 1
                        duration: 0
                        hold:
                            after: "narration_closing.duration"

        closing.end @ pull_out:
            - atmosphere_infographic:
                  - move:
                        dx: "OVERVIEW_PAN_X - DETAIL_PAN_X"
                        dy: "-TROPOSPHERE_PAN_Y"
                        duration: "ZOOM_MS"
                        easing: ease_in_out_quad
                        hold:
                            after: "END_MS"
            - atmosphere_infographic:
                  - show:
                        scale:
                            from: "DETAIL_ZOOM"
                            to: "OVERVIEW_ZOOM"
                        duration: "ZOOM_MS"
                        easing: ease_in_out_quad
                        hold:
                            after: "END_MS"

    capture:
        infographic_atmosphere_brief_silent:
            output: "./resource/video/infographic_atmosphere_brief_silent.mp4"
            fps: 30

# The picture and its callouts are captured silent above; the voice is laid over
# that capture here, one mix per dwell, each anchored to the bookmark its dwell
# opens. The animation already lasts exactly as long as the narration, because
# every dwell took its length from the line about to be mixed onto it.
composition:
    context:
        status: active

    timeline:
        # ⚠️ EVERY MIX CARRIES AN EXPLICIT `span.from`. A mix at a non-zero
        # timestamp without one is placed at output 0 by a known defect — which
        # here would stack all seven lines on the first frame.
        "0":
            - infographic_atmosphere_brief_silent:
                  - roll:
                  - mix:
                        span:
                            from: "animation::establish.start"
                        asset: narration_open
                  - mix:
                        span:
                            from: "animation::title.start"
                        asset: narration_title
                  - mix:
                        span:
                            from: "animation::upper.start"
                        asset: narration_upper
                  - mix:
                        span:
                            from: "animation::upper_iss.start"
                        asset: narration_iss
                  - mix:
                        span:
                            from: "animation::mesosphere.start"
                        asset: narration_mesosphere
                  - mix:
                        span:
                            from: "animation::stratosphere.start"
                        asset: narration_stratosphere
                  - mix:
                        span:
                            from: "animation::troposphere.start"
                        asset: narration_troposphere
                  - mix:
                        span:
                            from: "animation::closing.start"
                        asset: narration_closing
                  - mix:
                        span:
                            from: "animation::pull_out.start"
                        asset: narration_close

    capture:
        out:
            output: "./infographic_atmosphere_brief.mp4"
            fps: 30
