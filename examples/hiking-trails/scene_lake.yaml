# ------------------------------------------
# hiking-trails — Serenity Lake route
# ------------------------------------------
# The walk out to the lake jetty, taken from an owner-authored trace painted over the
# baked map and turned into overlay geometry by `resources/diagram/make_route_svg.py`.
# A companion to `scene_summit.yaml`, built to the same pattern: the route fades in
# under a travelling marker that rides the drawn line, the destination is a star seated
# in a pulsing ring, and a callout names what was reached.
#
# Where this one DIFFERS is instructive. The summit trace alternates visible and hidden
# nine times, so that scene is mostly handoffs — solid arrowhead to ghost and back at
# every boundary. The lake was traced entirely in the VISIBLE brush: the walk never
# ducks behind anything, so the generator emits a single stretch, there is one leg, and
# the ghost marker does not appear in this scene at all (nor in `markers_lake.svg`).
# That is the trace speaking, not a limit — paint the hidden brush where the trail
# passes behind the pines and this file grows the same alternation the summit has.
#
# Geometry lives in `route_layer_lake.svg` alone; re-running the generator after a new
# trace is the whole update. The leg duration below is that generator's table.

defs:
    assets:
        map:
            type: "scene"
            file: "./resources/diagram/map.svg"
        route_layer_lake:
            type: "scene"
            file: "./resources/diagram/route_layer_lake.svg"
        # Declared LAST of the three scenes on purpose: scene declaration order is
        # the render z-order (painter's algorithm), so the markers paint over the
        # route rather than under it. Hand-authored, unlike route_layer_lake.svg,
        # which the trace generator rewrites.
        markers_lake:
            type: "scene"
            file: "./resources/diagram/markers_lake.svg"

        # The one stretch: a group (faded in as the marker enters it) wrapping the
        # line the marker rides.
        seg_1:
            type: "actor"
            part_of: route_layer_lake
            id: lake-seg-01
        seg_1_line:
            type: "actor"
            part_of: route_layer_lake
            id: lake-line-01

        # Destination is two actors, not one: the ring pulses its stroke while the
        # star simply appears inside it, so they need independent timelines.
        dest_ring:
            type: "actor"
            part_of: markers_lake
            id: dest-ring
            origin: center
        dest_star:
            type: "actor"
            part_of: markers_lake
            id: dest-star
            origin: center
        # The traveller lives in the marker layer but rides a curve that lives in
        # route_layer_lake — move-along resolves an asset segment across scenes
        # within a frame, so the rider and its rail need not share a scene.
        #
        # There is no ghost twin here: with no hidden stretch there is nothing for it
        # to ride, and an actor asset naming an id the layer does not carry would not
        # resolve.
        traveller_solid:
            type: "actor"
            part_of: markers_lake
            id: traveller-solid
            origin: center

        # The callout's content and typography. A note carries no text of its own —
        # it names a reused `type: text` asset. There is no auto-wrap and no text
        # measurement anywhere in the pipeline, so the line breaks below are the real
        # ones and the box that holds them is sized by hand (see `lake_note`).
        #
        # Distance and walking time are DERIVED from the trace by
        # `resources/diagram/make_route_svg.py`, which prints this block; ascent and
        # grade are authored (a top-down map carries no elevation). Re-trace the route
        # and paste the figures it prints, or the callout drifts from the line drawn.
        lake_caption:
            type: "text"
            content: |
                Serenity Lake
                1.8 km · 120 m ascent
                ≈ 30 min · easy
            font_family: "Inter, system-ui, -apple-system, sans-serif"
            font_size: 16
            # The darkest of the route's three tones — same hue as the line and the
            # markers, held down to read as text on the cream box.
            font_color: "#152f4a"

        # ── Feature legend ────────────────────────────────────────────────────────
        # This route's line is the one thing in the piece with no visible evidence: you
        # cannot see, by watching, that the walking time was computed rather than typed.
        # The lake earns the label because it demonstrates nothing else new — same
        # shapes, same file as the summit, only a different trace.
        chip_capability_text:
            type: "text"
            content: |
                Capabilities
                  animation timings
                  computed, not typed
            font_family: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font_size: 15
            font_color: "#582f0e"

        # Declared for its DURATION, not to be played here. The clip takes its length
        # from this file so the visuals stretch to the voice; the narration itself is
        # mixed once, in `scene_stitch.yaml`, where all three lines and the music bed
        # meet. Generate it with `scene_00_tts_generation.yaml` before rendering — the
        # inspector probes this at compile time and cannot guess.
        narration:
            type: "audio"
            file: "./audio/route_02_lake.mp3"

        template:
            type: "template"
            file: "./resources/template/main.html"
            style: style
        style:
            type: "style"
            file: "./resources/css/theme_dark.css"

    const:
        # ── Pace ──────────────────────────────────────────────────────────────────
        # ONE walking speed, shared verbatim by all three route scenes. It is the
        # reason the marker looks like the same walker in each: pace is fixed here and
        # every leg's duration is DERIVED from it, rather than each scene carrying a
        # duration table that happens to agree. Change this and all three retime.
        #
        # 162 px/s is the fastest constraint of the three routes — the rest stop's
        # narration is nearly all walking, so any slower and its callout has no time
        # left on screen. See that scene for the binding case.
        PACE_PX_PER_S: 168
        # Arc length of the route, printed by `resources/diagram/make_route_svg.py`.
        # The one figure a re-trace still requires pasting across: there is no
        # `.length` on a path to divide by, so the geometry cannot supply it.
        ROUTE_PX: 654.9

        # ── Derived timings ───────────────────────────────────────────────────────
        # Walking time falls out of distance over speed. No authored duration.
        LEG_1_MS: "ROUTE_PX / PACE_PX_PER_S * 1000"

        FADE_WINDOW: 140
        VIDEO_MARGIN: 350
        PULSE_CYCLES: 2
        # Star settle — shorter than one pulse cycle so it is planted before the
        # ring's first beat, rather than growing through it.
        STAR_ARRIVE_MS: 600
        STAR_SPIN_MS: 400
        # The ring's beat. It is the ARRIVAL entry's true length, because an entry runs
        # as long as its longest actor and this outlasts the star's settle-then-spin
        # (600 + 400). Raise the star's pair past this and THIS term stops being the
        # right one — the two are not independent.
        PULSE_MS: 1100
        NOTE_REVEAL_MS: 900

        # Everything in the clip that is NOT the callout's dwell.
        #
        # `FADE_WINDOW` is in here because the traveller's fade-in and its walk are two
        # actions in ONE timeline entry, and actions within an entry SEQUENCE — the
        # marker finishes appearing before it starts moving, so the fade is real clip
        # time, not something hidden under the leg. Concurrency would need separate
        # entries or sub-actions.
        FIXED_MS: "VIDEO_MARGIN * 2 + FADE_WINDOW + PULSE_MS + NOTE_REVEAL_MS"
        # The dwell is the ELASTIC term, and this is the whole timing model: the walk
        # is rigid (distance over a shared pace) and whatever the narration has left
        # over lands here, on the beat where someone is actually reading. Re-record the
        # line and the clip re-fits itself — the figure is probed, never pasted.
        NOTE_HOLD_MS: "narration.duration - LEG_1_MS - FIXED_MS"

        # The OVERALL box, padding included: `width`/`height` are the drawn box and
        # `padding` is inset within them.
        # ── Feature legend ────────────────────────────────────────────────────────
        # Bottom-left, the corner no callout occupies in any of the three routes. Box
        # dimensions match the other two exactly so the panel holds one silhouette
        # across the cuts.
        CHIP_X: 44
        CHIP_Y: 948
        CHIP_WIDTH: 235
        CHIP_HEIGHT: 80
        CHIP_PADDING: 13
        # Drawn on during the walk, so it must stay under the leg carrying it — an entry
        # lasts as long as its longest actor. This route walks in one leg of about 3.9 s.
        CHIP_REVEAL_MS: 420

        NOTE_BOX_WIDTH: 190
        NOTE_BOX_HEIGHT: 85
        NOTE_BOX_PADDING: 15

animation:
    defaults:
        assets:
            scene: map

    # A note with a pointer is a CALLOUT: an author-sized box plus a forked leader
    # aimed at a target. Both are one closed outline, which is why `reveal` can draw
    # the whole thing on as a single stroke.
    #
    # The pointer aims at `dest_ring`, not at `dest_star`: the apex lands ON the
    # target point, so aiming at the star would bury the leader tip under the star and
    # the ring.
    #
    # Parked to the RIGHT of the ring, over the open water — the mirror of the summit
    # callout, which hangs to the left of its peak. The lake surface is this map's
    # equivalent of the summit's empty sky: the one large area with no detail worth
    # occluding. `pos: right` puts the leader's apex on the ring's right edge, the
    # side facing the box, so it reads as touching the marker.
    #
    # The target resolves against the ring's INITIAL position at compile time, which
    # is exactly right here: the ring never moves, it only pulses in place.
    annotations:
        lake_note:
            note:
                text: lake_caption
                # Sized by measuring the render, because nothing measures it for us.
                # These are the OVERALL box; the padding is taken from INSIDE them, so
                # growing the padding shrinks the text area rather than the note.
                # Re-check after any change to the wording, the font or `font_size` —
                # overflow is silent.
                shape:
                    rect:
                        width: NOTE_BOX_WIDTH
                        height: NOTE_BOX_HEIGHT
                padding: NOTE_BOX_PADDING
                align: left
                pointer:
                    target:
                        anchor:
                            asset: dest_ring
                            pos: right
                            dx: 10
            at:
                anchor:
                    asset: dest_ring
                    pos: right
                    # Clear of the ring's right edge by 30, then hung so the box
                    # straddles the ring's line rather than sitting above it.
                    dx: 30
                    dy: -30
            origin: top_left
            fill: "#fbf3ea"
            # The route's own line tone — the callout is drawn in the same hue the
            # walk was drawn in, so the box reads as belonging to this route.
            stroke: "#26588a"
            stroke_width: 2

        # A note with NO pointer is just an author-sized box, so the legend is itself
        # an instance of the feature the rest stop names.
        chip_capability:
            note:
                text: chip_capability_text
                shape:
                    rect:
                        width: CHIP_WIDTH
                        height: CHIP_HEIGHT
                padding: CHIP_PADDING
                align: left
            at:
                x: CHIP_X
                y: CHIP_Y
            origin: top_left
            # Its own palette, deliberately NOT this route's tone — the legend is
            # commentary ABOUT the video and stays identical across all three.
            fill: "#f5ebe0"
            stroke: "#8a5a44"
            stroke_width: 1.5

    timeline:
        0 @ setup_ts:
            - map:
                  - show:
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"
            - seg_1:
                  - show:
                        opacity: 0
            - dest_ring:
                  - show:
                        opacity: 0
            - dest_star:
                  - show:
                        opacity: 0
            - traveller_solid:
                  - show:
                        opacity: 0
            - lake_note:
                  - show:
                        opacity: 0
            - chip_capability:
                  - show:
                        opacity: 0

        # --- Leg 1 (VISIBLE): the whole walk, trailhead to jetty ---
        # It opens with a fade, because the marker has to arrive on stage once. The
        # summit route needs that only on its first leg and hands off instantly
        # thereafter; here there is nothing to hand off to.
        setup_ts.end @ leg1_ts:
            - seg_1:
                  - show:
                        duration: FADE_WINDOW
                        opacity: 1
            - traveller_solid:
                  - show:
                        duration: FADE_WINDOW
                        opacity: 1
                  - move:
                        duration: LEG_1_MS
                        easing: linear
                        orient: auto
                        along: route_layer_lake::seg_1_line
            - chip_capability:
                  - show:
                        duration: CHIP_REVEAL_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad

        # --- Lake reached: the star lands, the ring pulses around it ---
        # The traveller hands off to the destination: the arrow that walked the
        # route disappears exactly as the star that marks the end of it arrives.
        leg1_ts.end @ arrive_ts:
            - traveller_solid:
                  - show:
                        opacity: 0
            - dest_ring:
                  - show:
                        opacity: 1
                  - pulse:
                        duration: PULSE_MS
                        cycles: PULSE_CYCLES
                        stroke: 'css("kg-arrive-stroke")'
                        stroke_width: 'css("kg-pulse-stroke-width")'
            - dest_star:
                  - show:
                        duration: STAR_ARRIVE_MS
                        opacity: 1
                        scale:
                            from: 0.4
                            to: 1
                        easing: ease_out_back
                  - show:
                        duration: STAR_SPIN_MS
                        rotation:
                            turns: 2
                        easing: linear

        # --- The callout draws itself on, naming what was reached ---
        # After the star, not with it: the arrival is one beat (marker → star → ring),
        # and the explanation is the next. `reveal` strokes the box and its leader on
        # as one continuous outline, which is the note's signature choreography.
        arrive_ts.end @ note_ts:
            - chip_capability:
                  - show:
                        opacity: 0
            - lake_note:
                  - show:
                        duration: NOTE_REVEAL_MS
                        opacity: 1
                        reveal:
                            from: 0
                            to: 1
                        easing: ease_out_quad
                        hold:
                            after: "NOTE_HOLD_MS"

        note_ts.end @ tear_down_ts:
            - map:
                  - show:
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"

    capture:
        video_lake:
            output: "./video/scene_lake_animation.mp4"
            fps: 30
