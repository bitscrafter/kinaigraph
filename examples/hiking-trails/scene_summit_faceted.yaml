# ------------------------------------------
# hiking-trails — Summit route, WAYPOINT form (a test bed for `along.smoothing`)
# ------------------------------------------
# GENERATED by `resources/diagram/make_route_svg.py --scene` — do not hand-edit; the
# waypoints below are the same trace `route_layer_faceted.svg` draws.
#
# A companion to `scene_summit.yaml`, which rides the overlay's `<path>`s by name.
# This one carries the route as an explicit `along.points` POLYLINE instead, because
# `smoothing` applies only when every segment is a point — one asset segment anywhere in
# an `along` and the field is rejected. So the smoothing field can only be exercised from
# a waypoint route like this one.
#
# The polyline is deliberately UNSMOOTHED and coarsely sampled (24 px between
# waypoints, no spline), so it visibly facets. That is the point: it gives the smoother
# something to work on. Dial `SMOOTH_STRENGTH` from 0 (off — the raw polyline) to 1.
#
# The route highlight in `route_layer_faceted.svg` is the same coarse polyline, so the drawn line facets
# exactly like the unsmoothed motion — at `SMOOTH_STRENGTH: 0` the marker tracks the drawn
# corner for corner, and as the strength rises you are watching the smoother pull the
# motion off the drawn line. That divergence IS the readout.

defs:
    assets:
        map:
            type: "scene"
            file: "./resources/diagram/map.svg"
        route_layer:
            type: "scene"
            file: "./resources/diagram/route_layer_faceted.svg"
        # Declared last of the three scenes: declaration order is the render z-order,
        # so the markers paint over the route. Hand-authored and shared with
        # scene_summit.yaml — the generated overlay carries route geometry only.
        markers:
            type: "scene"
            file: "./resources/diagram/markers.svg"

        seg_1:
            type: "actor"
            part_of: route_layer
            id: route-seg-01

        seg_2:
            type: "actor"
            part_of: route_layer
            id: route-seg-02

        seg_3:
            type: "actor"
            part_of: route_layer
            id: route-seg-03

        seg_4:
            type: "actor"
            part_of: route_layer
            id: route-seg-04

        seg_5:
            type: "actor"
            part_of: route_layer
            id: route-seg-05

        seg_6:
            type: "actor"
            part_of: route_layer
            id: route-seg-06

        seg_7:
            type: "actor"
            part_of: route_layer
            id: route-seg-07

        seg_8:
            type: "actor"
            part_of: route_layer
            id: route-seg-08

        seg_9:
            type: "actor"
            part_of: route_layer
            id: route-seg-09

        dest_ring:
            type: "actor"
            part_of: markers
            id: dest-ring
            origin: center
        dest_star:
            type: "actor"
            part_of: markers
            id: dest-star
            origin: center
        traveller_solid:
            type: "actor"
            part_of: markers
            id: traveller-solid
            origin: center
        traveller_ghost:
            type: "actor"
            part_of: markers
            id: traveller-ghost
            origin: center

        template:
            type: "template"
            file: "./resources/template/main.html"
            style: style
        style:
            type: "style"
            file: "./resources/css/theme_dark.css"

    const:
        # The knob under test: 0 = off (the bare polyline), 1 = the method's maximum.
        SMOOTH_STRENGTH: 0.5
        FADE_WINDOW: 217
        VIDEO_MARGIN: 600
        GHOST_OPACITY: 0.55
        PULSE_CYCLES: 2
        # Star settle — shorter than one pulse cycle, so it is planted before the
        # ring's first beat rather than growing through it.
        STAR_ARRIVE_MS: 420
        LEG_1_MS: 222  #   23.9 px  visible
        LEG_2_MS: 441  #   47.5 px  hidden
        LEG_3_MS: 443  #   47.7 px  visible
        LEG_4_MS: 217  #   23.4 px  hidden
        LEG_5_MS: 642  #   69.2 px  visible
        LEG_6_MS: 664  #   71.5 px  hidden
        LEG_7_MS: 4510  #  485.7 px  visible
        LEG_8_MS: 4311  #  464.2 px  hidden
        LEG_9_MS: 2550  #  274.6 px  visible

animation:
    defaults:
        assets:
            scene: map

    timeline:
        0 @ setup_ts:
            - map:
                  - show:
                        opacity: 1
                        hold:
                            after: "VIDEO_MARGIN"
            - seg_1:
                  - show:
                        opacity: 0
            - seg_2:
                  - show:
                        opacity: 0
            - seg_3:
                  - show:
                        opacity: 0
            - seg_4:
                  - show:
                        opacity: 0
            - seg_5:
                  - show:
                        opacity: 0
            - seg_6:
                  - show:
                        opacity: 0
            - seg_7:
                  - show:
                        opacity: 0
            - seg_8:
                  - show:
                        opacity: 0
            - seg_9:
                  - show:
                        opacity: 0
            - dest_ring:
