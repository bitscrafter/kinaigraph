                        opacity: 0
            - dest_star:
                  - show:
                        opacity: 0
            - traveller_solid:
                  - show:
                        opacity: 0
            - traveller_ghost:
                  - show:
                        opacity: 0

        # --- Leg 1 (VISIBLE) — 24 px, 2 waypoints ---
        setup_ts.end @ leg1_ts:
            - seg_1:
                  - show:
                        duration: FADE_WINDOW
                        opacity: 1
            - traveller_solid:
                  - show:
                        duration: FADE_WINDOW
                        opacity: 1
                  - move:
                        duration: LEG_1_MS
                        easing: linear
                        orient: auto
                        along:
                            points:
                                - x: 792.4
                                  y: 654.3
                                - x: 814.5
                                  y: 645.4
                            smoothing:
                                method: "catmull_rom"
                                strength: SMOOTH_STRENGTH

        # --- Leg 2 (HIDDEN) — 48 px, 3 waypoints ---
