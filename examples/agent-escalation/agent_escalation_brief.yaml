# Seven agentic-system topologies, built one edge at a time.
#
# The subject is Anthropic's "Building Effective AI Agents" (Erik S. and Barry
# Zhang, 19 December 2024): one building block, five workflow patterns, one
# agent pattern. The diagrams are redrawn here; the structure and the vocabulary
# are the post's.
#
# ⚡ THE PIECE IS A BUILD, NOT A TOUR. The seven patterns are not seven topics —
# they are the same few parts rewired, and they sit in an order. So each beat
# adds exactly the one edge class the beat before it lacked: the sequential
# edge, then the exclusive branch, then the join, then a lane count nobody
# wrote down, then an arrow pointing backwards, then the loop closing on the
# world. A tour would have shown seven pictures; this shows one picture seven
# times.
#
# ⚡ THE ENTRY NODE NEVER MOVES AND NEVER CHANGES COLOUR. It is the head of
# every topology in turn, and it is the only shape that does not take the
# escalation ramp — a constant that re-tinted itself each beat would be claiming
# to be seven things. Only its LABEL swaps, which is why there are seven label
# actors stacked at one baseline: an actor's text is not an animatable property,
# so the only way to rename a node is to have authored every name it will wear.
#
# ⚠️ THE TOPOLOGIES COLLIDE ON THE CANVAS AND MUST NOT COLLIDE IN TIME. Beat
# `chain` puts a node at x=1240 and beat `route` puts one at x=1330; they
# overlap in the artwork and only this document keeps them apart. Every beat is
# therefore preceded by its own `clear_*` entry which takes the previous group
# to zero BEFORE the next one starts. There is no crossfade anywhere in the
# piece, and the 260 ms those clears cost is the price of that.
#
# ⚠️ SOLID EDGES ARE REVEALED, DASHED EDGES ARE FADED, AND THE TWO ARE DIFFERENT
# GROUPS. `reveal` drives `stroke-dasharray`, so revealing an already-dashed
# stroke renders NOTHING, silently. That is a constraint, but here it carries
# meaning: an edge whose existence is fixed when the diagram is drawn DRAWS
# ITSELF, and an edge the running system decides on ARRIVES. The orchestrator's
# fan-out and the agent's human checkpoint are the two that arrive.
#
# ⚠️ EVERY ARROWHEAD IS ITS OWN ACTOR. A marker is untouched by the dash
# machinery, so a marker-headed arrow would show its point before its shaft. The
# heads are polygons in the `*_heads` groups and land when their shafts do.
#
# ⚡ EVERY BEAT DEPOSITS ITS MINIATURE ON THE LEDGER as it ends. That is the
# reason this is a video and not a poster: a still diagram cannot accumulate,
# and the closing frame is an argument only because the viewer watched each of
# the seven being earned.

