            type: "group"
            member_type: "actor"
            members: [h_pa_1, h_pa_2, h_pa_3, n_par_1, n_par_2, n_par_3, lbl_variants]
        parallel_joins:
            type: "group"
            member_type: "actor"
            members: [e_pj_1, e_pj_2, e_pj_3]
        parallel_join_body:
            type: "group"
            member_type: "actor"
            members: [h_pj_1, h_pj_2, h_pj_3, n_aggregator]

        # The three lanes the author drew...
        orchestrate_fan_a:
            type: "group"
            member_type: "actor"
            members: [e_or_1, h_or_1, n_orc_1, e_or_2, h_or_2, n_orc_2, e_or_3, h_or_3,
                n_orc_3]
        # ...and the one nobody did. ⚡ THIS IS THE BEAT THE STILL DIAGRAM CANNOT
        # HAVE. A fourth worker arriving mid-sentence is what "breaks the task
        # down dynamically" looks like; on paper it is just a fourth box.
        orchestrate_fan_b:
            type: "group"
            member_type: "actor"
            members: [e_or_4, h_or_4, n_orc_4, lbl_runtime]
        orchestrate_joins:
            type: "group"
            member_type: "actor"
            members: [e_oj_1, e_oj_2, e_oj_3, e_oj_4]
        # ⚠️ The synthesiser lands AFTER the fourth lane, and that is not a
        # flourish: it sits at the centre of however many lanes exist, so there
        # is no place to put it until the count is known.
        orchestrate_join_body:
            type: "group"
            member_type: "actor"
            members: [h_oj_1, h_oj_2, h_oj_3, h_oj_4, n_synth]

        evaluate_loop_shafts:
            type: "group"
            member_type: "actor"
            members: [e_ev_fwd, e_ev_back]
        evaluate_loop_body:
            type: "group"
            member_type: "actor"
            members: [h_ev_fwd, h_ev_back, l_ev_fwd, l_ev_back, n_evaluator]
        evaluate_pair:
            type: "group"
            member_type: "actor"
            members: [n_entry, n_evaluator]
        evaluate_out_body:
            type: "group"
            member_type: "actor"
            members: [h_ev_out, l_ev_out, n_accepted]

        agent_loop_shafts:
            type: "group"
            member_type: "actor"
            members: [e_ag_act, e_ag_obs]
        agent_loop_body:
            type: "group"
            member_type: "actor"
            members: [h_ag_act, h_ag_obs, l_ag_act, l_ag_obs, n_environment]
        agent_human:
            type: "group"
            member_type: "actor"
            members: [e_ag_human, h_ag_human, l_ag_human, n_human]
        agent_stop_body:
            type: "group"
            member_type: "actor"
            members: [h_ag_stop, l_ag_stop, n_stop]

        close_body:
            type: "group"
            member_type: "actor"
            members: [quote_1, quote_2, quote_3, quote_who]

        # ── narration ────────────────────────────────────────────────────────
        # One clip per beat. Each is declared for its DURATION as much as for
        # its sound: a beat lasts exactly as long as its own line, so
        # re-recording one sentence re-times one beat and nothing else.
        # Generate them with narrate_brief.yaml before rendering.
        narration_01:
            type: "audio"
            file: "./resource/audio/part_01_source.mp3"
        narration_02:
            type: "audio"
            file: "./resource/audio/part_02_atom.mp3"
        narration_03:
            type: "audio"
            file: "./resource/audio/part_03_chain.mp3"
        narration_04:
            type: "audio"
            file: "./resource/audio/part_04_route.mp3"
        narration_05:
            type: "audio"
            file: "./resource/audio/part_05_parallel.mp3"
        narration_06:
            type: "audio"
            file: "./resource/audio/part_06_orchestrate.mp3"
        narration_07:
            type: "audio"
            file: "./resource/audio/part_07_evaluate.mp3"
        narration_08:
            type: "audio"
            file: "./resource/audio/part_08_agent.mp3"
        narration_09:
            type: "audio"
            file: "./resource/audio/part_09_choice.mp3"

        template:
            type: "template"
            file: "./resource/template/main.html"
        style:
            type: "style"
            file: "./resource/style/theme_flow.css"
            themes:
                - dark
                - paper

    defaults:
        assets:
            template:
                asset: template
                style:
                    asset: style
                    theme: dark

    const:
        # Quiet before the first word and after the last, so the piece does not
        # start or stop on a syllable.
        VIDEO_MARGIN: 400

        # ⚡ TWO CLOCKS, AND EVERY BEAT USES BOTH. The mechanical half — a shaft
        # drawing, a node landing — runs on plain milliseconds and is over in
        # about a second. The narrated half is the beat itself, and it lasts
        # exactly as long as the line spoken over it. So the build happens
        # INSIDE the line rather than before it, and the only fixed overhead in
        # the piece is the clear between topologies.
        CLEAR_MS: 260 # a topology leaving, so the next one never overlaps it
        DRAW_MS: 620 # a solid shaft drawing itself
        FADE_MS: 240 # anything that cannot be drawn, arriving
        DIM_MS: 400 # a lane that did not run, going quiet
        DEPOSIT_MS: 420 # a rail tick and its miniature being earned

        # How far a dimmed thing goes. Not zero: the unchosen lanes in `route`
        # still exist, and a router that erased them would be a gate.
        DIM_TO: 0.22

        # ⚠️ THE DEPOSIT IS PLACED FROM THE END OF ITS OWN LINE, not from the
        # start. A beat's length is its clip's probed duration, so the only way
        # to land the miniature just before the voice stops is to subtract.
        # A clip shorter than this would place the deposit before the beat
        # begins; the shortest line in the piece runs several seconds.
        DEPOSIT_AT_01: "narration_02.duration - DEPOSIT_MS"
        DEPOSIT_AT_02: "narration_03.duration - DEPOSIT_MS"
        DEPOSIT_AT_03: "narration_04.duration - DEPOSIT_MS"
        DEPOSIT_AT_04: "narration_05.duration - DEPOSIT_MS"
        DEPOSIT_AT_05: "narration_06.duration - DEPOSIT_MS"
        DEPOSIT_AT_06: "narration_07.duration - DEPOSIT_MS"
        DEPOSIT_AT_07: "narration_08.duration - DEPOSIT_MS"

        # The orchestrator's fourth lane arrives midway through its own
        # sentence, on the word that says nobody wrote the count down.
        RUNTIME_AT: "narration_06.duration * 0.42"

        # The entry node appears partway through the opening line, so the first
        # thing on the stage is the attribution and not a diagram.
        SOURCE_REVEAL_AT: "narration_01.duration * 0.55"
        SOURCE_TAIL: "narration_01.duration - SOURCE_REVEAL_AT - FADE_MS"

animation:
    context:
        layout: stage
        scenes:
            - asset: diagram
              cell:
                  - 0
                  - 0
            - asset: brand
              cell:
                  - 0
                  - 0

    timeline:
        # ── setup: the masthead, the empty ledger, and nothing else ──────────
        # ⚡ ACTIONS INSIDE ONE ENTRY RUN IN SEQUENCE, which is why no beat below
        # does `hold` arithmetic to get its own parts in order. A beat is written
        # as the list of things that happen, and each states only its own length.
        0 @ setup:
            - masthead:
                  - show:
                        opacity: 1
            - ledger:
                  - show:
                        opacity: 1
            - brand_mark:
                  - show:
                        opacity: 1
            - g_atom:
                  - show:
                        opacity: 1
            - g_chain:
                  - show:
                        opacity: 1
            - g_route:
                  - show:
                        opacity: 1
            - g_parallel:
                  - show:
                        opacity: 1
            - g_orchestrate:
                  - show:
                        opacity: 1
            - g_evaluate:
                  - show:
                        opacity: 1
            - g_agent:
                  - show:
                        opacity: 1
            - g_entry:
                  - show:
                        opacity: 1
            - not_yet:
                  - show:
                        opacity: 0
            - undrawn:
                  - show:
                        opacity: 1
                        reveal: 0
                        hold:
                            after: VIDEO_MARGIN

        # ── 0. where this comes from ─────────────────────────────────────────
        # The attribution gets a beat of its own and a line of its own. It is
        # not a credit crawl at the end of somebody else's argument.
        setup.end @ source:
            - n_entry:
                  - show:
                        hold:
                            before: "SOURCE_REVEAL_AT"
                        duration: "FADE_MS"
                        opacity: 1
            # ⚠️ TWO ACTIONS, NOT ONE `hold` CARRYING BOTH `before` AND
            # `after`. Nothing else in this repository holds on both sides of a
            # single action, so whether the two keys compose is unproven here —
            # and as one mapping it is not even YAML, since `hold` would appear
            # twice under one `show`. Actions inside one entry run in sequence,
            # so a second `show` at the same opacity is the padding idiom the
            # other examples already use, and it is what makes `source.end`
            # land on the end of the line rather than on the fade.
            - lbl_entry_atom:
                  - show:
                        hold:
                            before: "SOURCE_REVEAL_AT"
                        duration: "FADE_MS"
                        opacity: 1
                  - show:
                        opacity: 1
                        hold:
                            after: "SOURCE_TAIL"

        # ── 1. the augmented LLM ─────────────────────────────────────────────
        # Nothing to clear: this is the first topology on the canvas.
        source.end @ atom:
            - atom_shafts:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - atom_body:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - rail_atom:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_01"
                        duration: "DEPOSIT_MS"
                        opacity: 1
            - mini_atom:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_01"
                        duration: "DEPOSIT_MS"
                        opacity: 1

        # ── 2. prompt chaining ───────────────────────────────────────────────
        atom.end @ clear_chain:
            - g_atom:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_atom:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_chain:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 1

        clear_chain.end @ chain:
            - chain_shafts:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - chain_body:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - e_ch_fail:
                  - show:
                        hold:
                            before: "DRAW_MS + FADE_MS"
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - chain_exit:
                  - show:
                        hold:
                            before: "DRAW_MS + FADE_MS + DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - rail_chain:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_02"
                        duration: "DEPOSIT_MS"
                        opacity: 1
            - mini_chain:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_02"
                        duration: "DEPOSIT_MS"
                        opacity: 1

        # ── 3. routing ───────────────────────────────────────────────────────
        chain.end @ clear_route:
            - g_chain:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_chain:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_route:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 1

        clear_route.end @ route:
            - route_shafts:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - route_body:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            # All three are drawn, and then two of them stop being the answer.
            # Drawing only the chosen lane would have shown a chain.
            - route_unchosen:
                  - show:
                        hold:
                            before: "DRAW_MS + FADE_MS + 300"
                        duration: "DIM_MS"
                        opacity: "DIM_TO"
            - rail_route:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_03"
                        duration: "DEPOSIT_MS"
                        opacity: 1
            - mini_route:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_03"
                        duration: "DEPOSIT_MS"
                        opacity: 1

        # ── 4. parallelization ───────────────────────────────────────────────
        route.end @ clear_parallel:
            - g_route:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_route:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_parallel:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 1

        clear_parallel.end @ parallel:
            - parallel_shafts:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - parallel_body:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - parallel_joins:
                  - show:
                        hold:
                            before: "DRAW_MS + FADE_MS"
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - parallel_join_body:
                  - show:
                        hold:
                            before: "DRAW_MS + FADE_MS + DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - rail_parallel:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_04"
                        duration: "DEPOSIT_MS"
                        opacity: 1
            - mini_parallel:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_04"
                        duration: "DEPOSIT_MS"
                        opacity: 1

        # ── 5. orchestrator-workers ──────────────────────────────────────────
        parallel.end @ clear_orchestrate:
            - g_parallel:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_parallel:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_orchestrate:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 1

        clear_orchestrate.end @ orchestrate:
            - orchestrate_fan_a:
                  - show:
                        duration: "FADE_MS"
                        opacity: 1
            - orchestrate_fan_b:
                  - show:
                        hold:
                            before: "RUNTIME_AT"
                        duration: "FADE_MS"
                        opacity: 1
            - orchestrate_joins:
                  - show:
                        hold:
                            before: "RUNTIME_AT + FADE_MS"
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - orchestrate_join_body:
                  - show:
                        hold:
                            before: "RUNTIME_AT + FADE_MS + DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - rail_orchestrate:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_05"
                        duration: "DEPOSIT_MS"
                        opacity: 1
            - mini_orchestrate:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_05"
                        duration: "DEPOSIT_MS"
                        opacity: 1

        # ── 6. evaluator-optimizer ───────────────────────────────────────────
        orchestrate.end @ clear_evaluate:
            - g_orchestrate:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_orchestrate:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_evaluate:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 1

        clear_evaluate.end @ evaluate:
            - evaluate_loop_shafts:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - evaluate_loop_body:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            # The loop RUNS. Two passes, because one exchange is a handoff and
            # three would outlast the sentence.
            - evaluate_pair:
                  - pulse:
                        hold:
                            before: "DRAW_MS + FADE_MS"
                        duration: 900
                        cycles: 2
                        scale:
                            from: 1
                            to: 1.04
                        pivot: center
            - e_ev_out:
                  - show:
                        hold:
                            before: "DRAW_MS + FADE_MS + 900"
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - evaluate_out_body:
                  - show:
                        hold:
                            before: "DRAW_MS + FADE_MS + 900 + DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - rail_evaluate:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_06"
                        duration: "DEPOSIT_MS"
                        opacity: 1
            - mini_evaluate:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_06"
                        duration: "DEPOSIT_MS"
                        opacity: 1

        # ── 7. agents ────────────────────────────────────────────────────────
        evaluate.end @ clear_agent:
            - g_evaluate:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_evaluate:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - lbl_entry_agent:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 1

        clear_agent.end @ agent:
            - agent_loop_shafts:
                  - show:
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - agent_loop_body:
                  - show:
                        hold:
                            before: "DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            # The checkpoint is dashed, so it arrives rather than draws — and
            # arriving is the right verb for it anyway. It is the only edge in
            # the piece that leaves the system.
            - agent_human:
                  - show:
                        hold:
                            before: "DRAW_MS + FADE_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - e_ag_stop:
                  - show:
                        hold:
                            before: "DRAW_MS + FADE_MS + FADE_MS"
                        duration: "DRAW_MS"
                        reveal:
                            from: 0
                            to: 1
            - agent_stop_body:
                  - show:
                        hold:
                            before: "DRAW_MS + FADE_MS + FADE_MS + DRAW_MS"
                        duration: "FADE_MS"
                        opacity: 1
            - rail_agent:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_07"
                        duration: "DEPOSIT_MS"
                        opacity: 1
            - mini_agent:
                  - show:
                        hold:
                            before: "DEPOSIT_AT_07"
                        duration: "DEPOSIT_MS"
                        opacity: 1

        # ── 8. the choice ────────────────────────────────────────────────────
        # The stage empties and the ledger stays. Seven miniatures, all earned,
        # and the only sentence in the piece that is quoted rather than drawn.
        agent.end @ clear_close:
            - g_agent:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0
            - g_entry:
                  - show:
                        duration: "CLEAR_MS"
                        opacity: 0

        clear_close.end @ close:
            - close_body:
                  - show:
                        duration: 900
                        opacity: 1
                        hold:
                            after: VIDEO_MARGIN

    capture:
        video_agent_escalation_animation:
            output: "./resource/video/agent_escalation_brief_animation.mp4"
            fps: 30

composition:
    context:
        status: active

    timeline:
        "0":
            - video_agent_escalation_animation:
                  - roll:
                  - mix:
                        span:
                            from: "animation::source.start"
                        asset: narration_01
                  - mix:
                        span:
                            from: "animation::atom.start"
                        asset: narration_02
                  - mix:
                        span:
                            from: "animation::chain.start"
                        asset: narration_03
                  - mix:
                        span:
                            from: "animation::route.start"
                        asset: narration_04
                  - mix:
                        span:
                            from: "animation::parallel.start"
                        asset: narration_05
                  - mix:
                        span:
                            from: "animation::orchestrate.start"
                        asset: narration_06
                  - mix:
                        span:
                            from: "animation::evaluate.start"
                        asset: narration_07
                  - mix:
                        span:
                            from: "animation::agent.start"
                        asset: narration_08
                  - mix:
                        span:
                            from: "animation::close.start"
                        asset: narration_09

    capture:
        video_agent_escalation:
            output: "./agent_escalation_brief.mp4"
            fps: 30
