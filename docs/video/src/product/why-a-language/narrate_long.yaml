# ------------------------------------------
# why-a-language — Audio Generation: the LONG cut
# ------------------------------------------
# Thirteen lines. This is the long cut: each of scene 2's and scene 3's lines
# names every box in its section out loud.
#
# ⚡ EACH CUT OWNS ITS WHOLE SCRIPT. This document lists every line the long cut
# speaks — nothing is borrowed from the other cut, and two lines that happen to
# be word-for-word identical across the two are stored twice on purpose. A cut
# you can read and rebuild without cross-referencing the other one is worth the
# duplication.
#
#     kinaigraph narrate_long.yaml
#
# Needs ELEVENLABS_API_KEY. Every run costs credits, and re-running this
# re-records EVERY line listed — `synthesis.context.status` is section-wide.
#
# ⚡ `for y in scene_*.yaml` IS SAFE — nothing in that namespace bills. This
# document does, and it is not a scene.

metadata:
    title: "Why a Language - Audio Generation (long cut)"
    description: "Every line the long cut speaks"
    version: "1.0"

defs:
    assets:
        elevenlabs_credentials:
            type: "credentials"
            env: "ELEVENLABS_API_KEY"

    defaults:
        tts:
            provider: "elevenlabs"
            credentials: "elevenlabs_credentials"
            voice: "Uh6UEmMIUnnL0GOOUghh" # Ray

synthesis:
    context:
        status: active

    tts:
        scene_01_01_premise:
            file: "./resource/script/long/scene_01_01_premise.txt"
            export: "./resource/audio/long/scene_01_01_premise.mp3"
        scene_02_01_intro:
