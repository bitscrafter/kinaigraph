animation:
  context:
    status: active

  timeline:
    # 0. Initial state.
    #
    # Every actor the timeline later fades in from 0.0 is hidden here, at t=0,
    # explicitly. The alternative — letting the SVG (or its stylesheet) ship the
    # actor already invisible — states the intent in a different file from the
    # `show` that undoes it, and leaves the DSL reading as though the fade began
    # from whatever was there. A `show` with no `duration` is immediate
    # (lang spec §6.2, `duration` default `0`), so this costs no timeline time.
    #
    # Add a target here whenever you add a `show` whose opacity starts at 0.0.
    0 @ step_init:
      - title_text:
          - show:
              opacity: 0.0

    # 1. Intro
    delayMargin @ step_intro:
      #      - pointer:
      #          - move: { x: "title-line2:bottom", y: "title-line2:bottom", offset-y: 20 }
      #          - show: { duration: intro.duration / 2, opacity: { to: 1.0 } }
      #          - show: { duration: intro.duration / 2, opacity: { to: 0.0 } }
      - title_text:
          # - snapshot: original-title-state
          - show:
              duration: part_01_intro.duration / 4
              opacity:
                from: 0.0
                to: 1.0
          # - show:
          #     {
          #       duration: part_01_intro.duration / 2,
          #       opacity: { from: 1.0, to: 1.0 },
          #     }
          # - show:
          #     {
          #       duration: part_01_intro.duration / 4,
          #       opacity: { to: 0.0 },
          #     }
          # TODO: This has a bug, doesn't work
      #          - show: { duration: part_01_intro.duration / 2, restore: original-title-state }
      - hexagon:
          - pulse:
              stroke: 'css("pulse-to")'
              cycles: 4
              stroke_width: 5
              duration: part_01_intro.duration
      - all_ports:
          - pulse:
              stroke: 'css("pulse-to-solid")'
              cycles: 4
              stroke_width: 5
              duration: part_01_intro.duration
      - all_adapters:
          - pulse:
              stroke: 'css("pulse-to-solid")'
              cycles: 4
              stroke_width: 5
              duration: part_01_intro.duration
      - all_layers:
          - pulse:
              stroke: 'css("pulse-to-solid")'
              cycles: 4
              stroke_width: 5
              duration: part_01_intro.duration
      - all_subsystems:
          - pulse:
              stroke: 'css("pulse-to-solid")'
              cycles: 4
              stroke_width: 5
              duration: part_01_intro.duration

    # 2. Hexagonal Architecture
    step_intro.end + delayBetweenSteps @ step_hex_architecture:
      - hexagon:
          - pulse:
              stroke: 'css("pulse-to")'
              cycles: 4
              stroke_width: 5
              duration: part_02_hex_architecture.duration
      - all_ports:
          - pulse:
              stroke: 'css("pulse-to-solid")'
              cycles: 4
              stroke_width: 5
              duration: part_02_hex_architecture.duration
      - all_adapters:
          - pulse:
              stroke: 'css("pulse-to-solid")'
              cycles: 4
              stroke_width: 5
              duration: part_02_hex_architecture.duration
    #              cycles: 2
    #              stroke_width:
    #                from: 1
    #                to: 5

    # Port+Adapter Pairs
    # 2.1. Media Encoding
    step_hex_architecture.end + delayBetweenSteps @ step_hex_1:
      #      - pointer:
      #          - move: { x: "port-media-encoding:right", y: "port-media-encoding:center", offset-x: 30 }
      #          - show: { duration: part_03_adapter_1.duration / 2, opacity: { to: 1.0 } }
      #          - show: { duration: part_03_adapter_1.duration / 2, opacity: { to: 0.0 } }
      - port-media-encoding:
          - pulse:
              stroke: 'css("pulse-to-solid")'
              stroke_width: 5
              duration: part_03_adapter_1.duration
              cycles: 2
      - adapter-ffmpeg-box:
          - pulse:
              stroke: 'css("pulse-to-solid")'
              stroke_width: 5
              duration: part_03_adapter_1.duration
              cycles: 2
      - adapter-ffmpeg-line:
          - pulse:
              stroke: 'css("pulse-to")'
              stroke_width: 5
              duration: part_03_adapter_1.duration
              cycles: 2

    # 2.2. Browser Automation
    step_hex_1.end + delayBetweenSteps @ step_hex_2:
      #      - pointer:
      #          - move: { x: "port-browser-automation:right", y: "port-browser-automation:center", offset-x: 30 }
