      fps: 30

composition:
  context:
    status: active

  timeline:
    # Roll the rendered animation as the base video, then mix each narration
    # clip onto it at the moment its animation step begins. The start times are
    # pulled cross-section from the animation bookmarks (qualified `animation::`).
    0:
      - structural_layers_full_silent:
          - roll:
              actions:
                - mix:
                    asset: part_01_intro
                    span:
                      from: "animation::step_intro.start"
                      to: "animation::step_intro.end"
                - mix:
                    asset: part_02_hex_architecture
                    span:
                      from: "animation::step_hex_architecture.start"
                      to: "animation::step_hex_architecture.end"
                - mix:
                    asset: part_03_adapter_1
                    span:
                      from: "animation::step_hex_1.start"
                      to: "animation::step_hex_1.end"
                - mix:
                    asset: part_04_adapter_2
