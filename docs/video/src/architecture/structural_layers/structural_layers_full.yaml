    #                to: 2

    # 5. Conclusion
    step_layer_3.end + delayBetweenSteps @ step_conclusion:
      - hexagon:
          - pulse:
              stroke: 'css("pulse-to")'
              cycles: 4
              stroke_width: 5
              duration: part_20_conclusion.duration
      - all_ports:
          - pulse:
              stroke: 'css("pulse-to-solid")'
              cycles: 4
