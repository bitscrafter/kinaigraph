              stroke_width: 5
              duration: part_08_adapter_6.duration
              cycles: 2

    # 3. Subsystems
    step_hex_6.end + delayBetweenSteps @ step_sub_intro:
      #      - pointer:
      #          - move: { x: "subsystems-title:right", y: "subsystems-title:center", offset-x: 30 }
      #          - show: { duration: part_09_subsystems_intro.duration / 2, opacity: 1.0 }
      #          - show: { duration: part_09_subsystems_intro.duration / 2, opacity: 0.0 }
      - all_subsystems:
          - pulse:
              stroke: 'css("pulse-to-solid")'
              stroke_width: 5
              duration: part_09_subsystems_intro.duration
              cycles: 3

    step_sub_intro.end + delayBetweenSteps @ step_sub_1:
      #      - pointer:
      #          - move: { x: "subsystem-syntax:center", y: "subsystems-title:center", offset-y: 20 }
