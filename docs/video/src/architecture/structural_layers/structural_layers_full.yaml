# ------------------------------------------
# Kinaigraph Architecture - Structural Layers
# ------------------------------------------

metadata:
  title: "Kinaigraph Architecture"
  description: "The structural layers of the Kinaigraph architecture: applications, ports and adapters, subsystems, and the model, use-case and infrastructure layers"
  version: "1.0"

defs:
  assets:
    diagram:
      type: "scene"
      file: "./resource/scene/structural_layers.svg"

    template:
      type: "template"
      file: "./resource/template/animation-template.html"
      # The active style+theme is selected once, in defs.defaults below, so
      # that exactly one style is in scope (keeps css() lookups unambiguous).

    style:
      type: "style"
      file: "./resource/style/animation-theme.css"
      themes:
        - dark
        - light
        - zoned

    # Credentials for TTS (assuming environment variable is set)
    elevenlabs_credentials:
      type: "credentials"
      env: "ELEVENLABS_API_KEY"

    # Groups — migrated from defs.groups to defs.assets entries of type "group"
    all_ports:
      type: "group"
      members:
        - port-media-encoding
        - port-browser-automation
        - port-asset-reading
        - port-expression-evaluation
        - port-media-inspection
        - port-speech-synthesis
    all_adapters:
      type: "group"
      members:
        - adapter-ffmpeg-box
        - adapter-cdp-box
        - adapter-filesystem-box
        - adapter-evaluator-box
        - adapter-ffprobe-box
        - adapter-tts-box
    all_subsystems:
      type: "group"
      members:
        - subsystem-syntax
        - subsystem-semantic
        - subsystem-resolution
        - subsystem-bytecode
        - subsystem-dependency
        - subsystem-instruction
    all_layers:
      type: "group"
      members:
        - layer-infra
        - layer-usecase
        - layer-model
    layer_infra_ring:
      type: "group"
      members:
        - layer-infra
    layer_usecase_ring:
      type: "group"
      members:
        - layer-usecase
    layer_model_ring:
      type: "group"
      members:
        - layer-model
    title_text:
      type: "group"
      members:
        - title-line1
        - title-line2
        - title-line3

  const:
    delayMargin: 200
    delayBetweenSteps: 250

  defaults:
    # Default active template + theme (cascade tier: defs.defaults). The
    # template selection carries the style+theme that activates the `dark`
    # theme for the whole document. Switch this single word to `light` to
    # re-brand both the static SVG styling and the baked css() pulse colors —
    # no other DSL edits, zero color literals in the YAML. The theme is set on
    # exactly ONE in-scope style reference (the template) to keep css() lookups
    # unambiguous.
    assets:
      template:
        asset: template
        style:
          asset: style
          theme: zoned
    tts:
      provider: "elevenlabs"
      credentials: "elevenlabs_credentials"
      voice: "Uh6UEmMIUnnL0GOOUghh" # Ray
      #voice: "vr5WKaGvRWsoaX5LCVax" # Cherie
      #voice: "c8GqgOMlDjKmhWVDfhvI" # Kennedy
    # NOTE: `defs.defaults` carries assets | capture | tts | text | image |
    # overlay. There is no per-ACTION category, so the pulse shape below is
    # declared at each `pulse:` use site rather than defaulted here.
    #
    # The pulse *stroke color* could not have been defaulted here in any case:
    # `css("…")` reads themed values from a style selected on a scene or
    # template, and `defs.defaults` is not a style-in-scope position, so a
    # `css()` stroke here fails resolution (CssFunctionFailureKind::
    # StyleNotInScope). No color literals live in the DSL.

